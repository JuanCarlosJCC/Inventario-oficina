<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICI - Control de Inventario</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-size-base: clamp(14px, 1vw, 18px);
        }

        html, body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: var(--font-size-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(5, 7, 14, 0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(129, 140, 248, 0.7); }

        @keyframes modalSpring {
            0% { opacity: 0; transform: scale(0.95) translateY(16px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal-spring { animation: modalSpring 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes tabFade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-tab { animation: tabFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes ambientGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.08); }
        }
        .bg-glow-effect { animation: ambientGlow 10s ease-in-out infinite; }

        @keyframes toastProgress {
            from { width: 100%; }
            to { width: 0%; }
        }
        .animate-toast-bar { animation: toastProgress 3.8s linear forwards; }

        .glow-neon-indigo { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .glow-neon-indigo:hover { 
            border-color: rgba(99, 102, 241, 0.8); 
            box-shadow: 0 0 30px -5px rgba(99, 102, 241, 0.35); 
            transform: translateY(-2px); 
        }

        .glow-neon-emerald { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .glow-neon-emerald:hover { 
            border-color: rgba(16, 185, 129, 0.8); 
            box-shadow: 0 0 30px -5px rgba(16, 185, 129, 0.35); 
            transform: translateY(-2px); 
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
        }

        .btn-haptic {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-haptic:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body id="body-main" class="selection:bg-indigo-500 selection:text-white antialiased bg-[#05070E] text-slate-100 min-h-screen relative overflow-x-hidden">
    
    <div id="ambient-glows" className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div className="absolute -top-40 -left-40 w-[30rem] h-[30rem] bg-indigo-600/15 rounded-full blur-[140px] bg-glow-effect"></div>
        <div className="absolute top-1/3 -right-40 w-[30rem] h-[30rem] bg-purple-600/15 rounded-full blur-[140px] bg-glow-effect" style={{ animationDelay: '3.5s' }}></div>
        <div className="absolute -bottom-40 left-1/3 w-[30rem] h-[30rem] bg-emerald-600/10 rounded-full blur-[140px] bg-glow-effect" style={{ animationDelay: '6s' }}></div>
    </div>

    <div id="root" className="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback, memo } = React;

        const SUPABASE_URL = 'https://oceaobdjhbnrusparxvp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GRoHl1gsQ9Ploya6veF_EA_VRtfQb73';

        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        const Tooltip = memo(({ text, position = 'top', children }) => {
            const [show, setShow] = useState(false);

            const posClasses = {
                top: 'bottom-full left-1/2 -translate-x-1/2 mb-2',
                bottom: 'top-full left-1/2 -translate-x-1/2 mt-2',
                left: 'right-full top-1/2 -translate-y-1/2 mr-2',
                right: 'left-full top-1/2 -translate-y-1/2 ml-2'
            };

            const arrowClasses = {
                top: 'top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-slate-900/95',
                bottom: 'bottom-full left-1/2 -translate-x-1/2 -mb-1 border-4 border-transparent border-b-slate-900/95',
                left: 'left-full top-1/2 -translate-y-1/2 -ml-1 border-4 border-transparent border-l-slate-900/95',
                right: 'right-full top-1/2 -translate-y-1/2 -mr-1 border-4 border-transparent border-r-slate-900/95'
            };

            return (
                <div className="relative inline-block" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
                    {children}
                    {show && (
                        <div className={`absolute ${posClasses[position] || posClasses.top} px-3 py-1 bg-slate-900/95 text-slate-100 text-[11px] font-bold rounded-lg shadow-xl border border-indigo-500/40 backdrop-blur-md whitespace-nowrap z-50 pointer-events-none transition-all duration-150 animate-tab`}>
                            {text}
                            <div className={`absolute ${arrowClasses[position] || arrowClasses.top}`}></div>
                        </div>
                    )}
                </div>
            );
        });

        const Avatar = memo(({ nombre }) => {
            const obtenerIniciales = (str) => {
                if (!str) return '??';
                const partes = str.trim().split(' ').filter(Boolean);
                if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
                return str.substring(0, 2).toUpperCase();
            };

            const gradientes = [
                'from-indigo-600 to-violet-600 shadow-indigo-900/40',
                'from-emerald-600 to-teal-600 shadow-emerald-900/40',
                'from-amber-600 to-orange-600 shadow-amber-900/40',
                'from-rose-600 to-pink-600 shadow-rose-900/40',
                'from-cyan-600 to-blue-600 shadow-cyan-900/40'
            ];

            const hash = nombre ? nombre.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0) : 0;
            const gradienteElegido = gradientes[hash % gradientes.length];

            return (
                <Tooltip text={`Colaborador: ${nombre || 'Sin nombre'}`}>
                    <div className={`w-8 h-8 rounded-full bg-gradient-to-br ${gradienteElegido} flex items-center justify-center text-[11px] font-black text-white shadow-md border border-white/20 shrink-0 transition-transform duration-300 hover:scale-105 cursor-pointer`}>
                        {obtenerIniciales(nombre)}
                    </div>
                </Tooltip>
            );
        });

        const SkeletonRow = memo(() => (
            <tr className="animate-pulse border-b border-slate-800/40">
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-24"></div></td>
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-20"></div></td>
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-28"></div></td>
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-32"></div></td>
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-16"></div></td>
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-28"></div></td>
                <td className="p-4 text-center"><div className="h-6 bg-slate-800/80 rounded-xl w-20 mx-auto"></div></td>
            </tr>
        ));

        function InventoryApp() {
            const [usuarioSesion, setUsuarioSesion] = useState(null);
            const [loginUser, setLoginUser] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState('');

            const [modoClaro, setModoClaro] = useState(() => {
                return localStorage.getItem('tema_inventario') === 'claro';
            });

            const [productos, setProductos] = useState([]);
            const [personalList, setPersonalList] = useState([]);
            const [usuariosList, setUsuariosList] = useState([]);
            const [categoriasList, setCategoriasList] = useState([]);
            const [cargosList, setCargosList] = useState([]);
            const [rolesList, setRolesList] = useState([]);
            const [seriesList, setSeriesList] = useState([]);
            const [loading, setLoading] = useState(true);
            
            const [busquedaInput, setBusquedaInput] = useState('');
            const [busqueda, setBusqueda] = useState('');
            const [filtroCategoria, setFiltroCategoria] = useState('TODAS');

            const [modalAbierto, setModalAbierto] = useState(false);
            const [seccionSeleccionada, setSeccionSeleccionada] = useState(null);
            const [tabActiva, setTabActiva] = useState('asignar');
            const [mostrarHistorial, setMostrarHistorial] = useState(true);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success', key: 0 });

            const [lotesExpandidosMap, setLotesExpandidosMap] = useState({});
            const [colaboradoresExpandidosMap, setColaboradoresExpandidosMap] = useState({});
            const [productosExpandidosMap, setProductosExpandidosMap] = useState({});

            const [devolviendoKey, setDevolviendoKey] = useState(null);
            const [cantDevolver, setCantDevolver] = useState(1);
            const [editandoObsKey, setEditandoObsKey] = useState(null);
            const [nuevaObsTexto, setNuevaObsTexto] = useState('');
            
            const [creandoCategoria, setCreandoCategoria] = useState(false);
            const [nuevaCatNombre, setNuevaCatNombre] = useState('');
            
            const [creandoCargo, setCreandoCargo] = useState(false);
            const [nuevoCargoNombre, setNuevoCargoNombre] = useState('');

            const [creandoRol, setCreandoRol] = useState(false);
            const [nuevoRolNombre, setNuevoRolNombre] = useState('');

            const [creandoSerie, setCreandoSerie] = useState(false);
            const [nuevaSerieNombre, setNuevaSerieNombre] = useState('');

            const [productoExistenteSKU, setProductoExistenteSKU] = useState('');
            const [formProducto, setFormProducto] = useState({ categoria: '', producto: '', cantidad: '', observaciones: '', serie: '' });
            const [formRestock, setFormRestock] = useState({ sku: '', serie: '', cantidadExtra: '' });
            const [skuADeshabilitar, setSkuADeshabilitar] = useState('');
            const [serieADeshabilitar, setSerieADeshabilitar] = useState('TODAS');
            const [formPersonal, setFormPersonal] = useState({ nombre: '', cargo: '' });
            
            const [formNuevoUsuario, setFormNuevoUsuario] = useState({
                username: '',
                password: '',
                nombre: '',
                rol: 'OPERADOR',
                permisos: { asignar: true, productos: true, deshabilitados: true, personal: true }
            });

            const [usuarioEditando, setUsuarioEditando] = useState(null);
            const [formEditarUsuario, setFormEditarUsuario] = useState({ 
                nombre: '', 
                username: '', 
                password: '', 
                rol: 'OPERADOR',
                permisos: { asignar: true, productos: true, deshabilitados: true, personal: true } 
            });

            const [prodSeleccionadosAsigMap, setProdSeleccionadosAsigMap] = useState({});
            const [personalSeleccionados, setPersonalSeleccionados] = useState([]);
            const [obsAsignacion, setObsAsignacion] = useState('');

            useEffect(() => {
                const body = document.getElementById('body-main');
                if (modoClaro) {
                    body.classList.remove('bg-[#05070E]', 'text-slate-100');
                    body.classList.add('bg-slate-100', 'text-slate-900');
                    localStorage.setItem('tema_inventario', 'claro');
                } else {
                    body.classList.remove('bg-slate-100', 'text-slate-900');
                    body.classList.add('bg-[#05070E]', 'text-slate-100');
                    localStorage.setItem('tema_inventario', 'oscuro');
                }
            }, [modoClaro]);

            const toggleTema = () => {
                setModoClaro(prev => !prev);
            };

            useEffect(() => {
                const timer = setTimeout(() => {
                    setBusqueda(busquedaInput);
                }, 180);
                return () => clearTimeout(timer);
            }, [busquedaInput]);

            const mostrarToast = useCallback((message, type = 'success') => {
                setToast({ show: true, message, type, key: Date.now() });
                setTimeout(() => setToast(prev => ({ ...prev, show: false })), 3800);
            }, []);

            const fetchData = useCallback(async () => {
                if (!supabase) return;
                setLoading(true);
                try {
                    const [
                        { data: prodData },
                        { data: persData },
                        { data: userData },
                        { data: catData },
                        { data: cargoData },
                        { data: rolesData },
                        { data: seriesData }
                    ] = await Promise.all([
                        supabase.from('productos').select('*').order('id', { ascending: false }),
                        supabase.from('personal').select('*').order('nombre', { ascending: true }),
                        supabase.from('usuarios').select('*').order('id', { ascending: true }),
                        supabase.from('categorias').select('*').order('nombre', { ascending: true }),
                        supabase.from('cargos').select('*').order('nombre', { ascending: true }),
                        supabase.from('roles').select('*').order('nombre', { ascending: true }),
                        supabase.from('series').select('*').order('nombre', { ascending: true })
                    ]);

                    setProductos(prodData || []);
                    setPersonalList(persData || []);
                    setUsuariosList(userData || []);
                    setSeriesList(seriesData || []);
                    
                    if (catData && catData.length > 0) {
                        setCategoriasList(catData);
                    } else if (prodData) {
                        const unicas = Array.from(new Set(prodData.map(p => p.categoria).filter(Boolean)));
                        setCategoriasList(unicas.map((c, i) => ({ id: i + 1, nombre: c })));
                    }

                    if (cargoData && cargoData.length > 0) {
                        setCargosList(cargoData);
                    } else if (persData) {
                        const unicos = Array.from(new Set(persData.map(p => p.cargo).filter(Boolean)));
                        setCargosList(unicos.map((c, i) => ({ id: i + 1, nombre: c })));
                    }

                    if (rolesData && rolesData.length > 0) {
                        setRolesList(rolesData);
                    } else {
                        setRolesList([{ id: 1, nombre: 'OPERADOR' }, { id: 2, nombre: 'ADMINISTRADOR' }]);
                    }
                } catch (error) {
                    console.error('Error al cargar datos:', error);
                }
                setLoading(false);
            }, []);

            useEffect(() => {
                const sesionGuardada = localStorage.getItem('sesion_inventario');
                if (sesionGuardada) {
                    const userObj = JSON.parse(sesionGuardada);
                    setUsuarioSesion(userObj);
                    ajustarTabInicial(userObj);
                }
                fetchData();
            }, [fetchData]);

            const ajustarTabInicial = (user) => {
                if (!user) return;
                if (user.rol === 'ADMIN_PRINCIPAL') {
                    setTabActiva('asignar');
                    return;
                }
                const p = user.permisos || {};
                if (p.asignar) setTabActiva('asignar');
                else if (p.productos) setTabActiva('productos');
                else if (p.deshabilitados) setTabActiva('deshabilitados');
                else if (p.personal) setTabActiva('personal');
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                try {
                    const { data, error } = await supabase
                        .from('usuarios')
                        .select('*')
                        .eq('username', loginUser.trim())
                        .eq('password', loginPass.trim())
                        .single();

                    if (error || !data) {
                        setLoginError('Usuario o contraseña incorrectos.');
                        return;
                    }

                    setUsuarioSesion(data);
                    localStorage.setItem('sesion_inventario', JSON.stringify(data));
                    ajustarTabInicial(data);
                    mostrarToast(`Bienvenido/a, ${data.nombre}`);
                } catch (err) {
                    setLoginError('Error de conexión con el servidor.');
                }
            };

            const handleLogout = () => {
                setUsuarioSesion(null);
                localStorage.removeItem('sesion_inventario');
            };

            const handleCrearUsuario = async (e) => {
                e.preventDefault();
                const nuevoUserObj = {
                    username: formNuevoUsuario.username.trim(),
                    password: formNuevoUsuario.password.trim(),
                    nombre: formNuevoUsuario.nombre.trim(),
                    rol: formNuevoUsuario.rol,
                    permisos: formNuevoUsuario.permisos
                };
                try {
                    const { data, error } = await supabase.from('usuarios').insert([nuevoUserObj]).select();

                    if (error) {
                        mostrarToast(`Error: ${error.message}`, 'error');
                    } else {
                        mostrarToast('Usuario registrado con éxito.');
                        if (data && data[0]) {
                            setUsuariosList(prev => [...prev, data[0]]);
                        } else {
                            fetchData();
                        }
                        setFormNuevoUsuario({
                            username: '',
                            password: '',
                            nombre: '',
                            rol: 'OPERADOR',
                            permisos: { asignar: true, productos: true, deshabilitados: true, personal: true }
                        });
                    }
                } catch (err) {
                    mostrarToast('Error al crear usuario.', 'error');
                }
            };

            const handleIniciarEdicionUsuario = useCallback((user) => {
                setUsuarioEditando(user);
                setFormEditarUsuario({
                    nombre: user.nombre,
                    username: user.username,
                    password: user.password,
                    rol: user.rol,
                    permisos: user.permisos || { asignar: true, productos: true, deshabilitados: true, personal: true }
                });
            }, []);

            const handleGuardarCambiosUsuario = async (e) => {
                e.preventDefault();
                if (!usuarioEditando) return;

                const datosActualizar = {
                    nombre: formEditarUsuario.nombre.trim(),
                    username: formEditarUsuario.username.trim(),
                    password: formEditarUsuario.password.trim(),
                    rol: formEditarUsuario.rol,
                    permisos: formEditarUsuario.permisos
                };

                const anteriorEstado = [...usuariosList];
                setUsuariosList(prev => prev.map(u => u.id === usuarioEditando.id ? { ...u, ...datosActualizar } : u));

                try {
                    const { error } = await supabase
                        .from('usuarios')
                        .update(datosActualizar)
                        .eq('id', usuarioEditando.id);

                    if (error) {
                        mostrarToast(`Error: ${error.message}`, 'error');
                        setUsuariosList(anteriorEstado);
                    } else {
                        mostrarToast('Usuario y permisos actualizados correctamente.');
                        if (usuarioEditando.id === usuarioSesion.id) {
                            const sesionActualizada = { ...usuarioSesion, ...datosActualizar };
                            setUsuarioSesion(sesionActualizada);
                            localStorage.setItem('sesion_inventario', JSON.stringify(sesionActualizada));
                        }
                        setUsuarioEditando(null);
                    }
                } catch (err) {
                    mostrarToast('Error al guardar datos.', 'error');
                    setUsuariosList(anteriorEstado);
                }
            };

            const handleTogglePermisoDirecto = useCallback(async (user, permisoKey) => {
                const permisosAnteriores = user.permisos || { asignar: true, productos: true, deshabilitados: true, personal: true };
                const nuevosPermisos = {
                    ...permisosAnteriores,
                    [permisoKey]: !permisosAnteriores[permisoKey]
                };

                setUsuariosList(prev => prev.map(u => u.id === user.id ? { ...u, permisos: nuevosPermisos } : u));

                try {
                    const { error } = await supabase
                        .from('usuarios')
                        .update({ permisos: nuevosPermisos })
                        .eq('id', user.id);

                    if (error) {
                        mostrarToast('Error al cambiar permisos.', 'error');
                        fetchData();
                    } else {
                        mostrarToast(`Permisos de ${user.nombre} actualizados.`);
                    }
                } catch (err) {
                    mostrarToast('Error al cambiar permisos.', 'error');
                    fetchData();
                }
            }, [fetchData, mostrarToast]);

            const handleEliminarUsuario = useCallback(async (idUser, nombre) => {
                if (idUser === usuarioSesion.id) {
                    mostrarToast('No puedes eliminar tu propio usuario en sesión.', 'error');
                    return;
                }
                if (!window.confirm(`¿Eliminar al usuario "${nombre}"?`)) return;

                setUsuariosList(prev => prev.filter(u => u.id !== idUser));

                try {
                    const { error } = await supabase.from('usuarios').delete().eq('id', idUser);
                    if (error) {
                        mostrarToast('Error al eliminar usuario.', 'error');
                        fetchData();
                    } else {
                        mostrarToast('Usuario eliminado.');
                    }
                } catch (err) {
                    mostrarToast('Error al eliminar usuario.', 'error');
                    fetchData();
                }
            }, [usuarioSesion, fetchData, mostrarToast]);

            const tienePermiso = useCallback((clave) => {
                if (!usuarioSesion) return false;
                if (usuarioSesion.rol === 'ADMIN_PRINCIPAL') return true;
                return !!usuarioSesion.permisos?.[clave];
            }, [usuarioSesion]);

            const formatearFechaClean = useCallback((item) => {
                const rawFecha = item.fecha_asignacion || item.created_at || item.fecha;
                if (!rawFecha) return { fechaStr: 'S/F', horaStr: '--:--' };
                const fecha = new Date(rawFecha);
                if (isNaN(fecha.getTime())) return { fechaStr: 'S/F', horaStr: '--:--' };

                const fechaStr = fecha.toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' });
                const horaStr = fecha.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', hour12: true });

                return { fechaStr, horaStr };
            }, []);

            const productosActivos = useMemo(() => productos.filter(p => p.activo !== false), [productos]);

            const productosUnicosGlobalList = useMemo(() => {
                const mapPadres = {};

                productos.forEach(curr => {
                    const sku = curr.sku;
                    const cant = Number(curr.cantidad) || 0;
                    const serieKey = curr.serie ? curr.serie.trim().toUpperCase() : 'SIN_SERIE';

                    if (!mapPadres[sku]) {
                        mapPadres[sku] = {
                            sku: curr.sku,
                            producto: curr.producto,
                            categoria: curr.categoria,
                            cantidadTotal: 0,
                            cantidadLibre: 0,
                            cantidadUso: 0,
                            cantidadDeshabilitada: 0,
                            seriesHijosMap: {}
                        };
                    }

                    mapPadres[sku].cantidadTotal += cant;

                    if (curr.activo === false) {

            const handleImportarCSV = useCallback(async (e) => {
                const archivo = e.target.files[0];
                if (!archivo) return;

                const lector = new FileReader();
                lector.onload = async (evento) => {
                    try {
                        const texto = evento.target.result;
                        const lineas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        if (lineas.length < 2) {
                            mostrarToast('El archivo está vacío o no tiene un formato válido.', 'error');
                            return;
                        }

                        const { data: dbProductos } = await supabase.from('productos').select('*');
                        const prodActuales = dbProductos || [];

                        let maxSKUNum = 0;
                        prodActuales.forEach(p => {
                            if (p.sku && p.sku.startsWith('PROD-')) {
                                const num = parseInt(p.sku.replace('PROD-', ''), 10);
                                if (!isNaN(num) && num > maxSKUNum) maxSKUNum = num;
                            }
                        });

                        const filas = lineas.slice(1);
                        const promesasUpdates = [];
                        const nuevosInserts = [];
                        let creadosCount = 0;
                        let actualizadosCount = 0;

                        for (const fila of filas) {
                            const separador = fila.includes(';') ? ';' : ',';
                            const columnas = fila.split(separador).map(c => c.trim().replace(/^["']|["']$/g, ''));
                            
                            if (columnas.length >= 3) {
                                let sku = '', serie = '', categoria = '', productoNombre = '', cantidadStr = '', observaciones = '', estadoStr = '';

                                if (columnas.length >= 7) {
                                    [sku, serie, categoria, productoNombre, cantidadStr, observaciones, estadoStr] = columnas;
                                } else if (columnas.length >= 6) {
                                    [sku, serie, categoria, productoNombre, cantidadStr, observaciones] = columnas;
                                } else if (columnas.length >= 5) {
                                    [sku, categoria, productoNombre, cantidadStr, observaciones] = columnas;
                                } else if (columnas.length >= 4) {
                                    [sku, categoria, productoNombre, cantidadStr] = columnas;
                                } else {
                                    [categoria, productoNombre, cantidadStr] = columnas;
                                }

                                const nuevaCant = parseInt(cantidadStr, 10);
                                const skuNorm = sku ? sku.trim().toUpperCase() : '';
                                const serieNorm = serie ? serie.trim().toUpperCase() : null;
                                const esActivo = estadoStr ? estadoStr.toUpperCase() !== 'DESHABILITADO' : true;

                                if (productoNombre && !isNaN(nuevaCant) && nuevaCant >= 0) {
                                    const coincidenciaEspecifica = prodActuales.find(p => p.sku === skuNorm && (p.serie || '').trim().toUpperCase() === (serieNorm || ''));

                                    if (coincidenciaEspecifica) {
                                        promesasUpdates.push(
                                            supabase.from('productos').update({
                                                categoria: categoria || coincidenciaEspecifica.categoria,
                                                producto: productoNombre,
                                                cantidad: nuevaCant,
                                                observaciones: observaciones !== undefined ? observaciones : coincidenciaEspecifica.observaciones,
                                                activo: esActivo
                                            }).eq('id', coincidenciaEspecifica.id)
                                        );
                                        actualizadosCount++;
                                    } else {
                                        if (!skuNorm) maxSKUNum++;
                                        const nuevoSKU = skuNorm || `PROD-${String(maxSKUNum).padStart(3, '0')}`;

                                        nuevosInserts.push({
                                            sku: nuevoSKU,
                                            categoria: categoria || 'General',
                                            producto: productoNombre,
                                            serie: serieNorm,
                                            cantidad: nuevaCant,
                                            observaciones: observaciones || 'Importado vía CSV',
                                            personal_asignado: '',
                                            activo: esActivo,
                                            fecha_asignacion: new Date().toISOString()
                                        });
                                        creadosCount++;
                                    }
                                }
                            }
                        }

                        if (nuevosInserts.length > 0) {
                            promesasUpdates.push(supabase.from('productos').insert(nuevosInserts));
                        }

                        await Promise.all(promesasUpdates);
                        await fetchData();
                        mostrarToast(`Sincronización finalizada: ${actualizadosCount} actualizados, ${creadosCount} creados.`);
                        e.target.value = '';
                    } catch (err) {
                        console.error(err);
                        mostrarToast('Error al procesar el archivo CSV.', 'error');
                    }
                };
                lector.readAsText(archivo, 'UTF-8');
            }, [fetchData, mostrarToast]);

                                cantidad: Number(curr.cantidad) || 0,
                                observaciones: curr.observaciones,
                                personal_asignado: curr.personal_asignado,
                                fecha_asignacion: curr.fecha_asignacion || curr.created_at
                            };
                        } else {
                            acc[pers][skuKey].cantidad += Number(curr.cantidad) || 0;
                            acc[pers][skuKey].ids.push(curr.id);
                            if (new Date(curr.fecha_asignacion || curr.created_at) > new Date(acc[pers][skuKey].fecha_asignacion)) {
                                acc[pers][skuKey].fecha_asignacion = curr.fecha_asignacion || curr.created_at;
                                acc[pers][skuKey].observaciones = curr.observaciones;
                            }
                        }
                        return acc;
                    }, {});

                return Object.entries(mapTemp).reduce((acc, [colab, objSKUs]) => {
                    acc[colab] = Object.values(objSKUs);
                    return acc;
                }, {});
            }, [productosActivos]);

            const handleSaveProducto = async (e) => {
                e.preventDefault();
                
                const cantNum = Number(formProducto.cantidad);
                if (isNaN(cantNum) || cantNum < 1) {
                    mostrarToast('Debes ingresar una cantidad válida (mínimo 1 unidad).', 'error');
                    return;
                }

                if (productoExistenteSKU && !formProducto.serie.trim()) {
                    mostrarToast('Debes ingresar la nueva serie para este producto.', 'error');
                    return;
                }

                const skuAsignado = productoExistenteSKU ? productoExistenteSKU : generarSKU();
                const serieLimpia = formProducto.serie ? formProducto.serie.trim().toUpperCase() : null;

                    sku: skuAsignado,
                    categoria: formProducto.categoria,
                    producto: formProducto.producto,
                    serie: serieLimpia,
                    cantidad: cantNum,
                    observaciones: formProducto.observaciones || 'Ingreso manual',
                    personal_asignado: '',
                    activo: true,
                    fecha_asignacion: new Date().toISOString()
                };

                try {
                    const { data, error } = await supabase.from('productos').insert([nuevoItem]).select();

                        if (serieLimpia) {
                            const serieExisteBD = seriesList.some(s => s.nombre.toUpperCase() === serieLimpia);
                            if (!serieExisteBD) {

                        setProductoExistenteSKU('');

                            setProductos(prev => [data[0], ...prev]);

                        mostrarToast(`Nueva serie agregada al producto. SKU: ${skuAsignado}`);
                    } else {
                        mostrarToast(`Error BD: ${error.message}`, 'error');
                    }
                } catch (err) {
                    mostrarToast('Error al registrar el producto.', 'error');
                }
            };

            const handleRestockProducto = async (e) => {
                e.preventDefault();
                if (!formRestock.sku || !formRestock.cantidadExtra || Number(formRestock.cantidadExtra) <= 0) {
                    mostrarToast('Selecciona un producto e ingresa una cantidad válida.', 'error');
                    return;
                }

                const cantidadSumar = Number(formRestock.cantidadExtra);
                const serieElegida = formRestock.serie ? formRestock.serie.trim().toUpperCase() : null;

                const filasExistentes = productos.filter(p => p.sku === formRestock.sku && (p.serie || '').trim().toUpperCase() === (serieElegida || '') && (!p.personal_asignado || p.personal_asignado.trim() === ''));

                if (filasExistentes.length > 0) {
                    const filaPrincipal = filasExistentes[0];
                    const nuevaCant = Number(filaPrincipal.cantidad) + cantidadSumar;

                    setProductos(prev => prev.map(p => p.id === filaPrincipal.id ? { ...p, cantidad: nuevaCant } : p));

                    try {
                        await supabase.from('productos').update({ cantidad: nuevaCant }).eq('id', filaPrincipal.id);
                        setFormRestock({ sku: '', serie: '', cantidadExtra: '' });
                        mostrarToast('¡Stock reabastecido correctamente!');
                    } catch (err) {
                        fetchData();
                        mostrarToast('Error al reabastecer stock', 'error');
                    }
                } else {
                    const prodPadre = productos.find(p => p.sku === formRestock.sku);
                    try {
                        const { data } = await supabase.from('productos').insert([{
                            sku: formRestock.sku,
                            categoria: prodPadre ? prodPadre.categoria : 'General',
                            producto: prodPadre ? prodPadre.producto : formRestock.sku,
                            serie: serieElegida,
                            cantidad: cantidadSumar,
                            observaciones: 'Reabastecido',
                            personal_asignado: '',
                            activo: true,
                            fecha_asignacion: new Date().toISOString()
                        }]).select();

                        if (data && data[0]) setProductos(prev => [data[0], ...prev]);
                        else fetchData();

                        setFormRestock({ sku: '', serie: '', cantidadExtra: '' });
                        mostrarToast('¡Stock reabastecido correctamente!');
                    } catch (err) {
                        fetchData();
                    }
                }
            };

            const handleDeshabilitarProducto = async (e) => {
                e.preventDefault();
                if (!skuADeshabilitar) {
                    mostrarToast('Selecciona un producto.', 'error');
                    return;
                }

                const prodRef = productosUnicosGlobalList.find(p => p.sku === skuADeshabilitar);
                const nombreProd = prodRef ? prodRef.producto : skuADeshabilitar;
                const textoSerie = serieADeshabilitar === 'TODAS' ? 'todas las series de' : `la serie [${serieADeshabilitar}] de`;

                if (!window.confirm(`¿Deshabilitar ${textoSerie} "${nombreProd}" (${skuADeshabilitar})?`)) return;

                setProductos(prev => prev.map(p => {
                    if (p.sku === skuADeshabilitar) {
                        if (serieADeshabilitar === 'TODAS' || (p.serie || 'Sin Serie').trim().toUpperCase() === serieADeshabilitar.toUpperCase()) {
                            return { ...p, activo: false };
                        }
                    }
                    return p;
                }));

                try {
                    let query = supabase.from('productos').update({ activo: false }).eq('sku', skuADeshabilitar);
                    if (serieADeshabilitar !== 'TODAS') {
                        if (serieADeshabilitar === 'SIN SERIE') {
                            query = query.is('serie', null);
                        } else {
                            query = query.eq('serie', serieADeshabilitar);
                        }
                    }

                    const { error } = await query;
                    if (!error) {
                        setSkuADeshabilitar('');
                        setSerieADeshabilitar('TODAS');
                        mostrarToast('Producto / Serie deshabilitado correctamente.');
                    } else {
                        fetchData();
                    }
                } catch (err) {
                    console.error(err);
                    fetchData();
                    mostrarToast('Error al deshabilitar.', 'error');
                }
            };

            const handleReactivarProducto = useCallback(async (itemDeshab) => {
                setProductos(prev => prev.map(p => {
                    if (p.sku === itemDeshab.sku && (p.serie || '') === (itemDeshab.serie || '')) {
                        return { ...p, activo: true };
                    }
                    return p;
                }));

                try {
                    let query = supabase.from('productos').update({ activo: true }).eq('sku', itemDeshab.sku);
                    if (itemDeshab.serie) {
                        query = query.eq('serie', itemDeshab.serie);
                    } else {
                        query = query.is('serie', null);
                    }

                    const { error } = await query;
                    if (!error) {
                        mostrarToast(`Serie [${itemDeshab.serie || 'Sin Serie'}] de (${itemDeshab.sku}) reactivada.`);
                    } else {
                        fetchData();
                    }
                } catch (err) {
                    console.error(err);
                    fetchData();
                }
            }, [fetchData, mostrarToast]);

            const handleEliminarDefinitivo = useCallback(async (itemDeshab) => {
                const textoSerie = itemDeshab.serie ? `Serie [${itemDeshab.serie}]` : 'Sin Serie';
                if (!window.confirm(`¿Estás seguro de ELIMINAR DEFINITIVAMENTE la ${textoSerie} del producto "${itemDeshab.producto}" (${itemDeshab.sku})?`)) return;

                setProductos(prev => prev.filter(p => !(p.sku === itemDeshab.sku && (p.serie || '') === (itemDeshab.serie || ''))));

                    let query = supabase.from('productos').delete().eq('sku', itemDeshab.sku);
                    if (itemDeshab.serie) {
                        query = query.eq('serie', itemDeshab.serie);
                    } else {
                        query = query.is('serie', null);
                    }

                    const { error } = await query;
                    if (!error) {
                        mostrarToast(`${textoSerie} de (${itemDeshab.sku}) eliminada definitivamente.`, 'error');
                    } else {

                } catch (err) {

                    fetchData();

            const toggleProductoPadreSeleccionado = useCallback((skuPadre, seriesDisponibles) => {

                    if (copy[skuPadre]) {

                        const primeraSerie = seriesDisponibles.length > 0 ? seriesDisponibles[0].serie : 'Sin Serie';
                        copy[skuPadre] = {

                    return copy;

            const updateCantAsignacionPadre = useCallback((skuPadre, cant) => {
                const val = Math.max(1, Number(cant) || 1);
                setProdSeleccionadosAsigMap(prev => ({
                    ...prev,
                    [skuPadre]: {
                        ...prev[skuPadre],
                        cantidad: val
                    }
                }));
            }, []);

            const togglePersonalSeleccionado = useCallback((nombre) => {
                setPersonalSeleccionados(prev => 
                    prev.includes(nombre) ? prev.filter(n => n !== nombre) : [...prev, nombre]
                );
            }, []);

            const handleConfirmarAsignacionMultiple = async (e) => {
                e.preventDefault();
                if (!supabase) return;

                const skusSeleccionados = Object.keys(prodSeleccionadosAsigMap);
                if (skusSeleccionados.length === 0 || personalSeleccionados.length === 0) {
                    mostrarToast('Selecciona al menos un producto y un colaborador.', 'error');
                    return;
                }

                try {
                    for (const skuPadre of skusSeleccionados) {
                        const configAsig = prodSeleccionadosAsigMap[skuPadre];
                        const prodPadre = productosPadresLibresAsignacion.find(p => p.sku === skuPadre);
                        if (!prodPadre) continue;

                        const varianteObj = prodPadre.seriesLibres.find(s => (s.serie || 'Sin Serie').trim().toUpperCase() === (configAsig.serieElegida || 'Sin Serie').trim().toUpperCase());

                        const cantPorPersona = Number(configAsig.cantidad) || 1;
                        const requerimientoTotal = cantPorPersona * personalSeleccionados.length;
                        const stockLibreDisponible = varianteObj ? varianteObj.cantidad : 0;

                        if (requerimientoTotal > stockLibreDisponible) {
                            mostrarToast(`No hay suficiente stock libre en la serie [${configAsig.serieElegida}] de "${prodPadre.producto}". Requiere ${requerimientoTotal} unid. y hay ${stockLibreDisponible} libres.`, 'error');
                            return;
                        }
                    }

                    const timestampActualISO = new Date().toISOString();
                    const tagLote = `LOTE-${Date.now()}`;
                    const obsConLote = obsAsignacion ? `${obsAsignacion} (${tagLote})` : `Asignación (${tagLote})`;

                    const promesasDB = [];

                    for (const skuPadre of skusSeleccionados) {
                        const configAsig = prodSeleccionadosAsigMap[skuPadre];
                        const prodPadre = productosPadresLibresAsignacion.find(p => p.sku === skuPadre);
                        if (!prodPadre) continue;

                        const cantPorPersona = Number(configAsig.cantidad) || 1;
                        const serieNombreReal = configAsig.serieElegida === 'Sin Serie' ? null : configAsig.serieElegida;

                        for (const persNombre of personalSeleccionados) {
                            const asignacionExistente = productosActivos.find(
                                p => p.sku === skuPadre && (p.serie || '') === (serieNombreReal || '') && p.personal_asignado === persNombre
                            );

                            if (asignacionExistente) {
                                const nuevaCant = Number(asignacionExistente.cantidad) + cantPorPersona;
                                promesasDB.push(
                                    supabase.from('productos').update({
                                        cantidad: nuevaCant,
                                        observaciones: obsConLote,
                                        fecha_asignacion: timestampActualISO
                                    }).eq('id', asignacionExistente.id)
                                );
                            } else {
                                promesasDB.push(
                                    supabase.from('productos').insert([{
                                        sku: skuPadre,
                                        categoria: prodPadre.categoria,
                                        producto: prodPadre.producto,
                                        serie: serieNombreReal,
                                        cantidad: cantPorPersona,
                                        observaciones: obsConLote,
                                        personal_asignado: persNombre,
                                        activo: true,
                                        fecha_asignacion: timestampActualISO
                                    }])
                                );
                            }
                        }

                        let pendienteDescontar = cantPorPersona * personalSeleccionados.length;
                        const filasStockLibre = productosActivos.filter(
                            p => p.sku === skuPadre && (p.serie || '') === (serieNombreReal || '') && (!p.personal_asignado || p.personal_asignado.trim() === '')
                        );

                        for (const filaLibre of filasStockLibre) {
                            if (pendienteDescontar <= 0) break;
                            const cantFila = Number(filaLibre.cantidad);
                            if (cantFila <= pendienteDescontar) {
                                promesasDB.push(supabase.from('productos').delete().eq('id', filaLibre.id));
                                pendienteDescontar -= cantFila;
                            } else {
                                promesasDB.push(supabase.from('productos').update({ cantidad: cantFila - pendienteDescontar }).eq('id', filaLibre.id));
                                pendienteDescontar = 0;
                            }
                        }
                    }

                    await Promise.all(promesasDB);

                    setProdSeleccionadosAsigMap({});
                    setPersonalSeleccionados([]);
                    setObsAsignacion('');
                    await fetchData();
                    mostrarToast('¡Asignación guardada con éxito!');
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al procesar asignación.', 'error');
                }
            };

            const handleSavePersonal = async (e) => {
                e.preventDefault();
                try {
                    const { data, error } = await supabase.from('personal').insert([{
                        nombre: formPersonal.nombre,

            const handleDevolverTodoColaborador = async (nombreColaborador) => {

                try {
                    const asignacionesDelPersonal = productosActivos.filter(p => p.personal_asignado === nombreColaborador);
                    let totalUnidadesDevueltas = 0;
                    const promesasDB = [];

                    for (const item of asignacionesDelPersonal) {
                        const cantItem = Number(item.cantidad) || 1;
                        totalUnidadesDevueltas += cantItem;

                        const stockLibreExistente = productosActivos.find(p => p.sku === item.sku && (p.serie || '') === (item.serie || '') && (!p.personal_asignado || p.personal_asignado.trim() === ''));

                        if (stockLibreExistente) {

                        } else {
                            promesasDB.push(supabase.from('productos').insert([{
                                sku: item.sku, categoria: item.categoria, producto: item.producto, serie: item.serie || null, cantidad: cantItem, observaciones: 'Devuelto masivo', personal_asignado: '', activo: true, fecha_asignacion: new Date().toISOString()
                            }]));
                        }
                        promesasDB.push(supabase.from('productos').delete().eq('id', item.id));
                    }

                    await Promise.all(promesasDB);
                    await fetchData();
                    mostrarToast(`Se devolvieron ${totalUnidadesDevueltas} unidades de "${nombreColaborador}" al stock libre.`);
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al devolver todos los productos.', 'error');
                }
            };

            const handleEjecutarDevolucionAgrupada = async (asigItem) => {

                if (cantADevolver <= 0 || cantADevolver > asigItem.cantidad) {
                    mostrarToast('Ingresa una cantidad válida a devolver.', 'error');
                    return;
                }

                try {
                    const promesasDB = [];
                    const stockLibreExistente = productosActivos.find(p => p.sku === asigItem.sku && (p.serie || '') === (asigItem.serie || '') && (!p.personal_asignado || p.personal_asignado.trim() === ''));

                    if (stockLibreExistente) {
                        const nuevaCantLibre = Number(stockLibreExistente.cantidad) + cantADevolver;
                        promesasDB.push(supabase.from('productos').update({ cantidad: nuevaCantLibre }).eq('id', stockLibreExistente.id));
                    } else {
                        promesasDB.push(supabase.from('productos').insert([{
                            sku: asigItem.sku,
                            categoria: asigItem.categoria,
                            producto: asigItem.producto,
                            serie: asigItem.serie || null,
                            cantidad: cantADevolver,
                            observaciones: 'Devuelto',
                            personal_asignado: '',
                            activo: true,
                            fecha_asignacion: new Date().toISOString()
                        }]));
                    }

                    let pendiente = cantADevolver;
                    const idsAProcesar = asigItem.ids && asigItem.ids.length > 0 ? asigItem.ids : [asigItem.id];
                    const filasBase = productosActivos.filter(p => idsAProcesar.includes(p.id));

                    for (const fila of filasBase) {
                        if (pendiente <= 0) break;
                        const cantFila = Number(fila.cantidad);

                        if (cantFila <= pendiente) {
                            promesasDB.push(supabase.from('productos').delete().eq('id', fila.id));
                            pendiente -= cantFila;
                        } else {
                            promesasDB.push(supabase.from('productos').update({ cantidad: cantFila - pendiente }).eq('id', fila.id));
                            pendiente = 0;
                        }
                    }

                    await Promise.all(promesasDB);

                    setDevolviendoKey(null);
                    setCantDevolver(1);
                    await fetchData();
                    mostrarToast(`Se devolvieron ${cantADevolver} unidades al stock libre.`);
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al procesar la devolución', 'error');
                }
            };

            const handleGuardarObservacionEditada = async (asigItem) => {
                try {
                    const idsAActualizar = asigItem.ids && asigItem.ids.length > 0 ? asigItem.ids : [asigItem.id];
                    
                    setProductos(prev => prev.map(p => idsAActualizar.includes(p.id) ? { ...p, observaciones: nuevaObsTexto.trim() } : p));

                    const promesasDB = idsAActualizar.map(idReg => 
                        supabase.from('productos').update({ observaciones: nuevaObsTexto.trim() }).eq('id', idReg)

                    fetchData();
                    mostrarToast('Error al actualizar observación.', 'error');

            const handleDeletePersonal = async (persId, persNombre) => {
                if (!window.confirm(`¿Eliminar a "${persNombre}"? Sus equipos volverán a stock libre.`)) return;
                
                try {
                    const asignacionesDelPersonal = productosActivos.filter(p => p.personal_asignado === persNombre);

                    for (const item of asignacionesDelPersonal) {
                        const stockLibreExistente = productosActivos.find(p => p.sku === item.sku && (p.serie || '') === (item.serie || '') && (!p.personal_asignado || p.personal_asignado.trim() === ''));
                        if (stockLibreExistente) {
                            promesasDB.push(supabase.from('productos').update({ cantidad: Number(stockLibreExistente.cantidad) + Number(item.cantidad) }).eq('id', stockLibreExistente.id));
                        } else {

                    promesasDB.push(supabase.from('personal').delete().eq('id', persId));

                    await Promise.all(promesasDB);
                    await fetchData();
                    mostrarToast('Personal eliminado.');

                    console.error(err);
                    mostrarToast('Error al eliminar personal.', 'error');

            const esAdminPrincipal = usuarioSesion && usuarioSesion.rol === 'ADMIN_PRINCIPAL';

            if (!usuarioSesion) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">

                                <h1 className={`text-3xl font-black tracking-widest ${modoClaro ? 'text-slate-800' : 'bg-gradient-to-r from-white via-indigo-100 to-indigo-300 bg-clip-text text-transparent'}`}>SICI</h1>
                                <p className="text-xs text-indigo-500 font-bold uppercase tracking-wider">CONTROL DE INVENTARIO</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                {loginError && (
                                    <div className="p-3.5 bg-rose-950/80 border border-rose-500/40 rounded-2xl text-xs font-bold text-rose-300 text-center shadow-lg">

                                        placeholder="Ingresa tu usuario"

                                        required 
                                    />
                                </div>
                                <div>
                                    <label className={`block text-xs font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Contraseña</label>
                                    <input 
                                        type="password" 
                                        placeholder="••••••••" 
                                        value={loginPass} 
                                        onChange={e => setLoginPass(e.target.value)} 
                                        className={`w-full ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/60 border-slate-700/80 text-white'} border rounded-2xl px-4 py-3 text-sm font-semibold outline-none focus:border-indigo-500 transition-all`} 
                                        required 
                                    />
                                </div>
                                <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-black py-3.5 rounded-2xl shadow-xl shadow-indigo-600/30 cursor-pointer text-sm btn-haptic border border-indigo-400/20">
                                    Iniciar Sesión
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 md:p-8 transition-colors duration-500">
                    {toast.show && (
                        <div key={toast.key} className={`fixed top-6 right-6 z-50 rounded-2xl text-xs font-black shadow-2xl border backdrop-blur-xl transition-all duration-300 animate-tab overflow-hidden ${toast.type === 'error' ? 'bg-rose-950/90 text-rose-200 border-rose-500/40 shadow-rose-950/50' : 'bg-emerald-950/90 text-emerald-200 border-emerald-500/40 shadow-emerald-950/50'}`}>
                            <div className="px-5 py-3.5 flex items-center gap-2">
                                <span>{toast.type === 'error' ? '⚠️' : '✨'}</span>
                                <span>{toast.message}</span>
                            </div>
                            <div className={`h-1 animate-toast-bar ${toast.type === 'error' ? 'bg-rose-400' : 'bg-emerald-400'}`}></div>
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto space-y-6">
                        {/* Cabecera Principal */}
                        <header className={`${modoClaro ? 'bg-white/90 border-slate-200 shadow-xl' : 'glass-panel border-indigo-500/20 shadow-2xl shadow-indigo-950/30'} p-5 md:p-6 rounded-3xl border backdrop-blur-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all relative overflow-hidden`}>
                            <div className="flex items-center gap-4 relative z-10">
                                <Tooltip text="SICI - Sistema de Inventario" position="right">
                                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 via-indigo-600 to-violet-700 flex items-center justify-center text-xl text-white shadow-lg shadow-indigo-500/30 border border-white/20">🏢</div>
                                </Tooltip>
                                <div>
                                    <h1 className={`text-2xl md:text-3xl font-black tracking-widest ${modoClaro ? 'text-slate-800' : 'bg-gradient-to-r from-white via-indigo-100 to-indigo-300 bg-clip-text text-transparent'}`}>SICI</h1>
                                    <p className="text-[10px] text-indigo-400 font-bold uppercase tracking-widest mt-0.5 flex items-center gap-2">
                                        <span className="relative flex h-2 w-2">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                        </span>
                                        SISTEMA DE INVENTARIO EN LÍNEA
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2.5 relative z-10 flex-wrap">
                                <Tooltip text={modoClaro ? "Modo Oscuro" : "Modo Claro"} position="bottom">
                                    <button onClick={toggleTema} className={`p-2.5 rounded-xl font-bold text-xs cursor-pointer flex items-center justify-center btn-haptic border ${modoClaro ? 'bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200' : 'bg-slate-800/80 text-amber-300 border-slate-700 hover:bg-slate-700'}`}>
                                        <span>{modoClaro ? '🌙' : '☀️'}</span>
                                    </button>
                                </Tooltip>

                                <Tooltip text="Usuario activo en el sistema" position="bottom">
                                    <div className={`flex items-center gap-2.5 ${modoClaro ? 'bg-slate-100 border-slate-300' : 'bg-slate-900/80 border-slate-800'} px-3.5 py-1.5 rounded-xl border shadow-inner`}>
                                        <Avatar nombre={usuarioSesion.nombre} />
                                        <div className="text-left">
                                            <span className={`block text-xs font-black ${modoClaro ? 'text-slate-800' : 'text-white'}`}>{usuarioSesion.nombre}</span>
                                            <span className="block text-[9px] font-extrabold text-indigo-400 uppercase">{usuarioSesion.rol}</span>
                                        </div>
                                    </div>
                                </Tooltip>

                                <Tooltip text={mostrarHistorial ? "Ocultar Historial" : "Ver Historial"} position="bottom">
                                    <button onClick={() => setMostrarHistorial(!mostrarHistorial)} className="px-3.5 py-2.5 rounded-xl font-extrabold text-xs bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-600 hover:text-white cursor-pointer flex items-center gap-1.5 btn-haptic">
                                        <span>📜</span> <span className="hidden sm:inline">{mostrarHistorial ? 'Ocultar' : 'Historial'}</span>
                                    </button>
                                </Tooltip>

                                <Tooltip text="Cerrar Sesión" position="bottom">
                                    <button onClick={handleLogout} className="p-2.5 rounded-xl font-black text-xs bg-rose-600/20 text-rose-400 border border-rose-500/40 hover:bg-rose-600 hover:text-white cursor-pointer btn-haptic">
                                        ❌
                                    </button>
                                </Tooltip>
                            </div>
                        </header>

                        {/* Tarjetas de Métricas Optimizado (Grid 2 Columnas Estrictas) */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-stretch">
                            <Tooltip text="Ver resumen detallado del stock total" position="top">
                                <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('total'); }} className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-5 rounded-2xl border backdrop-blur-xl shadow-lg cursor-pointer glow-neon-indigo flex items-center justify-between group h-full`}>
                                    <div className="space-y-1.5">
                                        <span className={`block text-[10px] font-black uppercase tracking-widest ${modoClaro ? 'text-slate-500' : 'text-slate-400'}`}>Estado del Stock</span>
                                        <div className="flex items-baseline gap-2">
                                            <span className="text-3xl font-black text-indigo-500 group-hover:scale-105 transition-transform">{totalProductosSKUs}</span>
                                            <span className="text-[11px] font-bold text-indigo-400 uppercase">Prod.</span>
                                            <span className="text-slate-500 font-bold">•</span>
                                            <span className={`text-xl font-black ${modoClaro ? 'text-slate-800' : 'text-slate-200'}`}>{totalUnidades}</span>
                                            <span className="text-[11px] font-bold text-slate-400">Unid.</span>
                                        </div>
                                        <div className="flex flex-wrap gap-1.5 text-[9px] font-black pt-1">
                                            <span className="text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20">🟢 {unidadesSinAsignar} Libres</span>
                                            <span className="text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20">🏷️ {unidadesEnUso} Uso</span>
                                            <span className="text-rose-400 bg-rose-500/10 px-2 py-0.5 rounded-md border border-rose-500/20">🚫 {unidadesDeshabilitadas} Deshab.</span>
                                        </div>
                                    </div>
                                    <div className="p-3.5 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xl shadow-inner group-hover:border-indigo-500/50">📦</div>
                                </div>
                            </Tooltip>

                            <Tooltip text="Ver asignaciones por colaborador" position="top">
                                <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('asignaciones'); }} className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-5 rounded-2xl border backdrop-blur-xl shadow-lg cursor-pointer glow-neon-emerald flex items-center justify-between group h-full`}>
                                    <div className="space-y-1.5">
                                        <span className={`block text-[10px] font-black uppercase tracking-widest ${modoClaro ? 'text-slate-500' : 'text-slate-400'}`}>Asignaciones Activas</span>
                                        <div className="flex items-baseline gap-2">
                                            <span className="text-3xl font-black text-emerald-500 group-hover:scale-105 transition-transform">{listaHistorialAsignaciones.length}</span>
                                            <span className="text-[11px] font-bold text-emerald-400 uppercase">Registros</span>
                                        </div>
                                        <div className="text-[9px] font-bold text-slate-400 pt-1">
                                            <span>🏷️ Equipos entregados a personal</span>
                                        </div>
                                    </div>
                                    <div className="p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xl shadow-inner group-hover:border-emerald-500/50">🏷️</div>
                                </div>
                            </Tooltip>
                        </div>

                        {/* NAVEGACIÓN PESTAÑAS */}
                        <div className={`flex gap-2 ${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/80 border-slate-800/80'} p-1.5 rounded-2xl border backdrop-blur-xl shadow-lg overflow-x-auto`}>
                            {tienePermiso('asignar') && (
                                <button onClick={() => setTabActiva('asignar')} className={`flex-1 py-3 px-4 rounded-xl font-black text-xs tracking-wide transition-all cursor-pointer whitespace-nowrap btn-haptic ${tabActiva === 'asignar' ? 'bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-md shadow-indigo-600/30 border border-indigo-400/30' : modoClaro ? 'text-slate-600 hover:text-slate-900 hover:bg-slate-100' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'}`}>🔗 Asignar Productos</button>
                            )}
                            {tienePermiso('productos') && (
                                <button onClick={() => setTabActiva('productos')} className={`flex-1 py-3 px-4 rounded-xl font-black text-xs tracking-wide transition-all cursor-pointer whitespace-nowrap btn-haptic ${tabActiva === 'productos' ? 'bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-md shadow-indigo-600/30 border border-indigo-400/30' : modoClaro ? 'text-slate-600 hover:text-slate-900 hover:bg-slate-100' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'}`}>📦 Maestro Productos</button>
                            )}
                            {tienePermiso('deshabilitados') && (
                                <button onClick={() => setTabActiva('deshabilitados')} className={`flex-1 py-3 px-4 rounded-xl font-black text-xs tracking-wide transition-all cursor-pointer whitespace-nowrap btn-haptic ${tabActiva === 'deshabilitados' ? 'bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-md shadow-indigo-600/30 border border-indigo-400/30' : modoClaro ? 'text-slate-600 hover:text-slate-900 hover:bg-slate-100' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'}`}>🚫 Deshabilitados ({productosDeshabilitados.length})</button>
                            )}
                            {tienePermiso('personal') && (
                                <button onClick={() => setTabActiva('personal')} className={`flex-1 py-3 px-4 rounded-xl font-black text-xs tracking-wide transition-all cursor-pointer whitespace-nowrap btn-haptic ${tabActiva === 'personal' ? 'bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-md shadow-indigo-600/30 border border-indigo-400/30' : modoClaro ? 'text-slate-600 hover:text-slate-900 hover:bg-slate-100' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'}`}>👥 Personal</button>
                            )}
                            {esAdminPrincipal && (
                                <button onClick={() => setTabActiva('usuarios')} className={`flex-1 py-3 px-4 rounded-xl font-black text-xs tracking-wide transition-all cursor-pointer whitespace-nowrap btn-haptic ${tabActiva === 'usuarios' ? 'bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-md shadow-indigo-600/30 border border-indigo-400/30' : modoClaro ? 'text-slate-600 hover:text-slate-900 hover:bg-slate-100' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'}`}>👑 Usuarios y Permisos</button>
                            )}
                        </div>

                        {/* PESTAÑA: USUARIOS */}
                        {tabActiva === 'usuarios' && esAdminPrincipal && (
                            <section className={`animate-tab ${modoClaro ? 'bg-white border-slate-200 text-slate-800' : 'bg-slate-900/60 border-slate-800/80 text-slate-100'} p-6 md:p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-xl`}>
                                <div>
                                    <h2 className="text-lg md:text-xl font-black flex items-center gap-2.5">
                                        <span className="p-2 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-sm">👑</span> Control de Usuarios, Permisos y Roles
                                    </h2>
                                    <p className={`text-xs ${modoClaro ? 'text-slate-500' : 'text-slate-400'} mt-1`}>Define qué herramientas puede utilizar cada usuario y administra los roles disponibles.</p>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="space-y-4">
                                        {!usuarioEditando ? (
                                            <form onSubmit={handleCrearUsuario} className={`${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} p-5 rounded-2xl border space-y-3.5 shadow-inner`}>
                                                <h3 className="text-xs font-black text-indigo-400 uppercase tracking-wider">➕ Crear Nuevo Usuario</h3>
                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Nombre Completo</label>
                                                    <input type="text" placeholder="Ej. Juan Pérez" value={formNuevoUsuario.nombre} onChange={e => setFormNuevoUsuario({...formNuevoUsuario, nombre: e.target.value})} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700/80 text-white'} border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-indigo-500`} required />
                                                </div>
                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Usuario / Login</label>
                                                    <input type="text" placeholder="Ej. jperez" value={formNuevoUsuario.username} onChange={e => setFormNuevoUsuario({...formNuevoUsuario, username: e.target.value})} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700/80 text-white'} border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-indigo-500`} required />
                                                </div>
                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Contraseña</label>
                                                    <input type="password" placeholder="••••••••" value={formNuevoUsuario.password} onChange={e => setFormNuevoUsuario({...formNuevoUsuario, password: e.target.value})} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700/80 text-white'} border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-indigo-500`} required />
                                                </div>
                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Rol de Usuario</label>
                                                    {!creandoRol ? (
                                                        <div className="flex gap-2">
                                                            <select value={formNuevoUsuario.rol} onChange={e => setFormNuevoUsuario({...formNuevoUsuario, rol: e.target.value})} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700/80 text-white'} border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-indigo-500`}>
                                                                {rolesList.map(r => <option key={r.id} value={r.nombre}>{r.nombre}</option>)}
                                                            </select>
