<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordero y Asociados - Control de Inventario</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(11, 15, 25, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(129, 140, 248, 0.8); }

        @keyframes modalSpring {
            0% { opacity: 0; transform: scale(0.95) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal-spring { animation: modalSpring 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes tabFade {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-tab { animation: tabFade 0.2s ease-out forwards; }

        .glow-box-indigo { transition: all 0.3s ease; }
        .glow-box-indigo:hover { border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 8px 30px -5px rgba(99, 102, 241, 0.15); }
        
        .glow-box-amber { transition: all 0.3s ease; }
        .glow-box-amber:hover { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 8px 30px -5px rgba(245, 158, 11, 0.15); }
        
        .glow-box-purple { transition: all 0.3s ease; }
        .glow-box-purple:hover { border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 8px 30px -5px rgba(168, 85, 247, 0.15); }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="font-sans transition-colors duration-500 selection:bg-indigo-500 selection:text-white antialiased bg-[#0B0F19]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://ghjcvvcibapzhryrdtte.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Nejs0JlpzyGf5ALznlTSdA_969MDDH4';

        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function Tooltip({ text, children }) {
            const [show, setShow] = useState(false);
            return (
                <div className="relative inline-block" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
                    {children}
                    {show && (
                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-1.5 bg-[#0F172A]/95 text-slate-100 text-[11px] font-bold rounded-xl shadow-2xl border border-slate-700/80 backdrop-blur-md whitespace-nowrap z-50 pointer-events-none transition-all duration-150">
                            {text}
                            <div className="absolute top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-[#0F172A]/95"></div>
                        </div>
                    )}
                </div>
            );
        }

        function Avatar({ nombre }) {
            const obtenerIniciales = (str) => {
                if (!str) return '??';
                const partes = str.trim().split(' ').filter(Boolean);
                if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
                return str.substring(0, 2).toUpperCase();
            };

            const gradientes = [
                'from-indigo-600 to-violet-600',
                'from-emerald-600 to-teal-600',
                'from-amber-600 to-orange-600',
                'from-rose-600 to-pink-600',
                'from-cyan-600 to-blue-600'
            ];

            const hash = nombre ? nombre.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0) : 0;
            const gradienteElegido = gradientes[hash % gradientes.length];

            return (
                <div className={`w-7 h-7 rounded-full bg-gradient-to-br ${gradienteElegido} flex items-center justify-center text-[10px] font-black text-white shadow-md shadow-indigo-950/40 border border-white/20 shrink-0`}>
                    {obtenerIniciales(nombre)}
                </div>
            );
        }

        function InventoryApp() {
            const [productos, setProductos] = useState([]);
            const [personalList, setPersonalList] = useState([]);
            const [categoriasList, setCategoriasList] = useState([]);
            const [cargosList, setCargosList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [busqueda, setBusqueda] = useState('');
            const [filtroCategoria, setFiltroCategoria] = useState('TODAS');
            const [modalAbierto, setModalAbierto] = useState(false);
            const [seccionSeleccionada, setSeccionSeleccionada] = useState(null);
            const [tabActiva, setTabActiva] = useState('asignar');
            const [mostrarHistorial, setMostrarHistorial] = useState(true);
            const [darkMode, setDarkMode] = useState(true);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            const [lotesExpandidosMap, setLotesExpandidosMap] = useState({});
            const [colaboradoresExpandidosMap, setColaboradoresExpandidosMap] = useState({});

            const [devolviendoKey, setDevolviendoKey] = useState(null);
            const [cantDevolver, setCantDevolver] = useState(1);
            const [editandoObsKey, setEditandoObsKey] = useState(null);
            const [nuevaObsTexto, setNuevaObsTexto] = useState('');
            const [creandoCategoria, setCreandoCategoria] = useState(false);
            const [nuevaCatNombre, setNuevaCatNombre] = useState('');
            const [creandoCargo, setCreandoCargo] = useState(false);
            const [nuevoCargoNombre, setNuevoCargoNombre] = useState('');

            const [formProducto, setFormProducto] = useState({ categoria: '', producto: '', cantidad: '', observaciones: '' });
            const [formRestock, setFormRestock] = useState({ sku: '', cantidadExtra: '' });
            const [skuADeshabilitar, setSkuADeshabilitar] = useState('');
            const [formPersonal, setFormPersonal] = useState({ nombre: '', cargo: '' });

            const [prodSeleccionadosMap, setProdSeleccionadosMap] = useState({});
            const [personalSeleccionados, setPersonalSeleccionados] = useState([]);
            const [obsAsignacion, setObsAsignacion] = useState('');

            const mostrarToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast(prev => ({ ...prev, show: false })), 4000);
            };

            const fetchData = async () => {
                if (!supabase) return;
                setLoading(true);
                try {
                    const { data: prodData, error: prodErr } = await supabase.from('productos').select('*').order('id', { ascending: false });
                    const { data: persData } = await supabase.from('personal').select('*').order('nombre', { ascending: true });
                    const { data: catData } = await supabase.from('categorias').select('*').order('nombre', { ascending: true });
                    const { data: cargoData } = await supabase.from('cargos').select('*').order('nombre', { ascending: true });

                    if (prodErr) console.error("Error al consultar productos:", prodErr);

                    setProductos(prodData || []);
                    setPersonalList(persData || []);
                    
                    if (catData && catData.length > 0) {
                        setCategoriasList(catData);
                    } else if (prodData) {
                        const unicas = Array.from(new Set(prodData.map(p => p.categoria).filter(Boolean)));
                        setCategoriasList(unicas.map((c, i) => ({ id: i + 1, nombre: c })));
                    }

                    if (cargoData && cargoData.length > 0) {
                        setCargosList(cargoData);
                    } else if (persData) {
                        const unicos = Array.from(new Set(persData.map(p => p.cargo).filter(Boolean)));
                        setCargosList(unicos.map((c, i) => ({ id: i + 1, nombre: c })));
                    }
                } catch (error) {
                    console.error('Error general al cargar datos:', error);
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchData();
            }, []);

            const formatearFechaClean = (item) => {
                const rawFecha = item.fecha_asignacion || item.created_at || item.fecha;
                if (!rawFecha) return { fechaStr: 'S/F', horaStr: '--:--' };
                const fecha = new Date(rawFecha);
                if (isNaN(fecha.getTime())) return { fechaStr: 'S/F', horaStr: '--:--' };

                const fechaStr = fecha.toLocaleDateString('es-PE', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });

                const horaStr = fecha.toLocaleTimeString('es-PE', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true
                });

                return { fechaStr, horaStr };
            };

            // EXPORTACIÓN CORREGIDA: EXPORTA LA CANTIDAD FÍSICA TOTAL DEL ALMACÉN
            const descargarInventarioCSV = () => {
                const cabecera = ['SKU', 'Categoria', 'Producto', 'Cantidad_Total_Stock', 'Observaciones', 'Estado'];
                let filas = [];

                if (productosUnicosGlobalList.length > 0) {
                    filas = productosUnicosGlobalList.map(item => {
                        const prodRef = productos.find(p => p.sku === item.sku);
                        const obsLimpia = prodRef ? (prodRef.observaciones || '').replace(/\(LOTE-\d+\)/g, '').replace(/LOTE-\d+/g, '').trim() : '';
                        const esActivo = item.cantidadDeshabilitada === 0 ? 'ACTIVO' : 'DESHABILITADO';

                        return [
                            item.sku || '',
                            prodRef ? prodRef.categoria : 'General',
                            item.producto || '',
                            item.cantidadTotal || 0, // Muestra el stock total real en almacén
                            obsLimpia || 'Sin observaciones',
                            esActivo
                        ];
                    });
                }

                const csvContent = '\uFEFF' + [cabecera.join(';'), ...filas.map(f => f.join(';'))].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `catalogo_productos_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                mostrarToast('Catálogo de productos exportado.');
            };

            // IMPORTACIÓN CSV CORREGIDA: PERMITE ACTUALIZAR CANTIDADES MANTENIENDO ESTADO DESHABILITADO
            const handleImportarCSV = async (e) => {
                const archivo = e.target.files[0];
                if (!archivo) return;

                const lector = new FileReader();
                lector.onload = async (evento) => {
                    try {
                        const texto = evento.target.result;
                        const lineas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        if (lineas.length < 2) {
                            mostrarToast('El archivo está vacío o no tiene un formato válido.', 'error');
                            return;
                        }

                        const { data: dbProductos } = await supabase.from('productos').select('*');
                        const prodActuales = dbProductos || [];

                        let maxSKUNum = 0;
                        prodActuales.forEach(p => {
                            if (p.sku && p.sku.startsWith('PROD-')) {
                                const num = parseInt(p.sku.replace('PROD-', ''), 10);
                                if (!isNaN(num) && num > maxSKUNum) maxSKUNum = num;
                            }
                        });

                        const filas = lineas.slice(1);
                        let creadosCount = 0;
                        let actualizadosCount = 0;

                        for (const fila of filas) {
                            const separador = fila.includes(';') ? ';' : ',';
                            const columnas = fila.split(separador).map(c => c.trim().replace(/^["']|["']$/g, ''));
                            
                            if (columnas.length >= 3) {
                                let sku = '', categoria = '', productoNombre = '', cantidadStr = '', observaciones = '', estadoStr = '';

                                if (columnas.length >= 6) {
                                    [sku, categoria, productoNombre, cantidadStr, observaciones, estadoStr] = columnas;
                                } else if (columnas.length >= 5) {
                                    [sku, categoria, productoNombre, cantidadStr, observaciones] = columnas;
                                } else if (columnas.length >= 4) {
                                    [sku, categoria, productoNombre, cantidadStr] = columnas;
                                } else {
                                    [categoria, productoNombre, cantidadStr] = columnas;
                                }

                                const nuevaCant = parseInt(cantidadStr, 10);
                                const skuNorm = sku ? sku.trim().toUpperCase() : '';
                                const esActivo = estadoStr ? estadoStr.toUpperCase() !== 'DESHABILITADO' : true;

                                if (productoNombre && !isNaN(nuevaCant) && nuevaCant >= 0) {
                                    const filasExistentesMismoSKU = prodActuales.filter(p => p.sku === skuNorm);

                                    if (filasExistentesMismoSKU.length > 0) {
                                        const filaBase = filasExistentesMismoSKU[0];
                                        await supabase.from('productos').update({
                                            categoria: categoria || filaBase.categoria,
                                            producto: productoNombre,
                                            cantidad: nuevaCant,
                                            observaciones: observaciones !== undefined ? observaciones : filaBase.observaciones,
                                            activo: esActivo
                                        }).eq('id', filaBase.id);

                                        actualizadosCount++;
                                    } else {
                                        maxSKUNum++;
                                        const nuevoSKU = skuNorm || `PROD-${String(maxSKUNum).padStart(3, '0')}`;

                                        await supabase.from('productos').insert([{
                                            sku: nuevoSKU,
                                            categoria: categoria || 'General',
                                            producto: productoNombre,
                                            cantidad: nuevaCant,
                                            observaciones: observaciones || 'Importado vía CSV',
                                            personal_asignado: '',
                                            activo: esActivo,
                                            fecha_asignacion: new Date().toISOString()
                                        }]);
                                        creadosCount++;
                                    }
                                }
                            }
                        }

                        await fetchData();
                        mostrarToast(`Catálogo sincronizado: ${actualizadosCount} actualizados, ${creadosCount} creados.`);
                        e.target.value = '';
                    } catch (err) {
                        console.error(err);
                        mostrarToast('Error al procesar el archivo CSV.', 'error');
                    }
                };
                lector.readAsText(archivo, 'UTF-8');
            };

            const handleGuardarNuevaCategoria = async () => {
                if (!nuevaCatNombre.trim()) return;
                try {
                    const { error } = await supabase.from('categorias').insert([{ nombre: nuevaCatNombre.trim() }]);
                    if (!error) {
                        mostrarToast('Categoría creada exitosamente.');
                        setFormProducto({ ...formProducto, categoria: nuevaCatNombre.trim() });
                        setNuevaCatNombre('');
                        setCreandoCategoria(false);
                        fetchData();
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleEliminarCategoria = async (idCat, nombreCat) => {
                if (!window.confirm(`¿Eliminar la categoría "${nombreCat}"?`)) return;
                try {
                    const { error } = await supabase.from('categorias').delete().eq('id', idCat);
                    if (!error) {
                        mostrarToast('Categoría eliminada.');
                        if (formProducto.categoria === nombreCat) setFormProducto({ ...formProducto, categoria: '' });
                        fetchData();
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleGuardarNuevoCargo = async () => {
                if (!nuevoCargoNombre.trim()) return;
                try {
                    const { error } = await supabase.from('cargos').insert([{ nombre: nuevoCargoNombre.trim() }]);
                    if (!error) {
                        mostrarToast('Cargo creado exitosamente.');
                        setFormPersonal({ ...formPersonal, cargo: nuevoCargoNombre.trim() });
                        setNuevoCargoNombre('');
                        setCreandoCargo(false);
                        fetchData();
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleEliminarCargo = async (idCargo, nombreCargo) => {
                if (!window.confirm(`¿Eliminar el cargo "${nombreCargo}"?`)) return;
                try {
                    const { error } = await supabase.from('cargos').delete().eq('id', idCargo);
                    if (!error) {
                        mostrarToast('Cargo eliminado.');
                        if (formPersonal.cargo === nombreCargo) setFormPersonal({ ...formPersonal, cargo: '' });
                        fetchData();
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const generarSKU = () => {
                const skusExistentes = new Set();
                productos.forEach(p => {
                    if (p.sku && p.sku.startsWith('PROD-')) {
                        const num = parseInt(p.sku.replace('PROD-', ''), 10);
                        if (!isNaN(num)) skusExistentes.add(num);
                    }
                });
                let nuevoNum = 1;
                while (skusExistentes.has(nuevoNum)) nuevoNum++;
                return `PROD-${String(nuevoNum).padStart(3, '0')}`;
            };

            const productosActivos = productos.filter(p => p.activo !== false);
            const productosDeshabilitados = productosUnicos(productos.filter(p => p.activo === false));

            function productosUnicos(lista) {
                return Object.values(
                    lista.reduce((acc, curr) => {
                        const key = curr.sku;
                        if (!acc[key]) acc[key] = { sku: curr.sku, producto: curr.producto, categoria: curr.categoria, cantidadTotal: 0 };
                        acc[key].cantidadTotal += Number(curr.cantidad) || 0;
                        return acc;
                    }, {})
                );
            }

            const productosUnicosGlobalList = Object.values(
                productos.reduce((acc, curr) => {
                    const key = curr.sku;
                    if (!acc[key]) acc[key] = { sku: curr.sku, producto: curr.producto, cantidadTotal: 0, cantidadLibre: 0, cantidadUso: 0, cantidadDeshabilitada: 0 };
                    const cant = Number(curr.cantidad) || 0;
                    acc[key].cantidadTotal += cant;

                    if (curr.activo === false) {
                        acc[key].cantidadDeshabilitada += cant;
                    } else if (!curr.personal_asignado || curr.personal_asignado.trim() === '') {
                        acc[key].cantidadLibre += cant;
                    } else {
                        acc[key].cantidadUso += cant;
                    }
                    return acc;
                }, {})
            ).sort((a, b) => a.sku.localeCompare(b.sku));

            const totalProductosSKUs = productosUnicosGlobalList.length;
            const totalUnidades = productos.reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);

            const unidadesSinAsignar = productosActivos.filter(p => !p.personal_asignado || p.personal_asignado.trim() === '').reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const unidadesEnUso = productosActivos.filter(p => p.personal_asignado && p.personal_asignado.trim() !== '').reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const unidadesDeshabilitadas = productos.filter(p => p.activo === false).reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);

            const productosLibresList = Object.values(
                productosActivos
                    .filter(p => !p.personal_asignado || p.personal_asignado.trim() === '')
                    .reduce((acc, curr) => {
                        if (!acc[curr.sku]) {
                            acc[curr.sku] = { ...curr, id: curr.id, cantidad: Number(curr.cantidad) || 0, ids: [curr.id] };
                        } else {
                            acc[curr.sku].cantidad += Number(curr.cantidad) || 0;
                            acc[curr.sku].ids.push(curr.id);
                        }
                        return acc;
                    }, {})
            ).sort((a, b) => a.sku.localeCompare(b.sku));

            const productoSeleccionadoRestock = productosUnicosGlobalList.find(p => p.sku === formRestock.sku);
            const productoSeleccionadoDeshabilitar = productosUnicosGlobalList.find(p => p.sku === skuADeshabilitar);

            const listaHistorialAsignaciones = productos.filter(p => {
                const tienePersonal = p.personal_asignado && p.personal_asignado.trim() !== '';
                const esActivo = p.activo !== false;
                return tienePersonal && esActivo;
            }).sort((a, b) => {
                const fA = new Date(a.fecha_asignacion || a.created_at || 0).getTime();
                const fB = new Date(b.fecha_asignacion || b.created_at || 0).getTime();
                return fB - fA || b.id - a.id;
            });

            const estructurarHistorialPorLotes = (lista) => {
                const mapaLotes = new Map();

                lista.forEach(item => {
                    const fechaObj = new Date(item.fecha_asignacion || item.created_at || 0);
                    const tiempoKey = item.observaciones && item.observaciones.includes('LOTE-') 
                        ? item.observaciones.match(/LOTE-\d+/)?.[0] || fechaObj.toISOString().slice(0, 16)
                        : fechaObj.toISOString().slice(0, 16);

                    if (!mapaLotes.has(tiempoKey)) {
                        mapaLotes.set(tiempoKey, []);
                    }
                    mapaLotes.get(tiempoKey).push(item);
                });

                const lotesProcesados = [];
                mapaLotes.forEach((items, key) => {
                    if (items.length > 1) {
                        const prodsUnicos = Array.from(new Set(items.map(i => i.producto)));
                        const persUnicos = Array.from(new Set(items.map(i => i.personal_asignado)));
                        const cantTotal = items.reduce((sum, i) => sum + (Number(i.cantidad) || 0), 0);

                        const productosAgrupadosMap = items.reduce((acc, current) => {
                            const pKey = current.sku;
                            if (!acc[pKey]) {
                                acc[pKey] = {
                                    sku: current.sku,
                                    producto: current.producto,
                                    categoria: current.categoria,
                                    cantidadTotal: 0,
                                    colaboradores: new Set()
                                };
                            }
                            acc[pKey].cantidadTotal += Number(current.cantidad) || 0;
                            acc[pKey].colaboradores.add(current.personal_asignado);
                            return acc;
                        }, {});

                        const productosAgrupadosLote = Object.values(productosAgrupadosMap).map(p => ({
                            ...p,
                            colaboradores: Array.from(p.colaboradores)
                        }));

                        let obsLoteLimpia = items[0].observaciones || 'Sin observaciones';
                        obsLoteLimpia = obsLoteLimpia.replace(/\(LOTE-\d+\)/g, '').replace(/LOTE-\d+/g, '').trim();
                        if (!obsLoteLimpia) obsLoteLimpia = 'Sin observaciones';

                        lotesProcesados.push({
                            esLote: true,
                            loteKey: key,
                            fecha_asignacion: items[0].fecha_asignacion || items[0].created_at,
                            totalItems: items.length,
                            prodsCount: prodsUnicos.length,
                            persCount: persUnicos.length,
                            cantTotal,
                            items,
                            productosAgrupadosLote,
                            observaciones: obsLoteLimpia
                        });
                    } else {
                        let obsIndividualLimpia = items[0].observaciones || '-';
                        obsIndividualLimpia = obsIndividualLimpia.replace(/\(LOTE-\d+\)/g, '').replace(/LOTE-\d+/g, '').trim();
                        if (!obsIndividualLimpia) obsIndividualLimpia = '-';

                        lotesProcesados.push({
                            esLote: false,
                            loteKey: key,
                            ...items[0],
                            observacionesLimpia: obsIndividualLimpia
                        });
                    }
                });

                return lotesProcesados;
            };

            const historialAgrupado = estructurarHistorialPorLotes(listaHistorialAsignaciones);

            const historialFiltrado = historialAgrupado.filter(grupo => {
                if (grupo.esLote) {
                    const coincideEnItems = grupo.items.some(item => {
                        return (item.producto && item.producto.toLowerCase().includes(busqueda.toLowerCase())) ||
                            (item.personal_asignado && item.personal_asignado.toLowerCase().includes(busqueda.toLowerCase())) ||
                            (item.categoria && item.categoria.toLowerCase().includes(busqueda.toLowerCase())) ||
                            (item.sku && item.sku.toLowerCase().includes(busqueda.toLowerCase()));
                    });

                    const coincideCat = filtroCategoria === 'TODAS' || grupo.items.some(i => i.categoria && i.categoria.toUpperCase() === filtroCategoria.toUpperCase());
                    return coincideEnItems && coincideCat;
                } else {
                    const coincideTexto = (grupo.producto && grupo.producto.toLowerCase().includes(busqueda.toLowerCase())) ||
                        (grupo.personal_asignado && grupo.personal_asignado.toLowerCase().includes(busqueda.toLowerCase())) ||
                        (grupo.categoria && grupo.categoria.toLowerCase().includes(busqueda.toLowerCase())) ||
                        (grupo.sku && grupo.sku.toLowerCase().includes(busqueda.toLowerCase()));

                    const coincideCat = filtroCategoria === 'TODAS' || (grupo.categoria && grupo.categoria.toUpperCase() === filtroCategoria.toUpperCase());

                    return coincideTexto && coincideCat;
                }
            });

            const toggleLoteExpandido = (loteKey) => {
                setLotesExpandidosMap(prev => ({
                    ...prev,
                    [loteKey]: !prev[loteKey]
                }));
            };

            const toggleColaboradorExpandido = (nombreColaborador) => {
                setColaboradoresExpandidosMap(prev => ({
                    ...prev,
                    [nombreColaborador]: !prev[nombreColaborador]
                }));
            };

            const asignacionesPorPersonalMap = productosActivos
                .filter(p => p.personal_asignado && p.personal_asignado.trim() !== '')
                .reduce((acc, curr) => {
                    const pers = curr.personal_asignado;
                    if (!acc[pers]) acc[pers] = {};
                    const skuKey = curr.sku;

                    if (!acc[pers][skuKey]) {
                        acc[pers][skuKey] = {
                            id: curr.id,
                            ids: [curr.id],
                            sku: curr.sku,
                            producto: curr.producto,
                            categoria: curr.categoria,
                            cantidad: Number(curr.cantidad) || 0,
                            observaciones: curr.observaciones,
                            personal_asignado: curr.personal_asignado,
                            fecha_asignacion: curr.fecha_asignacion || curr.created_at
                        };
                    } else {
                        acc[pers][skuKey].cantidad += Number(curr.cantidad) || 0;
                        acc[pers][skuKey].ids.push(curr.id);
                        if (new Date(curr.fecha_asignacion || curr.created_at) > new Date(acc[pers][skuKey].fecha_asignacion)) {
                            acc[pers][skuKey].fecha_asignacion = curr.fecha_asignacion || curr.created_at;
                            acc[pers][skuKey].observaciones = curr.observaciones;
                        }
                    }
                    return acc;
                }, {});

            const asignacionesAgrupadasListMap = Object.entries(asignacionesPorPersonalMap).reduce((acc, [colab, objSKUs]) => {
                acc[colab] = Object.values(objSKUs);
                return acc;
            }, {});

            const handleSaveProducto = async (e) => {
                e.preventDefault();
                const nuevoSKU = generarSKU();
                const { error } = await supabase.from('productos').insert([{
                    sku: nuevoSKU,
                    categoria: formProducto.categoria,
                    producto: formProducto.producto,
                    cantidad: Number(formProducto.cantidad),
                    observaciones: formProducto.observaciones,
                    personal_asignado: '',
                    activo: true,
                    fecha_asignacion: new Date().toISOString()
                }]);
                if (!error) {
                    setFormProducto({ categoria: '', producto: '', cantidad: '', observaciones: '' });
                    fetchData();
                    mostrarToast(`Producto registrado. SKU: ${nuevoSKU}`);
                } else {
                    mostrarToast(`Error BD: ${error.message}`, 'error');
                }
            };

            // REABASTECIMIENTO CORREGIDO: SUMA DIRECTAMENTE AL PRODUCTO EXISTENTE AÚN ESTANDO DESHABILITADO
            const handleRestockProducto = async (e) => {
                e.preventDefault();
                if (!formRestock.sku || !formRestock.cantidadExtra || Number(formRestock.cantidadExtra) <= 0) {
                    mostrarToast('Selecciona un producto e ingresa una cantidad válida.', 'error');
                    return;
                }
                try {
                    const cantidadSumar = Number(formRestock.cantidadExtra);
                    const filasExistentesMismoSKU = productos.filter(p => p.sku === formRestock.sku);

                    if (filasExistentesMismoSKU.length > 0) {
                        const filaPrincipal = filasExistentesMismoSKU[0];
                        const nuevaCant = Number(filaPrincipal.cantidad) + cantidadSumar;
                        await supabase.from('productos').update({ cantidad: nuevaCant }).eq('id', filaPrincipal.id);
                    } else {
                        await supabase.from('productos').insert([{
                            sku: formRestock.sku,
                            categoria: 'General',
                            producto: formRestock.sku,
                            cantidad: cantidadSumar,
                            observaciones: 'Reabastecido',
                            personal_asignado: '',
                            activo: true,
                            fecha_asignacion: new Date().toISOString()
                        }]);
                    }
                    setFormRestock({ sku: '', cantidadExtra: '' });
                    fetchData();
                    mostrarToast('¡Stock reabastecido correctamente!');
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al reabastecer stock', 'error');
                }
            };

            const handleDeshabilitarProducto = async (e) => {
                e.preventDefault();
                if (!skuADeshabilitar) {
                    mostrarToast('Selecciona un producto.', 'error');
                    return;
                }
                const prodRef = productosUnicosGlobalList.find(p => p.sku === skuADeshabilitar);
                const nombreProd = prodRef ? prodRef.producto : skuADeshabilitar;

                if (!window.confirm(`¿Deshabilitar el producto "${nombreProd}" (${skuADeshabilitar})?`)) return;

                try {
                    const { error } = await supabase.from('productos').update({ activo: false }).eq('sku', skuADeshabilitar);
                    if (!error) {
                        setSkuADeshabilitar('');
                        fetchData();
                        mostrarToast('Producto deshabilitado correctamente.');
                    }
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al deshabilitar el producto.', 'error');
                }
            };

            const handleReactivarProducto = async (skuReactivar) => {
                try {
                    const { error } = await supabase.from('productos').update({ activo: true }).eq('sku', skuReactivar);
                    if (!error) {
                        fetchData();
                        mostrarToast(`Producto (${skuReactivar}) reactivado con éxito.`);
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const handleEliminarDefinitivo = async (skuEliminar) => {
                if (!window.confirm(`¿Estás seguro de ELIMINAR DEFINITIVAMENTE el producto (${skuEliminar})?`)) return;
                try {
                    const { error } = await supabase.from('productos').delete().eq('sku', skuEliminar);
                    if (!error) {
                        fetchData();
                        mostrarToast(`Producto (${skuEliminar}) eliminado definitivamente.`, 'error');
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const toggleProductoSeleccionado = (idProd) => {
                setProdSeleccionadosMap(prev => {
                    const copy = { ...prev };
                    if (copy[idProd]) delete copy[idProd];
                    else copy[idProd] = 1;
                    return copy;
                });
            };

            const updateCantProductoSeleccionado = (idProd, cant) => {
                const val = Math.max(1, Number(cant) || 1);
                setProdSeleccionadosMap(prev => ({ ...prev, [idProd]: val }));
            };

            const togglePersonalSeleccionado = (nombre) => {
                setPersonalSeleccionados(prev => 
                    prev.includes(nombre) ? prev.filter(n => n !== nombre) : [...prev, nombre]
                );
            };

            const handleConfirmarAsignacionMultiple = async (e) => {
                e.preventDefault();
                if (!supabase) return;

                const prodIds = Object.keys(prodSeleccionadosMap);
                if (prodIds.length === 0 || personalSeleccionados.length === 0) {
                    mostrarToast('Selecciona al menos un producto y un colaborador.', 'error');
                    return;
                }

                try {
                    for (const idProd of prodIds) {
                        const prodOriginal = productosLibresList.find(p => p.id == idProd);
                        if (!prodOriginal) continue;

                        const cantPorPersona = Number(prodSeleccionadosMap[idProd]) || 1;
                        const requerimientoTotal = cantPorPersona * personalSeleccionados.length;
                        const stockLibreDisponible = prodOriginal.cantidad;

                        if (requerimientoTotal > stockLibreDisponible) {
                            mostrarToast(`No hay suficiente stock libre para "${prodOriginal.producto}". Se necesitan ${requerimientoTotal} unidades y solo hay ${stockLibreDisponible} disponibles.`, 'error');
                            return;
                        }
                    }

                    const timestampActualISO = new Date().toISOString();
                    const tagLote = `LOTE-${Date.now()}`;
                    const obsConLote = obsAsignacion ? `${obsAsignacion} (${tagLote})` : `Asignación (${tagLote})`;

                    for (const idProd of prodIds) {
                        const prodOriginal = productosLibresList.find(p => p.id == idProd);
                        if (!prodOriginal) continue;
                        const cantPorPersona = Number(prodSeleccionadosMap[idProd]) || 1;

                        for (const persNombre of personalSeleccionados) {
                            const asignacionExistente = productosActivos.find(
                                p => p.sku === prodOriginal.sku && p.personal_asignado === persNombre
                            );

                            if (asignacionExistente) {
                                const nuevaCant = Number(asignacionExistente.cantidad) + cantPorPersona;
                                await supabase.from('productos').update({
                                    cantidad: nuevaCant,
                                    observaciones: obsConLote,
                                    fecha_asignacion: timestampActualISO
                                }).eq('id', asignacionExistente.id);
                            } else {
                                await supabase.from('productos').insert([{
                                    sku: prodOriginal.sku,
                                    categoria: prodOriginal.categoria,
                                    producto: prodOriginal.producto,
                                    cantidad: cantPorPersona,
                                    observaciones: obsConLote,
                                    personal_asignado: persNombre,
                                    activo: true,
                                    fecha_asignacion: timestampActualISO
                                }]);
                            }
                        }

                        let pendienteDescontar = cantPorPersona * personalSeleccionados.length;
                        const filasStockLibre = productosActivos.filter(p => p.sku === prodOriginal.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));

                        for (const filaLibre of filasStockLibre) {
                            if (pendienteDescontar <= 0) break;
                            const cantFila = Number(filaLibre.cantidad);
                            if (cantFila <= pendienteDescontar) {
                                await supabase.from('productos').delete().eq('id', filaLibre.id);
                                pendienteDescontar -= cantFila;
                            } else {
                                await supabase.from('productos').update({ cantidad: cantFila - pendienteDescontar }).eq('id', filaLibre.id);
                                pendienteDescontar = 0;
                            }
                        }
                    }

                    setProdSeleccionadosMap({});
                    setPersonalSeleccionados([]);
                    setObsAsignacion('');
                    await fetchData();
                    mostrarToast('¡Asignación guardada con éxito!');
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al procesar asignación.', 'error');
                }
            };

            const handleSavePersonal = async (e) => {
                e.preventDefault();
                const { error } = await supabase.from('personal').insert([{
                    nombre: formPersonal.nombre,
                    cargo: formPersonal.cargo
                }]);
                if (!error) {
                    setFormPersonal({ nombre: '', cargo: '' });
                    fetchData();
                    mostrarToast('Personal registrado con éxito.');
                }
            };

            const handleDevolverTodoColaborador = async (nombreColaborador) => {
                if (!window.confirm(`¿Devolver TODOS los productos asignados a "${nombreColaborador}" al stock libre?`)) return;

                try {
                    const asignacionesDelPersonal = productosActivos.filter(p => p.personal_asignado === nombreColaborador);
                    let totalUnidadesDevueltas = 0;

                    for (const item of asignacionesDelPersonal) {
                        const cantItem = Number(item.cantidad) || 1;
                        totalUnidadesDevueltas += cantItem;

                        const stockLibreExistente = productosActivos.find(p => p.sku === item.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));

                        if (stockLibreExistente) {
                            await supabase.from('productos').update({ cantidad: Number(stockLibreExistente.cantidad) + cantItem }).eq('id', stockLibreExistente.id);
                        } else {
                            await supabase.from('productos').insert([{
                                sku: item.sku, categoria: item.categoria, producto: item.producto, cantidad: cantItem, observaciones: 'Devuelto masivo', personal_asignado: '', activo: true, fecha_asignacion: new Date().toISOString()
                            }]);
                        }
                        await supabase.from('productos').delete().eq('id', item.id);
                    }

                    fetchData();
                    mostrarToast(`Se devolvieron ${totalUnidadesDevueltas} unidades de "${nombreColaborador}" al stock libre.`);
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al devolver todos los productos.', 'error');
                }
            };

            const handleEjecutarDevolucionAgrupada = async (asigItem) => {
                const cantADevolver = Number(cantDevolver);
                if (cantADevolver <= 0 || cantADevolver > asigItem.cantidad) {
                    mostrarToast('Ingresa una cantidad válida a devolver.', 'error');
                    return;
                }

                try {
                    const stockLibreExistente = productosActivos.find(p => p.sku === asigItem.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));

                    if (stockLibreExistente) {
                        const nuevaCantLibre = Number(stockLibreExistente.cantidad) + cantADevolver;
                        await supabase.from('productos').update({ cantidad: nuevaCantLibre }).eq('id', stockLibreExistente.id);
                    } else {
                        await supabase.from('productos').insert([{
                            sku: asigItem.sku,
                            categoria: asigItem.categoria,
                            producto: asigItem.producto,
                            cantidad: cantADevolver,
                            observaciones: 'Devuelto',
                            personal_asignado: '',
                            activo: true,
                            fecha_asignacion: new Date().toISOString()
                        }]);
                    }

                    let pendiente = cantADevolver;
                    const idsAProcesar = asigItem.ids && asigItem.ids.length > 0 ? asigItem.ids : [asigItem.id];
                    const filasBase = productosActivos.filter(p => idsAProcesar.includes(p.id));

                    for (const fila of filasBase) {
                        if (pendiente <= 0) break;
                        const cantFila = Number(fila.cantidad);

                        if (cantFila <= pendiente) {
                            await supabase.from('productos').delete().eq('id', fila.id);
                            pendiente -= cantFila;
                        } else {
                            await supabase.from('productos').update({ cantidad: cantFila - pendiente }).eq('id', fila.id);
                            pendiente = 0;
                        }
                    }

                    setDevolviendoKey(null);
                    setCantDevolver(1);
                    fetchData();
                    mostrarToast(`Se devolvieron ${cantADevolver} unidades al stock libre.`);
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al procesar la devolución', 'error');
                }
            };

            const handleGuardarObservacionEditada = async (asigItem) => {
                try {
                    const idsAActualizar = asigItem.ids && asigItem.ids.length > 0 ? asigItem.ids : [asigItem.id];
                    for (const idReg of idsAActualizar) {
                        await supabase.from('productos').update({ observaciones: nuevaObsTexto.trim() }).eq('id', idReg);
                    }
                    setEditandoObsKey(null);
                    setNuevaObsTexto('');
                    fetchData();
                    mostrarToast('Observación actualizada correctamente.');
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al actualizar observación.', 'error');
                }
            };

            const handleDeletePersonal = async (persId, persNombre) => {
                if (!window.confirm(`¿Eliminar a "${persNombre}"? Sus equipos volverán a stock libre.`)) return;
                const asignacionesDelPersonal = productosActivos.filter(p => p.personal_asignado === persNombre);
                for (const item of asignacionesDelPersonal) {
                    const stockLibreExistente = productosActivos.find(p => p.sku === item.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));
                    if (stockLibreExistente) {
                        await supabase.from('productos').update({ cantidad: Number(stockLibreExistente.cantidad) + Number(item.cantidad) }).eq('id', stockLibreExistente.id);
                    } else {
                        await supabase.from('productos').insert([{
                            sku: item.sku, categoria: item.categoria, producto: item.producto, cantidad: item.cantidad, observaciones: item.observaciones, personal_asignado: '', activo: true, fecha_asignacion: new Date().toISOString()
                        }]);
                    }
                    await supabase.from('productos').delete().eq('id', item.id);
                }
                await supabase.from('personal').delete().eq('id', persId);
                fetchData();
                mostrarToast('Personal eliminado.');
            };

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-[#0B0F19] text-slate-100' : 'bg-slate-100 text-slate-900'} p-6 md:p-8 transition-colors duration-500`}>
                    {toast.show && (
                        <div className={`fixed top-6 right-6 z-50 px-5 py-3.5 rounded-2xl text-xs font-bold shadow-2xl border backdrop-blur-lg transition-all duration-300 ${toast.type === 'error' ? 'bg-rose-950/90 text-rose-200 border-rose-500/40 shadow-rose-950/50' : 'bg-emerald-950/90 text-emerald-200 border-emerald-500/40 shadow-emerald-950/50'}`}>
                            {toast.type === 'error' ? '⚠️' : '✨'} {toast.message}
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto space-y-6">
                        {/* Cabecera Principal */}
                        <header className={`${darkMode ? 'glass-panel border-indigo-500/20 shadow-indigo-950/20' : 'bg-white/80 border-slate-200 shadow-slate-200/50'} p-6 md:p-8 rounded-3xl border backdrop-blur-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shadow-2xl transition-all`}>
                            <div className="flex items-center gap-5">
                                <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 via-indigo-600 to-violet-700 flex items-center justify-center text-2xl text-white shadow-lg shadow-indigo-500/25 border border-white/10">🏢</div>
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-black tracking-tight">Cordero y Asociados</h1>
                                    <p className="text-xs text-indigo-400 font-bold uppercase tracking-wider mt-0.5 flex items-center gap-2">
                                        <span className="relative flex h-2 w-2">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                        </span>
                                        Control de Inventario • Base Sincronizada
                                    </p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <Tooltip text={mostrarHistorial ? "Ocultar Bitácora" : "Ver Bitácora de Asignaciones"}>
                                    <button onClick={() => setMostrarHistorial(!mostrarHistorial)} className="px-5 py-3.5 rounded-2xl font-black text-xs bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white shadow-lg shadow-indigo-600/25 cursor-pointer flex items-center gap-2 transition-all hover:scale-[1.02] active:scale-95 border border-indigo-400/20">
                                        📜 <span>{mostrarHistorial ? 'Ocultar Bitácora' : 'Bitácora'}</span>
                                    </button>
                                </Tooltip>
                                <Tooltip text="Alternar Modo Claro / Oscuro">
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-3.5 rounded-2xl font-black text-xs bg-slate-800/80 text-amber-400 border border-slate-700/80 cursor-pointer hover:bg-slate-700/80 transition-all hover:scale-[1.02] active:scale-95 shadow-md">
                                        {darkMode ? '☀️' : '🌙'}
                                    </button>
                                </Tooltip>
                            </div>
                        </header>

                        {/* Tarjetas de Métricas Interactivas */}
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
                            <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('total'); }} className={`${darkMode ? 'bg-slate-900/50 border-slate-800/80' : 'bg-white/80 border-slate-200'} p-6 rounded-3xl border backdrop-blur-md shadow-xl cursor-pointer glow-box-indigo flex items-center justify-between group`}>
                                <div className="space-y-2">
                                    <span className="block text-xs font-black uppercase tracking-wider text-slate-400">Estado del Stock</span>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-4xl font-black text-indigo-400 group-hover:scale-105 transition-transform">{totalProductosSKUs}</span>
                                        <span className="text-xs font-bold text-indigo-300 uppercase tracking-wide">Prod.</span>
                                        <span className="text-slate-500 font-bold mx-1">•</span>
                                        <span className="text-2xl font-black text-slate-200">{totalUnidades}</span>
                                        <span className="text-xs font-bold text-slate-400">Unid.</span>
                                    </div>
                                    <div className="flex flex-wrap gap-1.5 text-[11px] font-bold pt-1">
                                        <span className="text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-xl border border-emerald-500/20">🟢 {unidadesSinAsignar} Libres</span>
                                        <span className="text-amber-400 bg-amber-500/10 px-2.5 py-0.5 rounded-xl border border-amber-500/20">🏷️ {unidadesEnUso} Uso</span>
                                        <span className="text-rose-400 bg-rose-500/10 px-2.5 py-0.5 rounded-xl border border-rose-500/20">🚫 {unidadesDeshabilitadas} Deshab.</span>
                                    </div>
                                </div>
                                <div className="p-4 rounded-2xl bg-indigo-950/80 border border-indigo-800/50 text-indigo-400 text-2xl shadow-inner group-hover:border-indigo-500/50 transition-colors">📦</div>
                            </div>

                            <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('personal'); }} className={`${darkMode ? 'bg-slate-900/50 border-slate-800/80' : 'bg-white/80 border-slate-200'} p-6 rounded-3xl border backdrop-blur-md shadow-xl cursor-pointer glow-box-amber flex items-center justify-between group`}>
                                <div>
                                    <span className="block text-xs font-black uppercase tracking-wider mb-1 text-slate-400">Total Personal</span>
                                    <span className="text-4xl font-black text-amber-400 group-hover:scale-105 transition-transform">{personalList.length}</span>
                                </div>
                                <div className="p-4 rounded-2xl bg-amber-950/80 border border-amber-800/50 text-amber-400 text-2xl shadow-inner group-hover:border-amber-500/50 transition-colors">👥</div>
                            </div>

                            <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('asignaciones'); }} className={`${darkMode ? 'bg-slate-900/50 border-slate-800/80' : 'bg-white/80 border-slate-200'} p-6 rounded-3xl border backdrop-blur-md shadow-xl cursor-pointer glow-box-purple flex items-center justify-between group`}>
                                <div>
                                    <span className="block text-xs font-black uppercase tracking-wider mb-1 text-slate-400">Asignaciones</span>
                                    <span className="text-4xl font-black text-purple-400 group-hover:scale-105 transition-transform">{listaHistorialAsignaciones.length}</span>
                                </div>
                                <div className="p-4 rounded-2xl bg-purple-950/80 border border-purple-800/50 text-purple-400 text-2xl shadow-inner group-hover:border-purple-500/50 transition-colors">🏷️</div>
                            </div>
                        </div>

                        {/* BARRA DE NAVEGACIÓN DE PESTAÑAS */}
                        <div className={`flex gap-3 ${darkMode ? 'bg-slate-900/60 border-slate-800/80' : 'bg-white/80 border-slate-200'} p-2 rounded-3xl border backdrop-blur-xl shadow-xl overflow-x-auto`}>
                            <button onClick={() => setTabActiva('asignar')} className={`flex-1 py-3.5 px-5 rounded-2xl font-extrabold text-xs tracking-wide transition-all cursor-pointer whitespace-nowrap active:translate-y-0.5 ${tabActiva === 'asignar' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 border border-indigo-400/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'}`}>🔗 Asignar Productos</button>
                            <button onClick={() => setTabActiva('productos')} className={`flex-1 py-3.5 px-5 rounded-2xl font-extrabold text-xs tracking-wide transition-all cursor-pointer whitespace-nowrap active:translate-y-0.5 ${tabActiva === 'productos' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 border border-indigo-400/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'}`}>📦 Catálogo e Importación CSV</button>
                            <button onClick={() => setTabActiva('deshabilitados')} className={`flex-1 py-3.5 px-5 rounded-2xl font-extrabold text-xs tracking-wide transition-all cursor-pointer whitespace-nowrap active:translate-y-0.5 ${tabActiva === 'deshabilitados' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 border border-indigo-400/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'}`}>🚫 Productos Deshabilitados ({productosDeshabilitados.length})</button>
                            <button onClick={() => setTabActiva('personal')} className={`flex-1 py-3.5 px-5 rounded-2xl font-extrabold text-xs tracking-wide transition-all cursor-pointer whitespace-nowrap active:translate-y-0.5 ${tabActiva === 'personal' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 border border-indigo-400/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'}`}>👥 Agregar Personal</button>
                        </div>

                        {/* PESTAÑA: ASIGNAR PRODUCTOS */}
                        {tabActiva === 'asignar' && (
                            <section className={`animate-tab ${darkMode ? 'bg-slate-900/60 border-slate-800/80 text-slate-100' : 'bg-white/80 border-slate-200 text-slate-800'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl`}>
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-slate-800/60 pb-4">
                                    <div>
                                        <h2 className="text-xl font-black flex items-center gap-3">
                                            <span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">🔗</span> Asignación de Productos
                                        </h2>
                                        <p className="text-xs text-slate-400 mt-1">Selecciona uno o varios productos activos y colaboradores para asignar en una sola operación.</p>
                                    </div>
                                </div>

                                <form onSubmit={handleConfirmarAsignacionMultiple} className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="space-y-3">
                                            <label className="block text-xs font-black uppercase text-indigo-400 tracking-wider">
                                                1. Seleccionar Productos ({Object.keys(prodSeleccionadosMap).length} marcados)
                                            </label>
                                            <div className="max-h-64 overflow-y-auto p-4 rounded-2xl bg-slate-950/80 border border-slate-800/80 space-y-2.5">
                                                {productosLibresList.length === 0 ? (
                                                    <p className="text-xs text-slate-500 font-bold p-4 text-center">No hay stock libre disponible.</p>
                                                ) : (
                                                    productosLibresList.map(p => {
                                                        const isChecked = !!prodSeleccionadosMap[p.id];
                                                        return (
                                                            <div key={p.id} className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 transition-all ${isChecked ? 'bg-indigo-950/40 border-indigo-500/50 shadow-md shadow-indigo-950/20' : 'bg-slate-900/60 border-slate-800/80 hover:border-slate-700'}`}>
                                                                <div className="flex items-center gap-3">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        checked={isChecked} 
                                                                        onChange={() => toggleProductoSeleccionado(p.id)} 
                                                                        className="w-4 h-4 accent-indigo-600 rounded cursor-pointer"
                                                                    />
                                                                    <div>
                                                                        <div className="text-xs font-extrabold text-white">
                                                                            <span className="font-mono text-indigo-400 bg-indigo-950/80 px-2 py-0.5 rounded border border-indigo-800/60 mr-2">{p.sku}</span>
                                                                            {p.producto}
                                                                        </div>
                                                                        <div className="text-[11px] text-slate-400 font-bold mt-1">Libres: {p.cantidad} unidades</div>
                                                                    </div>
                                                                </div>

                                                                {isChecked && (
                                                                    <div className="flex items-center gap-1.5">
                                                                        <span className="text-[10px] text-slate-400 font-bold">Cant/p:</span>
                                                                        <input 
                                                                            type="number" 
                                                                            min="1" 
                                                                            max={p.cantidad} 
                                                                            value={prodSeleccionadosMap[p.id]} 
                                                                            onChange={e => updateCantProductoSeleccionado(p.id, e.target.value)} 
                                                                            className="w-14 px-2 py-1 bg-slate-800 border border-slate-700 rounded-lg text-xs font-black text-white text-center focus:border-indigo-500 outline-none" 
                                                                        />
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })
                                                )}
                                            </div>
                                        </div>

                                        <div className="space-y-3">
                                            <label className="block text-xs font-black uppercase text-purple-400 tracking-wider">
                                                2. Seleccionar Colaboradores ({personalSeleccionados.length} marcados)
                                            </label>
                                            <div className="max-h-64 overflow-y-auto p-4 rounded-2xl bg-slate-950/80 border border-slate-800/80 space-y-2.5">
                                                {personalList.length === 0 ? (
                                                    <p className="text-xs text-slate-500 font-bold p-4 text-center">No hay colaboradores registrados.</p>
                                                ) : (
                                                    personalList.map(pers => {
                                                        const isChecked = personalSeleccionados.includes(pers.nombre);
                                                        return (
                                                            <div key={pers.id} onClick={() => togglePersonalSeleccionado(pers.nombre)} className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 cursor-pointer transition-all ${isChecked ? 'bg-purple-950/40 border-purple-500/50 shadow-md shadow-purple-950/20' : 'bg-slate-900/60 border-slate-800/80 hover:border-slate-700'}`}>
                                                                <div className="flex items-center gap-3">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        checked={isChecked} 
                                                                        onChange={() => {}} 
                                                                        className="w-4 h-4 accent-purple-600 rounded cursor-pointer"
                                                                    />
                                                                    <Avatar nombre={pers.nombre} />
                                                                    <span className="text-xs font-extrabold text-white">{pers.nombre}</span>
                                                                </div>
                                                                <span className="text-[11px] font-bold text-slate-400">{pers.cargo || 'Sin cargo'}</span>
                                                            </div>
                                                        );
                                                    })
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-4 pt-2 border-t border-slate-800/80">
                                        <div>
                                            <label className="block text-xs font-black uppercase mb-1 text-slate-400">Observaciones Generales (Opcional)</label>
                                            <input type="text" placeholder="Ej. Entrega para sede principal" value={obsAsignacion} onChange={e => setObsAsignacion(e.target.value)} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none transition-all ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white focus:border-indigo-500' : 'bg-slate-50 border-slate-300'}`} />
                                        </div>

                                        <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-extrabold py-4 rounded-2xl shadow-xl shadow-indigo-600/30 cursor-pointer text-sm transition-all hover:scale-[1.005] active:translate-y-0.5 active:shadow-inner border border-indigo-400/20">
                                            🚀 Confirmar Asignación ({Object.keys(prodSeleccionadosMap).length} Productos ➔ {personalSeleccionados.length} Personales)
                                        </button>
                                    </div>
                                </form>
                            </section>
                        )}

                        {/* PESTAÑA: GESTIONAR CATALOGO DE PRODUCTOS Y CSV BASE */}
                        {tabActiva === 'productos' && (
                            <div className="space-y-6 animate-tab">
                                <section className={`${darkMode ? 'bg-gradient-to-r from-indigo-950/40 via-slate-900/80 to-purple-950/40 border-indigo-500/30 text-slate-100' : 'bg-gradient-to-r from-indigo-50 via-white to-purple-50 border-indigo-200 text-slate-800'} p-8 rounded-3xl border backdrop-blur-xl space-y-4 shadow-xl`}>
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h2 className="text-xl font-black flex items-center gap-3">
                                                <span className="p-2.5 rounded-xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">📊</span> Catálogo y Gestión Masiva CSV (Stock Almacén)
                                            </h2>
                                            <p className={`text-xs mt-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Exporta o actualiza el stock físico completo almacenado de cada producto.</p>
                                        </div>
                                        <button onClick={descargarInventarioCSV} className="px-5 py-3 rounded-2xl font-extrabold text-xs bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 cursor-pointer flex items-center gap-2 transition-all active:translate-y-0.5 border border-indigo-400/20">
                                            <span>📥</span> Exportar Catálogo CSV
                                        </button>
                                    </div>
                                    <div className={`p-6 rounded-2xl border border-dashed flex flex-col sm:flex-row items-center justify-between gap-4 ${darkMode ? 'border-slate-700 bg-slate-950/40' : 'border-slate-300 bg-white/60'}`}>
                                        <div className="flex items-center gap-3">
                                            <span className="text-2xl">📂</span>
                                            <div>
                                                <p className={`text-xs font-bold ${darkMode ? 'text-slate-200' : 'text-slate-700'}`}>Selecciona tu archivo CSV para actualizar/crear productos base</p>
                                                <p className={`text-[11px] ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>Columnas: SKU; Categoria; Producto; Cantidad_Total_Stock; Observaciones; Estado</p>
                                            </div>
                                        </div>
                                        <input type="file" accept=".csv" onChange={handleImportarCSV} className={`text-xs font-semibold file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:cursor-pointer transition ${darkMode ? 'text-slate-400 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500' : 'text-slate-600 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100'}`} />
                                    </div>
                                </section>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <section className={`${darkMode ? 'bg-slate-900/60 border-slate-800/80 text-slate-100' : 'bg-white/80 border-slate-200 text-slate-800'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl flex flex-col justify-between`}>
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">📦</span> Registrar Producto</h2>
                                            <form onSubmit={handleSaveProducto} id="form-nuevo-prod" className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-black uppercase mb-2 text-slate-400">SKU Autogenerado</label>
                                                    <input type="text" value={generarSKU()} disabled className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-mono font-black ${darkMode ? 'bg-slate-800/90 border-slate-700 text-indigo-400' : 'bg-slate-100 border-slate-300 text-slate-500'}`} />
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-black uppercase mb-2 text-slate-400">Categoría</label>
                                                    {!creandoCategoria ? (
                                                        <div className="flex gap-2">
                                                            <select value={formProducto.categoria} onChange={e => setFormProducto({...formProducto, categoria: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                                                <option value="">-- Categ. --</option>
                                                                {categoriasList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                            </select>
                                                            <button type="button" onClick={() => setCreandoCategoria(true)} className="px-4 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-extrabold whitespace-nowrap cursor-pointer transition-all active:translate-y-0.5 border border-indigo-400/20">Gestionar</button>
                                                        </div>
                                                    ) : (
                                                        <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                                                            <div className="flex gap-2">
                                                                <input type="text" placeholder="Categoría..." value={nuevaCatNombre} onChange={e => setNuevaCatNombre(e.target.value)} className="w-full bg-slate-800 border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                                                                <button type="button" onClick={handleGuardarNuevaCategoria} className="px-3 bg-emerald-600 text-white rounded-xl text-xs font-extrabold cursor-pointer">OK</button>
                                                                <button type="button" onClick={() => setCreandoCategoria(false)} className="px-3 bg-slate-700 text-slate-300 rounded-xl text-xs font-extrabold cursor-pointer">✕</button>
                                                            </div>
                                                            <div className="pt-2 border-t border-slate-800">
                                                                <span className="text-[10px] font-bold text-slate-400 block mb-1.5">Eliminar Existentes:</span>
                                                                <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto">
                                                                    {categoriasList.map(c => (
