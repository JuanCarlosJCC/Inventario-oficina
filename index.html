                                                                                                        <div key={cIdx} className="inline-flex items-center gap-1 bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/30 font-bold text-[10px]">
                                                                                                            <Avatar nombre={colab} />
                                                                                                            <span>{colab}</span>
                                                                                                        </div>
                                                                                                    ))}
                                                                                                </div>
                                                                                            </div>
                                                                                        </div>
                                                                                    ))}
                                                                                </div>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                )}
                                                            </React.Fragment>
                                                        );
                                                    } else {
                                                        return (
                                                            <tr key={grupo.id || index} className={`hover:bg-indigo-500/10 transition-colors ${modoClaro ? 'even:bg-slate-50' : 'even:bg-slate-900/30'}`}>
                                                                <td className="p-3.5 whitespace-nowrap">
                                                                    <div className="flex flex-col gap-0.5">
                                                                        <span className="text-[11px] font-bold">📅 {fechaStr}</span>
                                                                        <span className="text-[9px] font-mono text-slate-400">⏰ {horaStr}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="p-3.5 font-mono font-black text-indigo-400">
                                                                    <span>{grupo.sku}</span>
                                                                    {grupo.serie && <span className="block text-[10px] text-amber-400 font-bold">[{grupo.serie}]</span>}
                                                                </td>
                                                                <td className="p-3.5 text-slate-400">{grupo.categoria}</td>
                                                                <td className={`p-3.5 font-bold ${modoClaro ? 'text-slate-800' : 'text-white'}`}>{grupo.producto}</td>
                                                                <td className="p-3.5 font-black">
                                                                    <span className="px-2 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 rounded text-[11px]">{grupo.cantidad} unid.</span>
                                                                </td>
                                                                <td className="p-3.5">
                                                                    <div className="inline-flex items-center gap-1.5 px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded text-[11px] font-bold">
                                                                        <Avatar nombre={grupo.personal_asignado} />
                                                                        <span>{grupo.personal_asignado}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="p-3.5 text-[11px] text-slate-400 text-center font-bold">{grupo.observacionesLimpia}</td>
                                                            </tr>
                                                        );
                                                    }
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        )}

                        {/* MODAL GLOBAL */}
                        {modalAbierto && (
                            <div className="fixed inset-0 bg-black/70 backdrop-blur-xl flex items-center justify-center p-4 z-50">
                                <div className={`animate-modal-spring ${modoClaro ? 'bg-white text-slate-800 border-slate-300' : 'bg-[#0B0F19]/95 text-white border-indigo-500/30'} rounded-3xl border max-w-2xl w-full p-6 space-y-5 max-h-[90vh] overflow-y-auto shadow-2xl`}>
                                    <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-800/80 pb-4">
                                        <h3 className="text-lg font-black">📋 Detalle del Inventario Global</h3>
                                        <button onClick={() => { setModalAbierto(false); setSeccionSeleccionada(null); }} className={`text-xs font-black px-3.5 py-1.5 ${modoClaro ? 'bg-slate-200 text-slate-700' : 'bg-slate-800 text-slate-300'} rounded-xl cursor-pointer hover:bg-slate-300 transition-all btn-haptic`}>✕ Cerrar</button>
                                    </div>
                                    {seccionSeleccionada && (
                                        <div className={`${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} border p-4 rounded-2xl space-y-3.5 shadow-inner`}>
                                            <h4 className="font-black text-[10px] uppercase tracking-widest text-indigo-400">Filtrado por: {seccionSeleccionada.toUpperCase()}</h4>
                                            <div className="max-h-72 overflow-y-auto space-y-3 pr-1">
                                                {seccionSeleccionada === 'personal' ? (
                                                    personalList.map(p => (
                                                        <div key={p.id} className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/80 border-slate-800/80'} border p-3 rounded-xl flex justify-between items-center text-xs font-semibold`}>
                                                            <div className="flex items-center gap-2.5">
                                                                <Avatar nombre={p.nombre} />
                                                                <span><strong>{p.nombre}</strong> ({p.cargo || 'Sin cargo'})</span>
                                                            </div>
                                                            <button onClick={() => handleDeletePersonal(p.id, p.nombre)} className="text-[11px] text-rose-400 font-bold hover:underline cursor-pointer">Eliminar</button>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'total' ? (
                                                    productosUnicosGlobalList.map((padre) => {
                                                        const estaProdExpandido = !!productosExpandidosMap[padre.sku];

                                                        return (
                                                            <div key={padre.sku} className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/80 border-slate-800/80'} border p-3.5 rounded-xl space-y-2.5`}>
                                                                <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                                                                    <div>
                                                                        <span className="font-black text-xs">
                                                                            📦 {padre.producto} (<strong className="font-mono text-indigo-400">{padre.sku}</strong>)
                                                                        </span>
                                                                        <div className="text-[10px] text-slate-400 font-semibold mt-0.5">
                                                                            Categoría: {padre.categoria} • {padre.seriesHijos.length} Serie(s)
                                                                        </div>
                                                                    </div>

                                                                    <div className="flex items-center gap-2">
                                                                        <div className="flex flex-wrap gap-1 text-[9px] font-black">
                                                                            <span className="bg-indigo-500/10 text-indigo-400 px-1.5 py-0.5 rounded border border-indigo-500/30">Total: {padre.cantidadTotal}</span>
                                                                            <span className="bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded border border-indigo-500/30">Libres: {padre.cantidadLibre}</span>
                                                                        </div>

                                                                        <button 
                                                                            onClick={() => toggleProductoExpandido(padre.sku)}
                                                                            className="px-2.5 py-1 rounded-lg text-[11px] font-black bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer transition-all border border-indigo-400/20 btn-haptic"
                                                                        >
                                                                            {estaProdExpandido ? 'Ocultar' : 'Series'}
                                                                        </button>
                                                                    </div>
                                                                </div>

                                                                {estaProdExpandido && (
                                                                    <div className="space-y-1.5 pt-2 border-t border-slate-200 dark:border-slate-800 animate-tab">
                                                                        <span className="text-[9px] font-black uppercase text-indigo-400 tracking-wider block">Desglose de Series:</span>
                                                                        {padre.seriesHijos.map((hijo, hIdx) => (
                                                                            <div key={hIdx} className={`${modoClaro ? 'bg-slate-100 border-slate-200' : 'bg-slate-950 border-slate-800'} border p-2.5 rounded-lg flex justify-between items-center text-[11px] font-bold`}>
                                                                                <span className="font-mono text-amber-400">
                                                                                    🏷️ [{hijo.serie}]
                                                                                </span>
                                                                                <div className="flex gap-1.5 text-[10px]">
                                                                                    <span className="text-slate-400">Total: {hijo.cantidadTotal}</span>
                                                                                    <span className="text-emerald-400">| Libres: {hijo.cantidadLibre}</span>
                                                                                </div>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })
                                                ) : (
                                                    Object.keys(asignacionesAgrupadasListMap).length === 0 ? (
                                                        <p className="text-xs text-slate-500 font-bold text-center py-4">No hay asignaciones registradas.</p>
                                                    ) : (
                                                        Object.entries(asignacionesAgrupadasListMap).map(([nombreColaborador, prodsAgrupadosPorSKU]) => {
                                                            const estaColabExpandido = !!colaboradoresExpandidosMap[nombreColaborador];
                                                            const totalUnidadesColab = prodsAgrupadosPorSKU.reduce((sum, item) => sum + item.cantidad, 0);

                                                            return (
                                                                <div key={nombreColaborador} className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/80 border-slate-800/80'} border p-3.5 rounded-xl space-y-2.5`}>
                                                                    <div className="font-black text-amber-400 text-xs flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                                                                        <div className="flex items-center gap-2">
                                                                            <Avatar nombre={nombreColaborador} />
                                                                            <div>
                                                                                <span className={`${modoClaro ? 'text-slate-800' : 'text-white'} font-black text-xs`}>{nombreColaborador}</span>
                                                                                <span className="text-[10px] text-slate-400 font-bold ml-1.5">({totalUnidadesColab} equipos)</span>
                                                                            </div>
                                                                        </div>

                                                                        <div className="flex items-center gap-1.5">
                                                                            <button 
                                                                                onClick={() => toggleColaboradorExpandido(nombreColaborador)}
                                                                                className="px-2.5 py-1 rounded-lg text-[11px] font-black bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer transition-all border border-indigo-400/20 btn-haptic"
                                                                            >
                                                                                {estaColabExpandido ? 'Ocultar' : 'Equipos'}
                                                                            </button>
                                                                            <button 
                                                                                onClick={() => handleDevolverTodoColaborador(nombreColaborador)}
                                                                                className="px-2.5 py-1 rounded-lg text-[11px] font-black bg-rose-600/20 text-rose-300 border border-rose-500/30 hover:bg-rose-600 hover:text-white cursor-pointer transition-all btn-haptic"
                                                                            >
                                                                                Devolver Todo
                                                                            </button>
                                                                        </div>
                                                                    </div>

                                                                    {estaColabExpandido && (
                                                                        <div className="space-y-2 pt-2 border-t border-slate-200 dark:border-slate-800/80">
                                                                            {prodsAgrupadosPorSKU.map(asigItem => {
                                                                                const { fechaStr, horaStr } = formatearFechaClean(asigItem);
                                                                                let obsItemLimpia = asigItem.observaciones || 'Sin observaciones';
                                                                                obsItemLimpia = obsItemLimpia.replace(/\(LOTE-\d+\)/g, '').replace(/LOTE-\d+/g, '').trim();
                                                                                if (!obsItemLimpia) obsItemLimpia = 'Sin observaciones';

                                                                                return (
                                                                                    <div key={asigItem.sku} className={`${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950 border-slate-800/80'} border p-3 rounded-xl space-y-2 text-xs`}>
                                                                                        <div className="flex justify-between items-start gap-2">
                                                                                            <div>
                                                                                                <div className="font-extrabold text-[11px] text-indigo-400">
                                                                                                    📦 {asigItem.producto} (<span className="font-mono">{asigItem.sku}</span>)
                                                                                                    {asigItem.serie && <span className="ml-1.5 font-mono text-amber-400 font-bold">[{asigItem.serie}]</span>}
                                                                                                </div>
                                                                                                <div className="text-[10px] text-slate-400 font-semibold mt-0.5">
                                                                                                    Cantidad: <strong className={`${modoClaro ? 'text-slate-800' : 'text-white'}`}>{asigItem.cantidad} unid.</strong>
                                                                                                </div>
                                                                                                <div className="text-[10px] text-slate-400 font-semibold mt-0.5">
                                                                                                    Asignado: 📅 {fechaStr} ({horaStr})
                                                                                                </div>
                                                                                            </div>
                                                                                            
                                                                                            <div className="flex items-center gap-1.5">
                                                                                                <button 
                                                                                                    onClick={() => { setEditandoObsKey(asigItem.sku); setNuevaObsTexto(obsItemLimpia !== 'Sin observaciones' ? obsItemLimpia : ''); }} 
                                                                                                    className="px-2 py-1 rounded-lg text-[10px] font-bold bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-500/20 cursor-pointer"
                                                                                                >
                                                                                                    Editar
                                                                                                </button>
                                                                                                <button 
                                                                                                    onClick={() => { setDevolviendoKey(asigItem.sku); setCantDevolver(1); }} 
                                                                                                    className="px-2 py-1 rounded-lg text-[10px] font-black bg-rose-500/10 text-rose-300 border border-rose-500/30 hover:bg-rose-500/20 cursor-pointer"
                                                                                                >
                                                                                                    Devolver
                                                                                                </button>
                                                                                            </div>
                                                                                        </div>

                                                                                        {editandoObsKey === asigItem.sku && (
                                                                                            <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center gap-1.5">
                                                                                                <input 
                                                                                                    type="text" 
                                                                                                    placeholder="Observación..." 
                                                                                                    value={nuevaObsTexto} 
                                                                                                    onChange={e => setNuevaObsTexto(e.target.value)} 
                                                                                                    className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700'} border rounded-lg px-2 py-1 text-[11px] outline-none`}
                                                                                                />
                                                                                                <button onClick={() => handleGuardarObservacionEditada(asigItem)} className="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-[10px] font-black cursor-pointer">OK</button>
                                                                                                <button onClick={() => setEditandoObsKey(null)} className="px-2 py-1 bg-slate-700 text-slate-300 rounded-lg text-[10px] font-black cursor-pointer">✕</button>
                                                                                            </div>
                                                                                        )}

                                                                                        {devolviendoKey === asigItem.sku && (
                                                                                            <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-1.5">
                                                                                                <div className="flex items-center gap-1.5">
                                                                                                    <span className="text-[10px] text-slate-400 font-bold">Cant:</span>
                                                                                                    <input 
                                                                                                        type="number" 
                                                                                                        min="1" 
                                                                                                        max={asigItem.cantidad} 
                                                                                                        value={cantDevolver} 
                                                                                                        onChange={e => setCantDevolver(e.target.value)} 
                                                                                                        className={`w-14 px-1.5 py-0.5 ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-800 border-slate-700 text-white'} border rounded-lg text-[11px] font-black text-center outline-none`} 
                                                                                                    />
                                                                                                </div>
                                                                                                <div className="flex items-center gap-1">
                                                                                                    <button onClick={() => handleEjecutarDevolucionAgrupada(asigItem)} className="px-2 py-0.5 bg-emerald-600 text-white rounded-lg text-[10px] font-black cursor-pointer">Confirmar</button>
                                                                                                    <button onClick={() => setDevolviendoKey(null)} className="px-2 py-0.5 bg-slate-700 text-slate-300 rounded-lg text-[10px] font-black cursor-pointer">✕</button>
                                                                                                </div>
                                                                                            </div>
                                                                                        )}
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            );
                                                        })
                                                    )
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.render(<InventoryApp />, rootElement);
        }
    </script>
</body>
</html>
