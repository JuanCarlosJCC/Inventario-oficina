                                    <p className="text-xs text-slate-400">Estos productos se contabilizan en tus Métricas Totales de inventario, pero están ocultos del módulo de asignación.</p>
                                </div>
                                <div className="space-y-3">
                                    {productosDeshabilitados.length === 0 ? (
                                        <p className="text-sm font-bold text-slate-500 py-6 text-center">No hay productos deshabilitados actualmente.</p>
                                    ) : (
                                        productosDeshabilitados.map(item => (
                                            <div key={item.sku} className="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                                <div>
                                                    <div className="font-black text-indigo-400 font-mono text-sm">{item.sku} - {item.producto}</div>
                                                    <div className="text-xs text-slate-400 mt-1">Categoría: <strong>{item.categoria}</strong> • Stock contabilizado: <strong>{item.cantidadTotal} unidades</strong></div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => handleReactivarProducto(item.sku)} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-extrabold cursor-pointer shadow-md transition-all active:translate-y-0.5">
                                                        🔄 Reactivar
                                                    </button>
                                                    <button onClick={() => handleEliminarDefinitivo(item.sku)} className="px-4 py-2 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-extrabold cursor-pointer hover:bg-rose-600 hover:text-white shadow-md transition-all active:translate-y-0.5">
                                                        🗑️ Eliminar Definitivamente
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </section>
                        )}

                        {/* Agregar Personal */}
                        {tabActiva === 'personal' && (
                            <section className={`animate-tab ${darkMode ? 'bg-slate-900/60 border-slate-800/80 text-slate-100' : 'bg-white/80 border-slate-200 text-slate-800'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl`}>
                                <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">👥</span> Agregar Nuevo Personal</h2>
                                <form onSubmit={handleSavePersonal} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-black uppercase mb-2 text-slate-400">Nombre Completo</label>
                                        <input type="text" placeholder="Ej. Leandro Zamora" value={formPersonal.nombre} onChange={e => setFormPersonal({...formPersonal, nombre: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black uppercase mb-2 text-slate-400">Cargo</label>
                                        {!creandoCargo ? (
                                            <div className="flex gap-2">
                                                <select value={formPersonal.cargo} onChange={e => setFormPersonal({...formPersonal, cargo: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                                    <option value="">-- Seleccionar Cargo --</option>
                                                    {cargosList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                </select>
                                                <button type="button" onClick={() => setCreandoCargo(true)} className="px-5 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-extrabold whitespace-nowrap cursor-pointer transition-all active:translate-y-0.5">Gestionar Cargos</button>
                                            </div>
                                        ) : (
                                            <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                                                <div className="flex gap-2">
                                                    <input type="text" placeholder="Escribe nuevo cargo..." value={nuevoCargoNombre} onChange={e => setNuevoCargoNombre(e.target.value)} className="w-full bg-slate-800 border-slate-700 rounded-xl p-3 text-sm text-white" />
                                                    <button type="button" onClick={handleGuardarNuevoCargo} className="px-4 bg-emerald-600 text-white rounded-xl text-xs font-extrabold cursor-pointer">Guardar</button>
                                                    <button type="button" onClick={() => setCreandoCargo(false)} className="px-4 bg-slate-700 text-slate-300 rounded-xl text-xs font-extrabold cursor-pointer">Cerrar</button>
                                                </div>
                                                <div className="pt-2 border-t border-slate-800">
                                                    <span className="text-[11px] font-bold text-slate-400 block mb-2">Eliminar Cargos Existentes:</span>
                                                    <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto">
                                                        {cargosList.map(c => (
                                                            <span key={c.id} className="inline-flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-lg text-xs font-semibold text-slate-300 border border-slate-700">
                                                                {c.nombre}
                                                                <button type="button" onClick={() => handleEliminarCargo(c.id, c.nombre)} className="text-rose-400 hover:text-rose-300 font-bold cursor-pointer">✕</button>
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 cursor-pointer transition-all active:translate-y-0.5">Guardar Colaborador</button>
                                </form>
                            </section>
                        )}

                        {/* BITÁCORA FIJA CON DISEÑO ORDENADO Y BADGES DE FECHA Y HORA */}
                        {mostrarHistorial && (
                            <section className={`animate-tab ${darkMode ? 'bg-slate-900/60 border-slate-800/80' : 'bg-white/80 border-slate-200'} rounded-3xl border backdrop-blur-xl overflow-hidden shadow-2xl transition-all`}>
                                <div className="p-6 border-b border-slate-800/80 space-y-4">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div>
                                            <h2 className="text-xl font-black">📜 Bitácora e Historial de Movimientos</h2>
                                            <p className="text-xs text-slate-400">Registro cronológico estructurado de asignaciones activas</p>
                                        </div>
                                        <div className="w-full sm:w-auto">
                                            <input type="text" placeholder="🔍 Buscar por nombre, SKU..." value={busqueda} onChange={e => setBusqueda(e.target.value)} className="w-full sm:w-64 bg-slate-800/80 border-slate-700 rounded-2xl px-4 py-2.5 text-xs text-white outline-none focus:border-indigo-500" />
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-2 overflow-x-auto pt-1">
                                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider shrink-0">Filtro Rápido:</span>
                                        <button onClick={() => setFiltroCategoria('TODAS')} className={`px-3 py-1 rounded-xl text-[11px] font-extrabold cursor-pointer whitespace-nowrap transition-all ${filtroCategoria === 'TODAS' ? 'bg-indigo-600 text-white' : 'bg-slate-800/80 text-slate-400 hover:text-white'}`}>Todas</button>
                                        {categoriasList.map(cat => (
                                            <button key={cat.id} onClick={() => setFiltroCategoria(cat.nombre)} className={`px-3 py-1 rounded-xl text-[11px] font-extrabold cursor-pointer whitespace-nowrap transition-all ${filtroCategoria === cat.nombre ? 'bg-indigo-600 text-white' : 'bg-slate-800/80 text-slate-400 hover:text-white'}`}>{cat.nombre}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="overflow-x-auto max-h-96">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-950/90 backdrop-blur-md sticky top-0 text-slate-400 text-xs font-black uppercase border-b border-slate-800/80 z-10">
                                                <th className="p-4">Fecha / Hora</th>
                                                <th className="p-4">SKU</th>
                                                <th className="p-4">Categoría</th>
                                                <th className="p-4">Producto</th>
                                                <th className="p-4">Cantidad</th>
                                                <th className="p-4">Asignado A</th>
                                                <th className="p-4">Observación</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800/60 text-sm">
                                            {productosPaginados.length === 0 ? (
                                                <tr><td colSpan="7" className="p-8 text-center text-slate-500 font-bold">No hay registros de asignaciones activas para mostrar.</td></tr>
                                            ) : (
                                                productosPaginados.map(item => {
                                                    const { fechaStr, horaStr } = formatearFechaClean(item);
                                                    return (
                                                        <tr key={item.id} className="hover:bg-indigo-950/20 transition-colors">
                                                            <td className="p-4 whitespace-nowrap">
                                                                <div className="flex flex-col gap-1">
                                                                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700/80 text-xs font-bold text-slate-200">
                                                                        📅 {fechaStr}
                                                                    </span>
                                                                    <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md bg-slate-900 text-[10px] font-mono font-semibold text-slate-400">
                                                                        ⏰ {horaStr}
                                                                    </span>
                                                                </div>
                                                            </td>
                                                            <td className="p-4 font-mono font-black text-indigo-400">{item.sku}</td>
                                                            <td className="p-4 text-slate-400">{item.categoria}</td>
                                                            <td className="p-4 font-bold text-white">{item.producto}</td>
                                                            <td className="p-4 font-black">
                                                                <span className="px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 rounded-xl text-xs">{item.cantidad} unid.</span>
                                                            </td>
                                                            <td className="p-4">
                                                                <div className="inline-flex items-center gap-2 px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-xl text-xs font-bold">
                                                                    <Avatar nombre={item.personal_asignado} />
                                                                    <span>{item.personal_asignado}</span>
                                                                </div>
                                                            </td>
                                                            <td className="p-4 text-xs text-slate-400">{item.observaciones || '-'}</td>
                                                        </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        )}

                        {/* Modal con Desglose Completo */}
                        {modalAbierto && (
                            <div className="fixed inset-0 bg-[#0B0F19]/80 backdrop-blur-xl flex items-center justify-center p-4 z-50">
                                <div className={`animate-modal-spring ${darkMode ? 'bg-[#0B0F19]/95 border-indigo-500/30 text-white' : 'bg-white border-slate-200 text-slate-800'} rounded-3xl border max-w-2xl w-full p-8 space-y-6 max-h-[90vh] overflow-y-auto shadow-2xl shadow-indigo-950/50`}>
                                    <div className="flex justify-between items-center border-b border-slate-800/80 pb-5">
                                        <h3 className="text-xl font-black">📋 Detalle del Inventario Global</h3>
                                        <button onClick={() => { setModalAbierto(false); setSeccionSeleccionada(null); }} className="text-xs font-black px-4 py-2 bg-slate-800 text-slate-300 rounded-xl cursor-pointer hover:bg-slate-700 transition-all active:translate-y-0.5">✕ Cerrar</button>
                                    </div>
                                    {seccionSeleccionada && (
                                        <div className="bg-slate-950/80 border border-slate-800/80 p-5 rounded-2xl space-y-4">
                                            <h4 className="font-black text-xs uppercase tracking-widest text-indigo-400">Filtrado por: {seccionSeleccionada.toUpperCase()}</h4>
                                            <div className="max-h-72 overflow-y-auto space-y-4 pr-1">
                                                {seccionSeleccionada === 'personal' ? (
                                                    personalList.map(p => (
                                                        <div key={p.id} className="bg-slate-900/80 border border-slate-800/80 p-3.5 rounded-2xl flex justify-between items-center text-sm font-semibold">
                                                            <div className="flex items-center gap-2.5">
                                                                <Avatar nombre={p.nombre} />
                                                                <span><strong>{p.nombre}</strong> ({p.cargo || 'Sin cargo'})</span>
                                                            </div>
                                                            <button onClick={() => handleDeletePersonal(p.id, p.nombre)} className="text-xs text-rose-400 font-black hover:underline cursor-pointer">Eliminar</button>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'total' ? (
                                                    productosUnicosGlobalList.map((item, idx) => (
                                                        <div key={idx} className="bg-slate-900/80 border border-slate-800/80 p-3.5 rounded-2xl text-sm font-semibold flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                                                            <span>📦 {item.producto} (<strong className="font-mono text-indigo-400">{item.sku}</strong>)</span>
                                                            <div className="flex flex-wrap gap-1.5 text-[11px] font-black">
                                                                <span className="bg-indigo-950 text-indigo-400 px-2 py-0.5 rounded-lg border border-indigo-900">Total: {item.cantidadTotal}</span>
                                                                <span className="bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded-lg border border-emerald-900">Libres: {item.cantidadLibre}</span>
                                                                <span className="bg-amber-950 text-amber-400 px-2 py-0.5 rounded-lg border border-amber-900">Uso: {item.cantidadUso}</span>
                                                                <span className="bg-rose-950 text-rose-400 px-2 py-0.5 rounded-lg border border-rose-900">Deshab: {item.cantidadDeshabilitada}</span>
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    Object.keys(asignacionesPorPersonalMap).length === 0 ? (
                                                        <p className="text-xs text-slate-500 font-bold text-center py-4">No hay asignaciones registradas.</p>
                                                    ) : (
                                                        Object.entries(asignacionesPorPersonalMap).map(([nombreColaborador, prodsAsignados]) => (
                                                            <div key={nombreColaborador} className="bg-slate-900/80 border border-slate-800/80 p-4 rounded-2xl space-y-3">
                                                                <div className="font-black text-amber-400 text-sm border-b border-slate-800/80 pb-2 flex items-center justify-between">
                                                                    <div className="flex items-center gap-2">
                                                                        <Avatar nombre={nombreColaborador} />
                                                                        <span>Colaborador: {nombreColaborador}</span>
                                                                    </div>
                                                                    <span className="text-xs text-slate-400 font-bold">({prodsAsignados.length} equipos activos)</span>
                                                                </div>

                                                                <div className="space-y-2.5 pl-2">
                                                                    {prodsAsignados.map(asigItem => {
                                                                        const { fechaStr, horaStr } = formatearFechaClean(asigItem);
                                                                        return (
                                                                            <div key={asigItem.id} className="bg-slate-950 border border-slate-800/80 p-3.5 rounded-xl space-y-2.5">
                                                                                <div className="flex justify-between items-start gap-2">
                                                                                    <div>
                                                                                        <div className="font-extrabold text-xs text-indigo-300">📦 {asigItem.producto} (<span className="font-mono">{asigItem.sku}</span>)</div>
                                                                                        <div className="text-[11px] text-slate-400 font-semibold mt-0.5">
                                                                                            Cantidad: <strong className="text-white">{asigItem.cantidad} unidades</strong>
                                                                                        </div>
                                                                                        <div className="text-[11px] text-slate-400 font-semibold mt-1 flex items-center gap-2">
                                                                                            <span>Asignado el:</span>
                                                                                            <span className="bg-slate-800 px-2 py-0.5 rounded text-slate-200 font-bold">📅 {fechaStr}</span>
                                                                                            <span className="bg-slate-900 px-1.5 py-0.5 rounded text-slate-400 font-mono">⏰ {horaStr}</span>
                                                                                        </div>
                                                                                        <div className="text-[11px] text-slate-400 font-semibold mt-1">
                                                                                            Obs: <span className="text-slate-300 font-normal">{asigItem.observaciones || 'Sin observaciones'}</span>
                                                                                        </div>
                                                                                    </div>
                                                                                    
                                                                                    <div className="flex items-center gap-2">
                                                                                        <button 
                                                                                            onClick={() => { setEditandoObsKey(asigItem.id); setNuevaObsTexto(asigItem.observaciones || ''); }} 
                                                                                            className="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-500/20 cursor-pointer transition-all"
                                                                                        >
                                                                                            ✎ Editar Obs.
                                                                                        </button>
                                                                                        <button 
                                                                                            onClick={() => { setDevolviendoKey(asigItem.id); setCantDevolver(1); }} 
                                                                                            className="px-2.5 py-1 rounded-lg text-xs font-black bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20 cursor-pointer transition-all"
                                                                                        >
                                                                                            Devolver
                                                                                        </button>
                                                                                    </div>
                                                                                </div>

                                                                                {editandoObsKey === asigItem.id && (
                                                                                    <div className="pt-2 border-t border-slate-800 flex items-center gap-2">
                                                                                        <input 
                                                                                            type="text" 
                                                                                            placeholder="Escribe la observación..." 
                                                                                            value={nuevaObsTexto} 
                                                                                            onChange={e => setNuevaObsTexto(e.target.value)} 
                                                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white outline-none"
                                                                                        />
                                                                                        <button onClick={() => handleGuardarObservacionEditada(asigItem)} className="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black cursor-pointer">Guardar</button>
                                                                                        <button onClick={() => setEditandoObsKey(null)} className="px-2 py-1 bg-slate-800 text-slate-400 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                                                    </div>
                                                                                )}

                                                                                {devolviendoKey === asigItem.id && (
                                                                                    <div className="pt-2 border-t border-slate-800 flex items-center justify-between gap-2">
                                                                                        <div className="flex items-center gap-2">
                                                                                            <span className="text-[11px] text-slate-400 font-bold">Devolver:</span>
                                                                                            <input 
                                                                                                type="number" 
                                                                                                min="1" 
                                                                                                max={asigItem.cantidad} 
                                                                                                value={cantDevolver} 
                                                                                                onChange={e => setCantDevolver(e.target.value)} 
                                                                                                className="w-16 px-2 py-1 bg-slate-800 border border-slate-700 rounded-lg text-xs font-black text-white text-center" 
                                                                                            />
                                                                                            <span className="text-[11px] text-slate-500 font-semibold">(Max: {asigItem.cantidad})</span>
                                                                                        </div>
                                                                                        <div className="flex items-center gap-2">
                                                                                            <button onClick={() => handleEjecutarDevolucionAgrupada(asigItem)} className="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black hover:bg-emerald-700 cursor-pointer">Confirmar</button>
                                                                                            <button onClick={() => setDevolviendoKey(null)} className="px-2.5 py-1 bg-slate-800 text-slate-400 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                                                        </div>
                                                                                    </div>
                                                                                )}
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        ))
                                                    )
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<InventoryApp />, document.getElementById('root'));
    </script>
</body>
</html>
