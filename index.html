<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordero y Asociados - Control de Inventario Ultra 4K (Secure)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-size-base: clamp(14px, 1vw, 18px);
        }

        html, body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: var(--font-size-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            image-rendering: -webkit-optimize-contrast;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(5, 7, 14, 0.95); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(129, 140, 248, 0.7); }

        @keyframes modalSpring {
            0% { opacity: 0; transform: scale(0.95) translateY(16px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal-spring { animation: modalSpring 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes tabFade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-tab { animation: tabFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes ambientGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.08); }
        }
        .bg-glow-effect { animation: ambientGlow 10s ease-in-out infinite; }

        @keyframes toastProgress {
            from { width: 100%; }
            to { width: 0%; }
        }
        .animate-toast-bar { animation: toastProgress 3.8s linear forwards; }

        .glow-neon-indigo { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .glow-neon-indigo:hover { 
            border-color: rgba(99, 102, 241, 0.8); 
            box-shadow: 0 0 30px -5px rgba(99, 102, 241, 0.35); 
            transform: translateY(-3px); 
        }

        .glow-neon-emerald { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .glow-neon-emerald:hover { 
            border-color: rgba(16, 185, 129, 0.8); 
            box-shadow: 0 0 30px -5px rgba(16, 185, 129, 0.35); 
            transform: translateY(-3px); 
        }

        .glow-neon-amber { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .glow-neon-amber:hover { 
            border-color: rgba(245, 158, 11, 0.8); 
            box-shadow: 0 0 30px -5px rgba(245, 158, 11, 0.35); 
            transform: translateY(-3px); 
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
        }

        .btn-haptic { transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-haptic:active { transform: scale(0.96); }
    </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white antialiased bg-[#05070E] text-slate-100 min-h-screen relative overflow-x-hidden">
    
    <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div className="absolute -top-40 -left-40 w-[30rem] h-[30rem] bg-indigo-600/15 rounded-full blur-[140px] bg-glow-effect"></div>
        <div className="absolute top-1/3 -right-40 w-[30rem] h-[30rem] bg-purple-600/15 rounded-full blur-[140px] bg-glow-effect" style={{ animationDelay: '3.5s' }}></div>
        <div className="absolute -bottom-40 left-1/3 w-[30rem] h-[30rem] bg-emerald-600/10 rounded-full blur-[140px] bg-glow-effect" style={{ animationDelay: '6s' }}></div>
    </div>

    <div id="root" className="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback, memo } = React;

        const SUPABASE_URL = 'https://ghjcvvcibapzhryrdtte.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Nejs0JlpzyGf5ALznlTSdA_969MDDH4';

        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // Sanitización Anti-Hackers corregida
        const sanitizeInput = (input) => {
            if (typeof input !== 'string') return input;
            let clean = input.replace(/<[^>]*>?/gm, '');
            if (/^[=+\-@].*$/.test(clean)) {
                clean = "'" + clean;
            }
            return clean.trim();
        };

        const Tooltip = memo(({ text, position = 'top', children }) => {
            const [show, setShow] = useState(false);

            const posClasses = {
                top: 'bottom-full left-1/2 -translate-x-1/2 mb-2',
                bottom: 'top-full left-1/2 -translate-x-1/2 mt-2',
                left: 'right-full top-1/2 -translate-y-1/2 mr-2',
                right: 'left-full top-1/2 -translate-y-1/2 ml-2'
            };

            const arrowClasses = {
                top: 'top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-slate-900/95',
                bottom: 'bottom-full left-1/2 -translate-x-1/2 -mb-1 border-4 border-transparent border-b-slate-900/95',
                left: 'left-full top-1/2 -translate-y-1/2 -ml-1 border-4 border-transparent border-l-slate-900/95',
                right: 'right-full top-1/2 -translate-y-1/2 -mr-1 border-4 border-transparent border-r-slate-900/95'
            };

            return (
                <div className="relative inline-block" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
                    {children}
                    {show && (
                        <div className={`absolute ${posClasses[position] || posClasses.top} px-3.5 py-1.5 bg-slate-900/95 text-slate-100 text-[11px] font-bold rounded-xl shadow-2xl border border-indigo-500/40 backdrop-blur-md whitespace-nowrap z-50 pointer-events-none transition-all duration-150 animate-tab`}>
                            {text}
                            <div className={`absolute ${arrowClasses[position] || arrowClasses.top}`}></div>
                        </div>
                    )}
                </div>
            );
        });

        const Avatar = memo(({ nombre }) => {
            const obtenerIniciales = (str) => {
                if (!str) return '??';
                const partes = str.trim().split(' ').filter(Boolean);
                if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
                return str.substring(0, 2).toUpperCase();
            };

            const gradientes = [
                'from-indigo-600 to-violet-600 shadow-indigo-900/40',
                'from-emerald-600 to-teal-600 shadow-emerald-900/40',
                'from-amber-600 to-orange-600 shadow-amber-900/40',
                'from-rose-600 to-pink-600 shadow-rose-900/40',
                'from-cyan-600 to-blue-600 shadow-cyan-900/40'
            ];

            const hash = nombre ? nombre.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0) : 0;
            const gradienteElegido = gradientes[hash % gradientes.length];

            return (
                <Tooltip text={`Colaborador: ${nombre || 'Sin nombre'}`}>
                    <div className={`w-8 h-8 rounded-full bg-gradient-to-br ${gradienteElegido} flex items-center justify-center text-[11px] font-black text-white shadow-lg border border-white/25 shrink-0 transition-transform duration-300 hover:scale-110 cursor-pointer`}>
                        {obtenerIniciales(nombre)}
                    </div>
                </Tooltip>
            );
        });

        const SkeletonRow = memo(() => (
            <tr className="animate-pulse border-b border-slate-800/40">
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-24"></div></td>
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-20"></div></td>
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-28"></div></td>
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-32"></div></td>
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-16"></div></td>
                <td className="p-4"><div className="h-4 bg-slate-800/80 rounded-lg w-28"></div></td>
                <td className="p-4 text-center"><div className="h-6 bg-slate-800/80 rounded-xl w-20 mx-auto"></div></td>
            </tr>
        ));

        function InventoryApp() {
            const [usuarioSesion, setUsuarioSesion] = useState(null);
            const [loginUser, setLoginUser] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState('');

            const [productos, setProductos] = useState([]);
            const [personalList, setPersonalList] = useState([]);
            const [usuariosList, setUsuariosList] = useState([]);
            const [categoriasList, setCategoriasList] = useState([]);
            const [cargosList, setCargosList] = useState([]);
            const [loading, setLoading] = useState(true);
            
            const [busquedaInput, setBusquedaInput] = useState('');
            const [busqueda, setBusqueda] = useState('');

            const [tabActiva, setTabActiva] = useState('asignar');
            const [toast, setToast] = useState({ show: false, message: '', type: 'success', key: 0 });

            const [formProducto, setFormProducto] = useState({ categoria: '', producto: '', cantidad: '', observaciones: '' });

            useEffect(() => {
                const timer = setTimeout(() => {
                    setBusqueda(sanitizeInput(busquedaInput));
                }, 180);
                return () => clearTimeout(timer);
            }, [busquedaInput]);

            const mostrarToast = useCallback((message, type = 'success') => {
                setToast({ show: true, message, type, key: Date.now() });
                setTimeout(() => setToast(prev => ({ ...prev, show: false })), 3800);
            }, []);

            const fetchData = useCallback(async () => {
                if (!supabase) return;
                setLoading(true);
                try {
                    const [
                        { data: prodData },
                        { data: persData },
                        { data: userData },
                        { data: catData },
                        { data: cargoData }
                    ] = await Promise.all([
                        supabase.from('productos').select('*').order('id', { ascending: false }),
                        supabase.from('personal').select('*').order('nombre', { ascending: true }),
                        supabase.from('usuarios').select('*').order('id', { ascending: true }),
                        supabase.from('categorias').select('*').order('nombre', { ascending: true }),
                        supabase.from('cargos').select('*').order('nombre', { ascending: true })
                    ]);

                    setProductos(prodData || []);
                    setPersonalList(persData || []);
                    setUsuariosList(userData || []);
                    setCategoriasList(catData || []);
                    setCargosList(cargoData || []);
                } catch (error) {
                    console.error('Error al cargar datos:', error);
                }
                setLoading(false);
            }, []);

            useEffect(() => {
                const sesionGuardada = localStorage.getItem('sesion_inventario');
                if (sesionGuardada) {
                    const userObj = JSON.parse(sesionGuardada);
                    setUsuarioSesion(userObj);
                }
                fetchData();
            }, [fetchData]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                const cleanUser = sanitizeInput(loginUser);
                const cleanPass = sanitizeInput(loginPass);

                try {
                    const { data, error } = await supabase
                        .from('usuarios')
                        .select('*')
                        .eq('username', cleanUser)
                        .eq('password', cleanPass)
                        .single();

                    if (error || !data) {
                        setLoginError('Usuario o contraseña incorrectos.');
                        return;
                    }

                    setUsuarioSesion(data);
                    localStorage.setItem('sesion_inventario', JSON.stringify(data));
                    mostrarToast(`Bienvenido/a, ${data.nombre}`);
                } catch (err) {
                    setLoginError('Error de conexión con el servidor.');
                }
            };

            const handleLogout = () => {
                setUsuarioSesion(null);
                localStorage.removeItem('sesion_inventario');
            };

            const handleSaveProducto = async (e) => {
                e.preventDefault();
                const nuevoItem = {
                    sku: `PROD-${Date.now().toString().slice(-4)}`,
                    categoria: sanitizeInput(formProducto.categoria),
                    producto: sanitizeInput(formProducto.producto),
                    cantidad: Number(formProducto.cantidad),
                    observaciones: sanitizeInput(formProducto.observaciones),
                    personal_asignado: '',
                    activo: true,
                    fecha_asignacion: new Date().toISOString()
                };

                try {
                    const { data, error } = await supabase.from('productos').insert([nuevoItem]).select();
                    if (!error) {
                        setFormProducto({ categoria: '', producto: '', cantidad: '', observaciones: '' });
                        if (data && data[0]) setProductos(prev => [data[0], ...prev]);
                        else fetchData();
                        mostrarToast('Producto registrado correctamente.');
                    }
                } catch (err) {
                    mostrarToast('Error al registrar producto.', 'error');
                }
            };

            if (!usuarioSesion) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-slate-900/80 border border-slate-800/80 rounded-3xl p-8 backdrop-blur-2xl shadow-2xl shadow-indigo-950/60 space-y-6 transition-all animate-modal-spring">
                            <div className="text-center space-y-2">
                                <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-700 flex items-center justify-center text-3xl mx-auto shadow-xl shadow-indigo-500/30 border border-white/20 hover:scale-105 transition-transform">🏢</div>
                                <h1 className="text-2xl font-extrabold text-white tracking-tight">Cordero y Asociados</h1>
                                <p className="text-xs text-indigo-400 font-bold uppercase tracking-wider">CONTROL DE INVENTARIO SEGURO</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                {loginError && (
                                    <div className="p-3.5 bg-rose-950/80 border border-rose-500/40 rounded-2xl text-xs font-bold text-rose-300 text-center shadow-lg">
                                        ⚠️ {loginError}
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs font-black uppercase mb-1.5 text-slate-400">Usuario</label>
                                    <input 
                                        type="text" 
                                        placeholder="Ingresa tu usuario" 
                                        value={loginUser} 
                                        onChange={e => setLoginUser(e.target.value)} 
                                        className="w-full bg-slate-800/60 border border-slate-700/80 rounded-2xl px-4 py-3 text-sm text-white font-semibold outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all" 
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-black uppercase mb-1.5 text-slate-400">Contraseña</label>
                                    <input 
                                        type="password" 
                                        placeholder="••••••••" 
                                        value={loginPass} 
                                        onChange={e => setLoginPass(e.target.value)} 
                                        className="w-full bg-slate-800/60 border border-slate-700/80 rounded-2xl px-4 py-3 text-sm text-white font-semibold outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all" 
                                        required 
                                    />
                                </div>
                                <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-black py-3.5 rounded-2xl shadow-xl shadow-indigo-600/30 cursor-pointer text-sm btn-haptic border border-indigo-400/20">
                                    Iniciar Sesión
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 md:p-8 transition-colors duration-500">
                    {toast.show && (
                        <div key={toast.key} className={`fixed top-6 right-6 z-50 rounded-2xl text-xs font-black shadow-2xl border backdrop-blur-xl transition-all duration-300 animate-tab overflow-hidden ${toast.type === 'error' ? 'bg-rose-950/90 text-rose-200 border-rose-500/40 shadow-rose-950/50' : 'bg-emerald-950/90 text-emerald-200 border-emerald-500/40 shadow-emerald-950/50'}`}>
                            <div className="px-5 py-3.5 flex items-center gap-2">
                                <span>{toast.type === 'error' ? '⚠️' : '✨'}</span>
                                <span>{toast.message}</span>
                            </div>
                            <div className={`h-1 animate-toast-bar ${toast.type === 'error' ? 'bg-rose-400' : 'bg-emerald-400'}`}></div>
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto space-y-6">
                        <header className="glass-panel border-indigo-500/20 shadow-2xl shadow-indigo-950/30 p-6 md:p-8 rounded-3xl border backdrop-blur-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 transition-all relative overflow-hidden">
                            <div className="flex items-center gap-5 relative z-10">
                                <Tooltip text="Empresa Cordero y Asociados" position="right">
                                    <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 via-indigo-600 to-violet-700 flex items-center justify-center text-2xl text-white shadow-xl shadow-indigo-500/30 border border-white/20 hover:rotate-3 transition-transform cursor-pointer">🏢</div>
                                </Tooltip>
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">Cordero y Asociados</h1>
                                    <p className="text-[11px] text-indigo-400 font-extrabold uppercase tracking-widest mt-0.5 flex items-center gap-2">
                                        <Tooltip text="Sistema protegido contra SQL Injection y XSS" position="bottom">
                                            <span className="relative flex h-2.5 w-2.5 cursor-pointer">
                                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                                <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                                            </span>
                                        </Tooltip>
                                        CONTROL DE INVENTARIO PROTEGIDO
                                    </p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3 relative z-10">
                                <Tooltip text="Usuario activo en el sistema" position="bottom">
                                    <div className="flex items-center gap-2.5 bg-slate-900/80 px-4 py-2 rounded-2xl border border-slate-800 shadow-inner cursor-pointer">
                                        <Avatar nombre={usuarioSesion.nombre} />
                                        <div className="text-left">
                                            <div className="flex items-center gap-1.5">
                                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                                <span className="block text-xs font-black text-white">{usuarioSesion.nombre}</span>
                                            </div>
                                            <span className="block text-[10px] font-extrabold text-indigo-400 uppercase tracking-wide">{usuarioSesion.rol}</span>
                                        </div>
                                    </div>
                                </Tooltip>
                                <Tooltip text="Cerrar la sesión actual" position="bottom">
                                    <button onClick={handleLogout} className="p-3.5 rounded-2xl font-black text-xs bg-rose-600/15 text-rose-300 border border-rose-500/30 hover:bg-rose-600 hover:text-white cursor-pointer btn-haptic">
                                        🚪 Salir
                                    </button>
                                </Tooltip>
                            </div>
                        </header>

                        <div className="bg-slate-900/60 border-slate-800/80 text-slate-100 p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl">
                            <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 shadow-sm">📦</span> Registrar Producto Protegido</h2>
                            <form onSubmit={handleSaveProducto} className="space-y-4">
                                <div>
                                    <label className="block text-[11px] font-black uppercase mb-1.5 text-slate-400">Producto</label>
                                    <input type="text" placeholder="Ej. Laptop HP" value={formProducto.producto} onChange={e => setFormProducto({...formProducto, producto: e.target.value})} className="w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none bg-slate-800/80 border-slate-700 text-white" required />
                                </div>
                                <div>
                                    <label className="block text-[11px] font-black uppercase mb-1.5 text-slate-400">Cantidad Inicial Libre</label>
                                    <input type="number" min="1" placeholder="Ej. 5" value={formProducto.cantidad} onChange={e => setFormProducto({...formProducto, cantidad: e.target.value})} className="w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none bg-slate-800/80 border-slate-700 text-white" required />
                                </div>
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 cursor-pointer btn-haptic border border-indigo-400/20">Guardar Producto</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.render(<InventoryApp />, rootElement);
        }
    </script>
</body>
</html>
