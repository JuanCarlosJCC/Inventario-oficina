                                                                        <span key={c.id} className="inline-flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded-lg text-[11px] font-semibold text-slate-300 border border-slate-700">
                                                                            {c.nombre}
                                                                            <button type="button" onClick={() => handleEliminarCategoria(c.id, c.nombre)} className="text-rose-400 hover:text-rose-300 font-bold cursor-pointer">✕</button>
                                                                        </span>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-black uppercase mb-2 text-slate-400">Producto</label>
                                                    <input type="text" placeholder="Ej. Laptop HP" value={formProducto.producto} onChange={e => setFormProducto({...formProducto, producto: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-black uppercase mb-2 text-slate-400">Cantidad Inicial Libre</label>
                                                    <input type="number" min="1" placeholder="Ej. 5" value={formProducto.cantidad} onChange={e => setFormProducto({...formProducto, cantidad: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                                </div>
                                            </form>
                                        </div>
                                        <button type="submit" form="form-nuevo-prod" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 cursor-pointer mt-4 transition-all active:translate-y-0.5 border border-indigo-400/20">Guardar Producto</button>
                                    </section>

                                    <section className={`${darkMode ? 'bg-slate-900/60 border-slate-800/80 text-slate-100' : 'bg-white/80 border-slate-200 text-slate-800'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl flex flex-col justify-between`}>
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">➕</span> Reabastecer Stock</h2>
                                            <form onSubmit={handleRestockProducto} id="form-restock" className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-black uppercase mb-2 text-slate-400">Seleccionar Producto</label>
                                                    <select value={formRestock.sku} onChange={e => setFormRestock({...formRestock, sku: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                                        <option value="">-- Elige producto --</option>
                                                        {productosUnicosGlobalList.map(item => <option key={item.sku} value={item.sku}>{item.sku} - {item.producto}</option>)}
                                                    </select>
                                                </div>

                                                {productoSeleccionadoRestock && (
                                                    <div className="p-3.5 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex justify-between items-center text-xs font-extrabold">
                                                        <span className="text-emerald-400">📦 Stock Almacén Actual:</span>
                                                        <span className="bg-emerald-600 text-white px-3 py-1 rounded-xl shadow-inner">{productoSeleccionadoRestock.cantidadTotal} unidades</span>
                                                    </div>
                                                )}

                                                <div>
                                                    <label className="block text-xs font-black uppercase mb-2 text-slate-400">Unidades a Sumar</label>
                                                    <input type="number" min="1" placeholder="Ej. 10" value={formRestock.cantidadExtra} onChange={e => setFormRestock({...formRestock, cantidadExtra: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                                </div>
                                            </form>
                                        </div>
                                        <button type="submit" form="form-restock" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3.5 rounded-2xl transition-all shadow-lg shadow-emerald-600/30 cursor-pointer mt-4 active:translate-y-0.5 border border-emerald-400/20">Sumar Stock</button>
                                    </section>

                                    <section className={`${darkMode ? 'bg-slate-900/60 border-slate-800/80 text-slate-100' : 'bg-white/80 border-slate-200 text-slate-800'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl flex flex-col justify-between`}>
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20">🚫</span> Deshabilitar Producto</h2>
                                            <p className="text-xs text-slate-400 leading-relaxed">Al deshabilitar un producto, no aparecerá en las opciones para asignar a personal, pero seguirá contado dentro de tu total de inventario.</p>
                                            
                                            <form onSubmit={handleDeshabilitarProducto} id="form-deshabilitar" className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-black uppercase mb-2 text-slate-400">Seleccionar Producto a Deshabilitar</label>
                                                    <select value={skuADeshabilitar} onChange={e => setSkuADeshabilitar(e.target.value)} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                                        <option value="">-- Elige producto --</option>
                                                        {productosUnicosGlobalList.filter(p => p.cantidadDeshabilitada === 0).map(item => <option key={item.sku} value={item.sku}>{item.sku} - {item.producto}</option>)}
                                                    </select>
                                                </div>

                                                {productoSeleccionadoDeshabilitar && (
                                                    <div className="p-3.5 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex justify-between items-center text-xs font-extrabold">
                                                        <span className="text-rose-400">📦 Total de Stock a Deshabilitar:</span>
                                                        <span className="bg-rose-600 text-white px-3 py-1 rounded-xl shadow-inner">{productoSeleccionadoDeshabilitar.cantidadTotal} unidades</span>
                                                    </div>
                                                )}
                                            </form>
                                        </div>
                                        <button type="submit" form="form-deshabilitar" className="w-full bg-rose-600 hover:bg-rose-500 text-white font-extrabold py-3.5 rounded-2xl transition-all shadow-lg shadow-rose-600/30 cursor-pointer mt-4 active:translate-y-0.5 border border-rose-400/20">Deshabilitar Producto</button>
                                    </section>
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA: DESHABILITADOS */}
                        {tabActiva === 'deshabilitados' && (
                            <section className={`animate-tab ${darkMode ? 'bg-slate-900/60 border-slate-800/80' : 'bg-white/80 border-slate-200'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl`}>
                                <div>
                                    <h2 className="text-xl font-black">🚫 Productos Deshabilitados</h2>
                                    <p className="text-xs text-slate-400">Estos productos se contabilizan en tus Métricas Totales de inventario, pero están ocultos del módulo de asignación.</p>
                                </div>
                                <div className="space-y-3">
                                    {productosDeshabilitados.length === 0 ? (
                                        <p className="text-sm font-bold text-slate-500 py-6 text-center">No hay productos deshabilitados actualmente.</p>
                                    ) : (
                                        productosDeshabilitados.map(item => (
                                            <div key={item.sku} className="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                                <div>
                                                    <div className="font-black text-indigo-400 font-mono text-sm">{item.sku} - {item.producto}</div>
                                                    <div className="text-xs text-slate-400 mt-1">Categoría: <strong>{item.categoria}</strong> • Stock contabilizado: <strong>{item.cantidadTotal} unidades</strong></div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => handleReactivarProducto(item.sku)} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-extrabold cursor-pointer shadow-md transition-all active:translate-y-0.5">
                                                        🔄 Reactivar
                                                    </button>
                                                    <button onClick={() => handleEliminarDefinitivo(item.sku)} className="px-4 py-2 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-extrabold cursor-pointer hover:bg-rose-600 hover:text-white shadow-md transition-all active:translate-y-0.5">
                                                        🗑️ Eliminar Definitivamente
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </section>
                        )}

                        {/* PESTAÑA: AGREGAR PERSONAL */}
                        {tabActiva === 'personal' && (
                            <section className={`animate-tab ${darkMode ? 'bg-slate-900/60 border-slate-800/80 text-slate-100' : 'bg-white/80 border-slate-200 text-slate-800'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl`}>
                                <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">👥</span> Agregar Nuevo Personal</h2>
                                <form onSubmit={handleSavePersonal} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-black uppercase mb-2 text-slate-400">Nombre Completo</label>
                                        <input type="text" placeholder="Ej. Leandro Zamora" value={formPersonal.nombre} onChange={e => setFormPersonal({...formPersonal, nombre: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black uppercase mb-2 text-slate-400">Cargo</label>
                                        {!creandoCargo ? (
                                            <div className="flex gap-2">
                                                <select value={formPersonal.cargo} onChange={e => setFormPersonal({...formPersonal, cargo: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                                    <option value="">-- Seleccionar Cargo --</option>
                                                    {cargosList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                </select>
                                                <button type="button" onClick={() => setCreandoCargo(true)} className="px-5 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-extrabold whitespace-nowrap cursor-pointer transition-all active:translate-y-0.5 border border-indigo-400/20">Gestionar Cargos</button>
                                            </div>
                                        ) : (
                                            <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                                                <div className="flex gap-2">
                                                    <input type="text" placeholder="Escribe nuevo cargo..." value={nuevoCargoNombre} onChange={e => setNuevoCargoNombre(e.target.value)} className="w-full bg-slate-800 border-slate-700 rounded-xl p-3 text-sm text-white" />
                                                    <button type="button" onClick={handleGuardarNuevoCargo} className="px-4 bg-emerald-600 text-white rounded-xl text-xs font-extrabold cursor-pointer">Guardar</button>
                                                    <button type="button" onClick={() => setCreandoCargo(false)} className="px-4 bg-slate-700 text-slate-300 rounded-xl text-xs font-extrabold cursor-pointer">Cerrar</button>
                                                </div>
                                                <div className="pt-2 border-t border-slate-800">
                                                    <span className="text-[11px] font-bold text-slate-400 block mb-2">Eliminar Cargos Existentes:</span>
                                                    <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto">
                                                        {cargosList.map(c => (
                                                            <span key={c.id} className="inline-flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-lg text-xs font-semibold text-slate-300 border border-slate-700">
                                                                {c.nombre}
                                                                <button type="button" onClick={() => handleEliminarCargo(c.id, c.nombre)} className="text-rose-400 hover:text-rose-300 font-bold cursor-pointer">✕</button>
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 cursor-pointer transition-all active:translate-y-0.5 border border-indigo-400/20">Guardar Colaborador</button>
                                </form>
                            </section>
                        )}

                        {/* BITÁCORA E HISTORIAL COMPLETO */}
                        {mostrarHistorial && (
                            <section className={`animate-tab ${darkMode ? 'bg-slate-900/60 border-slate-800/80' : 'bg-white/80 border-slate-200'} rounded-3xl border backdrop-blur-xl overflow-hidden shadow-2xl transition-all`}>
                                <div className="p-6 border-b border-slate-800/80 space-y-4">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div>
                                            <h2 className="text-xl font-black">📜 Bitácora e Historial de Movimientos</h2>
                                            <p className="text-xs text-slate-400">Historial completo de eventos y registros de asignación</p>
                                        </div>
                                        <div className="w-full sm:w-auto">
                                            <input type="text" placeholder="🔍 Buscar por nombre, SKU..." value={busqueda} onChange={e => setBusqueda(e.target.value)} className="w-full sm:w-64 bg-slate-800/80 border-slate-700 rounded-2xl px-4 py-2.5 text-xs text-white outline-none focus:border-indigo-500 transition-colors" />
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-2 overflow-x-auto pt-1">
                                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider shrink-0">Filtro Rápido:</span>
                                        <button onClick={() => setFiltroCategoria('TODAS')} className={`px-3 py-1.5 rounded-xl text-[11px] font-extrabold cursor-pointer whitespace-nowrap transition-all ${filtroCategoria === 'TODAS' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'bg-slate-800/80 text-slate-400 hover:text-white'}`}>Todas</button>
                                        {categoriasList.map(cat => (
                                            <button key={cat.id} onClick={() => setFiltroCategoria(cat.nombre)} className={`px-3 py-1.5 rounded-xl text-[11px] font-extrabold cursor-pointer whitespace-nowrap transition-all ${filtroCategoria === cat.nombre ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'bg-slate-800/80 text-slate-400 hover:text-white'}`}>{cat.nombre}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="overflow-x-auto max-h-[650px] overflow-y-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-950/90 backdrop-blur-md sticky top-0 text-slate-400 text-xs font-black uppercase border-b border-slate-800/80 z-10">
                                                <th className="p-4">Fecha / Hora</th>
                                                <th className="p-4">SKU</th>
                                                <th className="p-4">Categoría</th>
                                                <th className="p-4">Producto</th>
                                                <th className="p-4">Cantidad</th>
                                                <th className="p-4">Asignado A</th>
                                                <th className="p-4 text-center">Acción / Detalle</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800/60 text-sm">
                                            {historialFiltrado.length === 0 ? (
                                                <tr><td colSpan="7" className="p-8 text-center text-slate-500 font-bold">No hay registros de asignaciones para mostrar.</td></tr>
                                            ) : (
                                                historialFiltrado.map((grupo, index) => {
                                                    const { fechaStr, horaStr } = formatearFechaClean(grupo);
                                                    const estaExpandido = !!lotesExpandidosMap[grupo.loteKey];

                                                    if (grupo.esLote) {
                                                        return (
                                                            <React.Fragment key={grupo.loteKey || index}>
                                                                <tr className="bg-indigo-950/20 hover:bg-indigo-950/40 transition-colors border-l-4 border-l-indigo-500">
                                                                    <td className="p-4 whitespace-nowrap">
                                                                        <div className="flex flex-col gap-1">
                                                                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-indigo-900/40 border border-indigo-700/50 text-xs font-bold text-indigo-200">
                                                                                📅 {fechaStr}
                                                                            </span>
                                                                            <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md bg-slate-900/80 text-[10px] font-mono font-semibold text-indigo-300 border border-slate-800/60">
                                                                                ⏰ {horaStr}
                                                                            </span>
                                                                        </div>
                                                                    </td>
                                                                    <td className="p-4 font-mono font-black text-purple-400">
                                                                        <span className="bg-purple-950/80 px-2.5 py-1 rounded-lg border border-purple-800/80 text-xs shadow-sm">🚀 ASIGNACIÓN</span>
                                                                    </td>
                                                                    <td className="p-4 text-slate-400 font-bold">Varias Categ.</td>
                                                                    <td className="p-4 font-extrabold text-indigo-300">
                                                                        {grupo.prodsCount} Producto(s)
                                                                    </td>
                                                                    <td className="p-4 font-black">
                                                                        <span className="px-3 py-1 bg-purple-500/15 text-purple-300 border border-purple-500/30 rounded-xl text-xs">{grupo.cantTotal} unid. totales</span>
                                                                    </td>
                                                                    <td className="p-4">
                                                                        <span className="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-xl text-xs font-bold">
                                                                            👥 {grupo.persCount} Colaborador(es)
                                                                        </span>
                                                                    </td>
                                                                    <td className="p-4 text-center">
                                                                        <button 
                                                                            onClick={() => toggleLoteExpandido(grupo.loteKey)} 
                                                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-black shadow-md transition-all cursor-pointer flex items-center gap-1.5 mx-auto active:scale-95 border border-indigo-400/20"
                                                                        >
                                                                            <span>{estaExpandido ? '📂 Ocultar Detalle' : '👁️ Ver Detalle'}</span>
                                                                        </button>
                                                                    </td>
                                                                </tr>

                                                                {estaExpandido && (
                                                                    <tr>
                                                                        <td colSpan="7" className="p-4 bg-slate-950/90 border-b border-indigo-900/50">
                                                                            <div className="p-5 rounded-2xl bg-slate-900/90 border border-indigo-500/30 space-y-4 shadow-inner">
                                                                                <div className="flex justify-between items-center text-xs font-extrabold text-indigo-300 border-b border-slate-800 pb-2.5">
                                                                                    <span>📋 Detalle Agrupado por Producto</span>
                                                                                    <span className="text-slate-400 font-normal">Obs: {grupo.observaciones}</span>
                                                                                </div>
                                                                                <div className="space-y-3 max-h-56 overflow-y-auto pr-1">
                                                                                    {grupo.productosAgrupadosLote.map((prodAgrup, pIdx) => (
                                                                                        <div key={pIdx} className="p-3.5 bg-slate-950 rounded-2xl border border-slate-800/80 flex flex-col md:flex-row justify-between md:items-center text-xs gap-3">
                                                                                            <div className="flex items-center gap-3">
                                                                                                <span className="font-mono font-black text-indigo-400 bg-indigo-950/80 px-2.5 py-1 rounded-lg border border-indigo-800/80">{prodAgrup.sku}</span>
                                                                                                <div>
                                                                                                    <div className="font-extrabold text-white text-sm">{prodAgrup.producto}</div>
                                                                                                    <div className="text-slate-400 text-[11px] font-semibold">Categoría: {prodAgrup.categoria}</div>
                                                                                                </div>
                                                                                            </div>
                                                                                            <div className="flex items-center gap-3 flex-wrap">
                                                                                                <span className="bg-indigo-950/80 text-indigo-300 px-3 py-1 rounded-xl border border-indigo-800/80 font-black text-xs">{prodAgrup.cantidadTotal} unid. asignadas</span>
                                                                                                <div className="flex items-center gap-1.5 flex-wrap">
                                                                                                    <span className="text-[11px] text-slate-400 font-bold">A:</span>
                                                                                                    {prodAgrup.colaboradores.map((colab, cIdx) => (
                                                                                                        <div key={cIdx} className="inline-flex items-center gap-1.5 bg-amber-950/60 text-amber-300 px-2.5 py-1 rounded-xl border border-amber-800/80 font-bold text-[11px]">
                                                                                                            <Avatar nombre={colab} />
                                                                                                            <span>{colab}</span>
                                                                                                        </div>
                                                                                                    ))}
                                                                                                </div>
                                                                                            </div>
                                                                                        </div>
                                                                                    ))}
                                                                                </div>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                )}
                                                            </React.Fragment>
                                                        );
                                                    } else {
                                                        return (
                                                            <tr key={grupo.id || index} className="hover:bg-indigo-950/20 transition-colors">
                                                                <td className="p-4 whitespace-nowrap">
                                                                    <div className="flex flex-col gap-1">
                                                                        <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700/80 text-xs font-bold text-slate-200">
                                                                            📅 {fechaStr}
                                                                        </span>
                                                                        <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md bg-slate-900 text-[10px] font-mono font-semibold text-slate-400">
                                                                            ⏰ {horaStr}
                                                                        </span>
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 font-mono font-black text-indigo-400">{grupo.sku}</td>
                                                                <td className="p-4 text-slate-400">{grupo.categoria}</td>
                                                                <td className="p-4 font-bold text-white">{grupo.producto}</td>
                                                                <td className="p-4 font-black">
                                                                    <span className="px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 rounded-xl text-xs">{grupo.cantidad} unid.</span>
                                                                </td>
                                                                <td className="p-4">
                                                                    <div className="inline-flex items-center gap-2 px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-xl text-xs font-bold">
                                                                        <Avatar nombre={grupo.personal_asignado} />
                                                                        <span>{grupo.personal_asignado}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 text-xs text-slate-400 text-center font-bold">{grupo.observacionesLimpia}</td>
                                                            </tr>
                                                        );
                                                    }
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        )}

                        {/* MODAL GLOBAL CON PRODUCTOS AGRUPADOS Y SUMADOS POR COLABORADOR */}
                        {modalAbierto && (
                            <div className="fixed inset-0 bg-[#0B0F19]/80 backdrop-blur-xl flex items-center justify-center p-4 z-50">
                                <div className={`animate-modal-spring ${darkMode ? 'bg-[#0B0F19]/95 border-indigo-500/30 text-white' : 'bg-white border-slate-200 text-slate-800'} rounded-3xl border max-w-2xl w-full p-8 space-y-6 max-h-[90vh] overflow-y-auto shadow-2xl shadow-indigo-950/50`}>
                                    <div className="flex justify-between items-center border-b border-slate-800/80 pb-5">
                                        <h3 className="text-xl font-black">📋 Detalle del Inventario Global</h3>
                                        <button onClick={() => { setModalAbierto(false); setSeccionSeleccionada(null); }} className="text-xs font-black px-4 py-2 bg-slate-800 text-slate-300 rounded-xl cursor-pointer hover:bg-slate-700 transition-all active:translate-y-0.5 border border-slate-700/50">✕ Cerrar</button>
                                    </div>
                                    {seccionSeleccionada && (
                                        <div className="bg-slate-950/80 border border-slate-800/80 p-5 rounded-2xl space-y-4">
                                            <h4 className="font-black text-xs uppercase tracking-widest text-indigo-400">Filtrado por: {seccionSeleccionada.toUpperCase()}</h4>
                                            <div className="max-h-80 overflow-y-auto space-y-4 pr-1">
                                                {seccionSeleccionada === 'personal' ? (
                                                    personalList.map(p => (
                                                        <div key={p.id} className="bg-slate-900/80 border border-slate-800/80 p-3.5 rounded-2xl flex justify-between items-center text-sm font-semibold">
                                                            <div className="flex items-center gap-2.5">
                                                                <Avatar nombre={p.nombre} />
                                                                <span><strong>{p.nombre}</strong> ({p.cargo || 'Sin cargo'})</span>
                                                            </div>
                                                            <button onClick={() => handleDeletePersonal(p.id, p.nombre)} className="text-xs text-rose-400 font-black hover:underline cursor-pointer">Eliminar</button>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'total' ? (
                                                    productosUnicosGlobalList.map((item, idx) => (
                                                        <div key={idx} className="bg-slate-900/80 border border-slate-800/80 p-3.5 rounded-2xl text-sm font-semibold flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                                                            <span>📦 {item.producto} (<strong className="font-mono text-indigo-400">{item.sku}</strong>)</span>
                                                            <div className="flex flex-wrap gap-1.5 text-[11px] font-black">
                                                                <span className="bg-indigo-950 text-indigo-400 px-2 py-0.5 rounded-lg border border-indigo-900">Total: {item.cantidadTotal}</span>
                                                                <span className="bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded-lg border border-emerald-900">Libres: {item.cantidadLibre}</span>
                                                                <span className="bg-amber-950 text-amber-400 px-2 py-0.5 rounded-lg border border-amber-900">Uso: {item.cantidadUso}</span>
                                                                <span className="bg-rose-950 text-rose-400 px-2 py-0.5 rounded-lg border border-rose-900">Deshab: {item.cantidadDeshabilitada}</span>
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    Object.keys(asignacionesAgrupadasListMap).length === 0 ? (
                                                        <p className="text-xs text-slate-500 font-bold text-center py-4">No hay asignaciones registradas.</p>
                                                    ) : (
                                                        Object.entries(asignacionesAgrupadasListMap).map(([nombreColaborador, prodsAgrupadosPorSKU]) => {
                                                            const estaColabExpandido = !!colaboradoresExpandidosMap[nombreColaborador];
                                                            const totalUnidadesColab = prodsAgrupadosPorSKU.reduce((sum, item) => sum + item.cantidad, 0);

                                                            return (
                                                                <div key={nombreColaborador} className="bg-slate-900/80 border border-slate-800/80 p-4 rounded-2xl space-y-3">
                                                                    {/* Cabecera del Colaborador */}
                                                                    <div className="font-black text-amber-400 text-sm flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                                                                        <div className="flex items-center gap-2.5">
                                                                            <Avatar nombre={nombreColaborador} />
                                                                            <div>
                                                                                <span className="text-white font-extrabold">{nombreColaborador}</span>
                                                                                <span className="text-xs text-slate-400 font-bold ml-2">({totalUnidadesColab} equipos activos)</span>
                                                                            </div>
                                                                        </div>

                                                                        <div className="flex items-center gap-2">
                                                                            <button 
                                                                                onClick={() => toggleColaboradorExpandido(nombreColaborador)}
                                                                                className="px-3 py-1.5 rounded-xl text-xs font-black bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer transition-all active:translate-y-0.5 border border-indigo-400/20"
                                                                            >
                                                                                {estaColabExpandido ? '📂 Ocultar Equipos' : '👁️ Ver Equipos'}
                                                                            </button>
                                                                            <button 
                                                                                onClick={() => handleDevolverTodoColaborador(nombreColaborador)}
                                                                                className="px-3 py-1.5 rounded-xl text-xs font-black bg-rose-600/20 text-rose-300 border border-rose-500/30 hover:bg-rose-600 hover:text-white cursor-pointer transition-all active:translate-y-0.5"
                                                                            >
                                                                                🔄 Devolver Todo
                                                                            </button>
                                                                        </div>
                                                                    </div>

                                                                    {/* Lista Desplegable Consolidada por SKU */}
                                                                    {estaColabExpandido && (
                                                                        <div className="space-y-2.5 pt-2 border-t border-slate-800/80">
                                                                            {prodsAgrupadosPorSKU.map(asigItem => {
                                                                                const { fechaStr, horaStr } = formatearFechaClean(asigItem);
                                                                                let obsItemLimpia = asigItem.observaciones || 'Sin observaciones';
                                                                                obsItemLimpia = obsItemLimpia.replace(/\(LOTE-\d+\)/g, '').replace(/LOTE-\d+/g, '').trim();
                                                                                if (!obsItemLimpia) obsItemLimpia = 'Sin observaciones';

                                                                                return (
                                                                                    <div key={asigItem.sku} className="bg-slate-950 border border-slate-800/80 p-3.5 rounded-xl space-y-2.5">
                                                                                        <div className="flex justify-between items-start gap-2">
                                                                                            <div>
                                                                                                <div className="font-extrabold text-xs text-indigo-300">📦 {asigItem.producto} (<span className="font-mono">{asigItem.sku}</span>)</div>
                                                                                                <div className="text-[11px] text-slate-400 font-semibold mt-0.5">
                                                                                                    Cantidad Asignada: <strong className="text-white text-xs">{asigItem.cantidad} unidades</strong>
                                                                                                </div>
                                                                                                <div className="text-[11px] text-slate-400 font-semibold mt-1 flex items-center gap-2">
                                                                                                    <span>Última asignación:</span>
                                                                                                    <span className="bg-slate-800 px-2 py-0.5 rounded text-slate-200 font-bold">📅 {fechaStr}</span>
                                                                                                    <span className="bg-slate-900 px-1.5 py-0.5 rounded text-slate-400 font-mono">⏰ {horaStr}</span>
                                                                                                </div>
                                                                                                <div className="text-[11px] text-slate-400 font-semibold mt-1">
                                                                                                    Obs: <span className="text-slate-300 font-normal">{obsItemLimpia}</span>
                                                                                                </div>
                                                                                            </div>
                                                                                            
                                                                                            <div className="flex items-center gap-2">
                                                                                                <button 
                                                                                                    onClick={() => { setEditandoObsKey(asigItem.sku); setNuevaObsTexto(obsItemLimpia !== 'Sin observaciones' ? obsItemLimpia : ''); }} 
                                                                                                    className="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-500/20 cursor-pointer transition-all"
                                                                                                >
                                                                                                    ✎ Editar Obs.
                                                                                                </button>
                                                                                                <button 
                                                                                                    onClick={() => { setDevolviendoKey(asigItem.sku); setCantDevolver(1); }} 
                                                                                                    className="px-2.5 py-1 rounded-lg text-xs font-black bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20 cursor-pointer transition-all"
                                                                                                >
                                                                                                    Devolver
                                                                                                </button>
                                                                                            </div>
                                                                                        </div>

                                                                                        {editandoObsKey === asigItem.sku && (
                                                                                            <div className="pt-2 border-t border-slate-800 flex items-center gap-2">
                                                                                                <input 
                                                                                                    type="text" 
                                                                                                    placeholder="Escribe la observación..." 
                                                                                                    value={nuevaObsTexto} 
                                                                                                    onChange={e => setNuevaObsTexto(e.target.value)} 
                                                                                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white outline-none focus:border-indigo-500 transition-colors"
                                                                                                />
                                                                                                <button onClick={() => handleGuardarObservacionEditada(asigItem)} className="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black cursor-pointer">Guardar</button>
                                                                                                <button onClick={() => setEditandoObsKey(null)} className="px-2 py-1 bg-slate-800 text-slate-400 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                                                            </div>
                                                                                        )}

                                                                                        {devolviendoKey === asigItem.sku && (
                                                                                            <div className="pt-2 border-t border-slate-800 flex items-center justify-between gap-2">
                                                                                                <div className="flex items-center gap-2">
                                                                                                    <span className="text-[11px] text-slate-400 font-bold">Devolver:</span>
                                                                                                    <input 
                                                                                                        type="number" 
                                                                                                        min="1" 
                                                                                                        max={asigItem.cantidad} 
                                                                                                        value={cantDevolver} 
                                                                                                        onChange={e => setCantDevolver(e.target.value)} 
                                                                                                        className="w-16 px-2 py-1 bg-slate-800 border border-slate-700 rounded-lg text-xs font-black text-white text-center focus:border-indigo-500 outline-none" 
                                                                                                    />
                                                                                                    <span className="text-[11px] text-slate-500 font-semibold">(Max: {asigItem.cantidad})</span>
                                                                                                </div>
                                                                                                <div className="flex items-center gap-2">
                                                                                                    <button onClick={() => handleEjecutarDevolucionAgrupada(asigItem)} className="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black hover:bg-emerald-700 cursor-pointer">Confirmar</button>
                                                                                                    <button onClick={() => setDevolviendoKey(null)} className="px-2.5 py-1 bg-slate-800 text-slate-400 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                                                                </div>
                                                                                            </div>
                                                                                        )}
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            );
                                                        })
                                                    )
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.render(<InventoryApp />, rootElement);
        }
    </script>
</body>
</html>
