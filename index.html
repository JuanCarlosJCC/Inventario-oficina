                                                            <button type="button" onClick={() => setCreandoRol(true)} className="px-3.5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-black cursor-pointer btn-haptic">Roles</button>
                                                        </div>
                                                    ) : (
                                                        <div className={`p-3 rounded-xl ${modoClaro ? 'bg-slate-100 border-slate-300' : 'bg-slate-900 border-slate-800'} border space-y-2.5 shadow-inner`}>
                                                            <div className="flex gap-2">
                                                                <input type="text" placeholder="Nuevo rol..." value={nuevoRolNombre} onChange={e => setNuevoRolNombre(e.target.value)} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-800 border-slate-700 text-white'} rounded-lg px-2.5 py-1.5 text-xs uppercase`} />
                                                                <button type="button" onClick={handleGuardarNuevoRol} className="px-3 bg-emerald-600 text-white rounded-lg text-xs font-black cursor-pointer">OK</button>
                                                                <button type="button" onClick={() => setCreandoRol(false)} className="px-3 bg-slate-700 text-slate-300 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                            </div>
                                                            <div className="pt-2 border-t border-slate-300 dark:border-slate-800">
                                                                <p className="text-[9px] font-black uppercase text-slate-400 mb-1">Roles creados (clic para eliminar):</p>
                                                                <div className="max-h-28 overflow-y-auto space-y-1">
                                                                    {rolesList.map(r => (
                                                                        <div key={r.id} className="flex justify-between items-center bg-slate-950 px-2 py-1 rounded text-[11px]">
                                                                            <span className="font-mono text-indigo-300">{r.nombre}</span>
                                                                            {r.nombre !== 'ADMIN_PRINCIPAL' && (
                                                                                <button type="button" onClick={() => handleEliminarRolGlobal(r.id, r.nombre)} className="text-[9px] text-rose-400 font-bold hover:underline">Eliminar</button>
                                                                            )}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>

                                                <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-black py-3 rounded-xl text-xs shadow-md shadow-indigo-600/30 cursor-pointer btn-haptic border border-indigo-400/20">
                                                    Registrar Usuario
                                                </button>
                                            </form>
                                        ) : (
                                            <form onSubmit={handleGuardarCambiosUsuario} className="bg-indigo-950/30 p-5 rounded-2xl border border-indigo-500/50 space-y-3.5 shadow-xl">
                                                <div className="flex justify-between items-center">
                                                    <h3 className="text-xs font-black text-indigo-400 uppercase tracking-wider">✏️ Editar Usuario</h3>
                                                    <button type="button" onClick={() => setUsuarioEditando(null)} className="text-xs font-bold text-slate-400 hover:text-white">✕ Cancelar</button>
                                                </div>
                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Nombre Completo</label>
                                                    <input type="text" value={formEditarUsuario.nombre} onChange={e => setFormEditarUsuario({...formEditarUsuario, nombre: e.target.value})} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700/80 text-white'} border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-indigo-500`} required />
                                                </div>
                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Usuario / Login</label>
                                                    <input type="text" value={formEditarUsuario.username} onChange={e => setFormEditarUsuario({...formEditarUsuario, username: e.target.value})} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700/80 text-white'} border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-indigo-500`} required />
                                                </div>
                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Nueva Contraseña</label>
                                                    <input type="text" value={formEditarUsuario.password} onChange={e => setFormEditarUsuario({...formEditarUsuario, password: e.target.value})} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700/80 text-white'} border rounded-xl px-3.5 py-2.5 text-xs font-mono outline-none focus:border-indigo-500`} required />
                                                </div>

                                                <button type="submit" className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black py-3 rounded-xl text-xs shadow-md shadow-emerald-600/30 cursor-pointer btn-haptic border border-emerald-400/20">
                                                    Guardar Cambios
                                                </button>
                                            </form>
                                        )}
                                    </div>

                                    <div className="lg:col-span-2 space-y-3">
                                        <h3 className={`text-xs font-black ${modoClaro ? 'text-slate-700' : 'text-slate-300'} uppercase tracking-wider`}>Usuarios Registrados ({usuariosList.length})</h3>
                                        <div className="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                                            {usuariosList.map(u => (
                                                <div key={u.id} className={`${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} border p-4 rounded-2xl flex flex-col justify-between gap-3 transition-all hover:border-slate-400`}>
                                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                                        <div className="flex items-center gap-3">
                                                            <Avatar nombre={u.nombre} />
                                                            <div>
                                                                <span className={`font-black ${modoClaro ? 'text-slate-800' : 'text-white'} text-xs`}>{u.nombre}</span>
                                                                <span className="text-[11px] text-indigo-400 font-mono ml-2">(@{u.username})</span>
                                                                <span className={`ml-2 px-2 py-0.5 rounded-md text-[9px] font-black border ${u.rol === 'ADMIN_PRINCIPAL' ? 'bg-amber-500/20 text-amber-400 border-amber-500/40' : modoClaro ? 'bg-slate-200 text-slate-700 border-slate-300' : 'bg-slate-800/80 text-slate-300 border-slate-700'}`}>{u.rol}</span>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center gap-1.5">
                                                            <Tooltip text="Editar usuario" position="left">
                                                                <button onClick={() => handleIniciarEdicionUsuario(u)} className="p-2 bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-600 hover:text-white rounded-xl text-xs font-black cursor-pointer">
                                                                    ✏️
                                                                </button>
                                                            </Tooltip>
                                                            {u.rol !== 'ADMIN_PRINCIPAL' && (
                                                                <Tooltip text="Eliminar usuario" position="left">
                                                                    <button onClick={() => handleEliminarUsuario(u.id, u.nombre)} className="p-2 bg-rose-600/20 text-rose-300 border border-rose-500/30 hover:bg-rose-600 hover:text-white rounded-xl text-xs font-black cursor-pointer">
                                                                        🗑️
                                                                    </button>
                                                                </Tooltip>
                                                            )}
                                                        </div>
                                                    </div>

                                                    {u.rol !== 'ADMIN_PRINCIPAL' && (
                                                        <div className="pt-2.5 border-t border-slate-200 dark:border-slate-800 grid grid-cols-2 sm:grid-cols-4 gap-2">
                                                            {[
                                                                { key: 'asignar', label: 'Asignar' },
                                                                { key: 'productos', label: 'Maestro' },
                                                                { key: 'deshabilitados', label: 'Deshab.' },
                                                                { key: 'personal', label: 'Personal' }
                                                            ].map(p => {
                                                                const activo = !!u.permisos?.[p.key];
                                                                return (
                                                                    <Tooltip key={p.key} text={`Permiso: ${p.label}`} position="top">
                                                                        <button
                                                                            type="button"
                                                                            onClick={() => handleTogglePermisoDirecto(u, p.key)}
                                                                            className={`w-full px-2.5 py-1.5 rounded-xl text-[10px] font-black border flex items-center justify-between cursor-pointer transition-all ${activo ? 'bg-indigo-500/20 border-indigo-500/50 text-indigo-300 shadow-sm' : modoClaro ? 'bg-white border-slate-300 text-slate-400' : 'bg-slate-900/40 border-slate-800 text-slate-500'}`}
                                                                        >
                                                                            <span>{p.label}</span>
                                                                            <span>{activo ? '✅' : '❌'}</span>
                                                                        </button>
                                                                    </Tooltip>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* PESTAÑA: ASIGNAR PRODUCTOS */}
                        {tabActiva === 'asignar' && tienePermiso('asignar') && (
                            <section className={`animate-tab ${modoClaro ? 'bg-white border-slate-200 text-slate-800' : 'bg-slate-900/60 border-slate-800/80 text-slate-100'} p-6 md:p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-xl`}>
                                <div className="border-b border-slate-200 dark:border-slate-800/60 pb-3.5">
                                    <h2 className="text-lg md:text-xl font-black flex items-center gap-2.5">
                                        <span className="p-2 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-sm">🔗</span> Asignación de Productos
                                    </h2>
                                    <p className={`text-xs ${modoClaro ? 'text-slate-500' : 'text-slate-400'} mt-1`}>Selecciona un producto, elige su serie específica y asígnalo a los colaboradores.</p>
                                </div>

                                <form onSubmit={handleConfirmarAsignacionMultiple} className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        <div className="space-y-2.5">
                                            <label className="block text-[11px] font-black uppercase text-indigo-400 tracking-wider">
                                                1. Seleccionar Productos ({Object.keys(prodSeleccionadosAsigMap).length} marcados)
                                            </label>
                                            <div className={`max-h-72 overflow-y-auto p-3.5 rounded-2xl ${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} border space-y-2.5 shadow-inner`}>
                                                {productosPadresLibresAsignacion.length === 0 ? (
                                                    <p className="text-xs text-slate-500 font-bold p-4 text-center">No hay stock libre disponible.</p>
                                                ) : (
                                                    productosPadresLibresAsignacion.map(pPadre => {
                                                        const isChecked = !!prodSeleccionadosAsigMap[pPadre.sku];
                                                        const configActual = prodSeleccionadosAsigMap[pPadre.sku];
                                                        const serieObjElegido = isChecked ? pPadre.seriesLibres.find(s => (s.serie || 'Sin Serie').trim().toUpperCase() === (configActual.serieElegida || 'Sin Serie').trim().toUpperCase()) : null;
                                                        const maxCantSerie = serieObjElegido ? serieObjElegido.cantidad : pPadre.cantidadTotalLibre;

                                                        return (
                                                            <div key={pPadre.sku} className={`p-3.5 rounded-2xl border transition-all space-y-2.5 ${isChecked ? 'bg-indigo-500/15 border-indigo-500/60 shadow-md' : modoClaro ? 'bg-white border-slate-200 hover:border-slate-300' : 'bg-slate-900/60 border-slate-800/80 hover:border-slate-700'}`}>
                                                                <div className="flex items-center justify-between gap-3">
                                                                    <div className="flex items-center gap-3">
                                                                        <input 
                                                                            type="checkbox" 
                                                                            checked={isChecked} 
                                                                            onChange={() => toggleProductoPadreSeleccionado(pPadre.sku, pPadre.seriesLibres)} 
                                                                            className="w-4 h-4 accent-indigo-600 rounded cursor-pointer"
                                                                        />
                                                                        <div>
                                                                            <div className={`text-xs font-extrabold ${modoClaro ? 'text-slate-800' : 'text-white'}`}>
                                                                                <span className="font-mono text-indigo-400 bg-indigo-500/10 px-1.5 py-0.5 rounded border border-indigo-500/30 mr-1.5">{pPadre.sku}</span>
                                                                                {pPadre.producto}
                                                                            </div>
                                                                            <div className="text-[10px] text-slate-400 font-bold mt-0.5">Libres: {pPadre.cantidadTotalLibre} unid.</div>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                {isChecked && (
                                                                    <div className="pt-2 border-t border-slate-200 dark:border-slate-800/80 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 animate-tab">
                                                                        <div className="flex-1">
                                                                            <label className="block text-[9px] font-black uppercase text-amber-400 mb-1">Serie / Variante:</label>
                                                                            <select 
                                                                                value={configActual.serieElegida} 
                                                                                onChange={e => updateSerieElegidaAsignacion(pPadre.sku, e.target.value)} 
                                                                                className={`w-full border rounded-xl px-3 py-2 text-xs font-mono font-bold outline-none ${modoClaro ? 'bg-white border-slate-300 text-amber-600' : 'bg-slate-800 border-slate-700 text-amber-300'}`}
                                                                            >
                                                                                {pPadre.seriesLibres.map((sHijo, hIdx) => (
                                                                                    <option key={hIdx} value={sHijo.serie}>
                                                                                        [{sHijo.serie}] - ({sHijo.cantidad} libre{sHijo.cantidad > 1 ? 's' : ''})
                                                                                    </option>
                                                                                ))}
                                                                            </select>
                                                                        </div>

                                                                        <div className="w-full sm:w-24">
                                                                            <label className="block text-[9px] font-black uppercase text-slate-400 mb-1">Cant/p:</label>
                                                                            <input 
                                                                                type="number" 
                                                                                min="1" 
                                                                                max={maxCantSerie} 
                                                                                value={configActual.cantidad} 
                                                                                onChange={e => updateCantAsignacionPadre(pPadre.sku, e.target.value)} 
                                                                                className={`w-full px-2 py-2 ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-800 border-slate-700 text-white'} border rounded-xl text-xs font-black text-center focus:border-indigo-500 outline-none`} 
                                                                            />
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })
                                                )}
                                            </div>
                                        </div>

                                        <div className="space-y-2.5">
                                            <label className="block text-[11px] font-black uppercase text-purple-400 tracking-wider">
                                                2. Seleccionar Colaboradores ({personalSeleccionados.length} marcados)
                                            </label>
                                            <div className={`max-h-72 overflow-y-auto p-3.5 rounded-2xl ${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} border space-y-2 shadow-inner`}>
                                                {personalList.length === 0 ? (
                                                    <p className="text-xs text-slate-500 font-bold p-4 text-center">No hay colaboradores registrados.</p>
                                                ) : (
                                                    personalList.map(pers => {
                                                        const isChecked = personalSeleccionados.includes(pers.nombre);
                                                        return (
                                                            <Tooltip key={pers.id} text={`Cargo: ${pers.cargo || 'Sin cargo'}`} position="top">
                                                                <div onClick={() => togglePersonalSeleccionado(pers.nombre)} className={`p-3 rounded-2xl border flex items-center justify-between gap-3 cursor-pointer transition-all ${isChecked ? 'bg-purple-500/15 border-purple-500/60 shadow-md' : modoClaro ? 'bg-white border-slate-200 hover:border-slate-300' : 'bg-slate-900/60 border-slate-800/80 hover:border-slate-700'}`}>
                                                                    <div className="flex items-center gap-3">
                                                                        <input 
                                                                            type="checkbox" 
                                                                            checked={isChecked} 
                                                                            onChange={() => {}} 
                                                                            className="w-4 h-4 accent-purple-600 rounded cursor-pointer"
                                                                        />
                                                                        <Avatar nombre={pers.nombre} />
                                                                        <span className={`text-xs font-black ${modoClaro ? 'text-slate-800' : 'text-white'}`}>{pers.nombre}</span>
                                                                    </div>
                                                                    <span className="text-[10px] font-bold text-slate-400">{pers.cargo || 'Sin cargo'}</span>
                                                                </div>
                                                            </Tooltip>
                                                        );
                                                    })
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-3.5 pt-3 border-t border-slate-200 dark:border-slate-800/80">
                                        <div>
                                            <label className={`block text-[11px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Observaciones Generales (Opcional)</label>
                                            <input type="text" placeholder="Ej. Entrega para sede principal" value={obsAsignacion} onChange={e => setObsAsignacion(e.target.value)} className={`w-full ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700/80 text-white'} border rounded-2xl px-4 py-3 text-xs font-semibold outline-none focus:border-indigo-500`} />
                                        </div>

                                        <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 cursor-pointer text-xs btn-haptic border border-indigo-400/30">
                                            Confirmar Asignación ({Object.keys(prodSeleccionadosAsigMap).length} Productos ➔ {personalSeleccionados.length} Personales)
                                        </button>
                                    </div>
                                </form>
                            </section>
                        )}

                        {/* PESTAÑA: MAESTRO PRODUCTOS */}
                        {tabActiva === 'productos' && tienePermiso('productos') && (
                            <div className="space-y-6 animate-tab">
                                <section className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-gradient-to-r from-indigo-950/50 via-slate-900/90 to-purple-950/50 border-indigo-500/30'} p-6 md:p-8 rounded-3xl border backdrop-blur-xl space-y-4 shadow-xl`}>
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h2 className="text-lg md:text-xl font-black flex items-center gap-2.5">
                                                <span className="p-2 rounded-xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-sm">📊</span> Maestro Productos y Gestión CSV
                                            </h2>
                                            <p className={`text-xs ${modoClaro ? 'text-slate-500' : 'text-slate-400'} mt-1`}>Exporta o sincroniza tu inventario por Series / Clasificación sin duplicar SKUs.</p>
                                        </div>
                                        <button onClick={descargarInventarioCSV} className="px-4 py-2.5 rounded-xl font-black text-xs bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30 cursor-pointer flex items-center gap-2 btn-haptic border border-indigo-400/20">
                                            <span>📥</span> Exportar Maestro CSV
                                        </button>
                                    </div>
                                    <div className={`p-5 rounded-2xl border border-dashed ${modoClaro ? 'border-slate-300 bg-slate-50' : 'border-slate-700 bg-slate-950/60'} flex flex-col sm:flex-row items-center justify-between gap-4`}>
                                        <div className="flex items-center gap-3">
                                            <span className="text-xl">📂</span>
                                            <div>
                                                <p className={`text-xs font-black ${modoClaro ? 'text-slate-800' : 'text-slate-200'}`}>Importar catálogo completo desde CSV</p>
                                                <p className={`text-[10px] font-mono mt-0.5 ${modoClaro ? 'text-slate-500' : 'text-slate-400'}`}>SKU; Serie_Clasificacion; Categoria; Producto; Cantidad; Observaciones; Estado</p>
                                            </div>
                                        </div>
                                        <input type="file" accept=".csv" onChange={handleImportarCSV} className="text-xs font-semibold text-slate-400 file:mr-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-black file:cursor-pointer transition file:bg-indigo-600 file:text-white hover:file:bg-indigo-500" />
                                    </div>
                                </section>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <section className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-6 rounded-3xl border backdrop-blur-xl space-y-5 shadow-xl flex flex-col justify-between`}>
                                        <div className="space-y-5">
                                            <h2 className="text-sm font-black flex items-center gap-2"><span className="p-2 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">📦</span> Registrar / Agregar Serie</h2>
                                            <form onSubmit={handleSaveProducto} id="form-nuevo-prod" className="space-y-3.5">
                                                
                                                <div>
                                                    <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>¿Agregar a Producto Existente?</label>
                                                    <select value={productoExistenteSKU} onChange={e => handleSeleccionarProductoExistente(e.target.value)} className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`}>
                                                        <option value="">-- No, crear producto NUEVO --</option>
                                                        {productosUnicosGlobalList.map(item => (
                                                            <option key={item.sku} value={item.sku}>
                                                                {item.sku} - {item.producto}
                                                            </option>
                                                        ))}
                                                    </select>
                                                </div>

                                                <div>
                                                    <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>SKU</label>
                                                    <input type="text" value={productoExistenteSKU ? productoExistenteSKU : generarSKU()} disabled className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-mono font-black ${modoClaro ? 'bg-slate-100 border-slate-300 text-indigo-600' : 'bg-slate-800/90 border-slate-700 text-indigo-400'} shadow-inner cursor-not-allowed`} />
                                                </div>

                                                <div>
                                                    <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Categoría</label>
                                                    {!creandoCategoria ? (
                                                        <div className="flex gap-2">
                                                            <select value={formProducto.categoria} onChange={e => setFormProducto({...formProducto, categoria: e.target.value, serie: ''})} disabled={!!productoExistenteSKU} className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'} ${productoExistenteSKU ? 'opacity-60 cursor-not-allowed' : ''}`} required>
                                                                <option value="">-- Seleccionar Categ. --</option>
                                                                {categoriasList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                            </select>
                                                            {!productoExistenteSKU && (
                                                                <button type="button" onClick={() => setCreandoCategoria(true)} className="px-3 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-black whitespace-nowrap cursor-pointer btn-haptic">Categorías</button>
                                                            )}
                                                        </div>
                                                    ) : (
                                                        <div className={`p-3 rounded-xl ${modoClaro ? 'bg-slate-100 border-slate-300' : 'bg-slate-950 border-slate-800'} border space-y-2.5 shadow-inner`}>
                                                            <div className="flex gap-2">
                                                                <input type="text" placeholder="Nueva categoría..." value={nuevaCatNombre} onChange={e => setNuevaCatNombre(e.target.value)} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-800 border-slate-700 text-white'} border rounded-lg px-2.5 py-1.5 text-xs`} />
                                                                <button type="button" onClick={handleGuardarNuevaCategoria} className="px-3 bg-emerald-600 text-white rounded-lg text-xs font-black cursor-pointer">OK</button>
                                                                <button type="button" onClick={() => setCreandoCategoria(false)} className="px-3 bg-slate-700 text-slate-300 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                            </div>

                                                            <div className="pt-2 border-t border-slate-300 dark:border-slate-800">
                                                                <p className="text-[9px] font-black uppercase text-slate-400 mb-1">Categorías en BD (clic para eliminar):</p>
                                                                <div className="max-h-24 overflow-y-auto space-y-1">
                                                                    {categoriasList.map(c => (
                                                                        <div key={c.id} className="flex justify-between items-center bg-slate-900 px-2 py-0.5 rounded text-[11px]">
                                                                            <span className="text-slate-200">{c.nombre}</span>
                                                                            <button type="button" onClick={() => handleEliminarCategoriaGlobal(c.id, c.nombre)} className="text-[9px] text-rose-400 font-bold hover:underline">Eliminar</button>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>

                                                <div>
                                                    <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Nombre del Producto</label>
                                                    <input type="text" placeholder="Ej. Laptop HP" value={formProducto.producto} onChange={e => setFormProducto({...formProducto, producto: e.target.value})} disabled={!!productoExistenteSKU} className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'} ${productoExistenteSKU ? 'opacity-60 cursor-not-allowed' : ''}`} required />
                                                </div>

                                                <div>
                                                    <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Serie / Clasificación</label>
                                                    {productoExistenteSKU ? (
                                                        <input 
                                                            type="text" 
                                                            placeholder="Escribe la nueva serie" 
                                                            value={formProducto.serie} 
                                                            onChange={e => setFormProducto({ ...formProducto, serie: e.target.value })} 
                                                            className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-mono font-bold uppercase outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-amber-600' : 'bg-slate-800/80 border-slate-700 text-amber-300'}`} 
                                                            required 
                                                        />
                                                    ) : (
                                                        !creandoSerie ? (
                                                            <div className="flex gap-2">
                                                                <select value={formProducto.serie} onChange={e => setFormProducto({...formProducto, serie: e.target.value})} className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-amber-600' : 'bg-slate-800/80 border-slate-700 text-amber-300'} font-mono`}>
                                                                    <option value="">-- Sin Serie --</option>
                                                                    {seriesPorCategoria.map((serieNombre, sIdx) => (
                                                                        <option key={sIdx} value={serieNombre}>{serieNombre}</option>
                                                                    ))}
                                                                </select>
                                                                <button type="button" onClick={() => setCreandoSerie(true)} className="px-3 py-2.5 bg-amber-600/20 text-amber-400 hover:bg-amber-600 hover:text-white rounded-xl text-xs font-black whitespace-nowrap cursor-pointer btn-haptic border border-amber-500/30">Series</button>
                                                            </div>
                                                        ) : (
                                                            <div className={`p-3 rounded-xl ${modoClaro ? 'bg-slate-100 border-slate-300' : 'bg-slate-950 border-slate-800'} border space-y-2.5 shadow-inner`}>
                                                                <div className="flex gap-2">
                                                                    <input type="text" placeholder="Ej. HP-001" value={nuevaSerieNombre} onChange={e => setNuevaSerieNombre(e.target.value)} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-800 border-slate-700 text-white'} border rounded-lg px-2.5 py-1.5 text-xs uppercase font-mono`} />
                                                                    <button type="button" onClick={handleGuardarNuevaSerie} className="px-3 bg-emerald-600 text-white rounded-lg text-xs font-black cursor-pointer">OK</button>
                                                                    <button type="button" onClick={() => setCreandoSerie(false)} className="px-3 bg-slate-700 text-slate-300 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                                </div>

                                                                <div className="pt-2 border-t border-slate-300 dark:border-slate-800">
                                                                    <p className="text-[9px] font-black uppercase text-slate-400 mb-1">Series en BD (clic para eliminar):</p>
                                                                    <div className="max-h-24 overflow-y-auto space-y-1">
                                                                        {seriesList.length === 0 ? (
                                                                            <p className="text-[9px] text-slate-500">Sin series.</p>
                                                                        ) : (
                                                                            seriesList.map(s => (
                                                                                <div key={s.id} className="flex justify-between items-center bg-slate-900 px-2 py-0.5 rounded text-[11px]">
                                                                                    <span className="font-mono text-amber-400">{s.nombre}</span>
                                                                                    <button type="button" onClick={() => handleEliminarSerieGlobal(s.id, s.nombre)} className="text-[9px] text-rose-400 font-bold hover:underline">Eliminar</button>
                                                                                </div>
                                                                            ))
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )
                                                    )}
                                                </div>

                                                <div>
                                                    <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Cantidad Inicial Libre</label>
                                                    <input type="number" min="1" placeholder="Ej. 5" value={formProducto.cantidad} onChange={e => setFormProducto({...formProducto, cantidad: e.target.value})} className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`} required />
                                                </div>
                                            </form>
                                        </div>
                                        <button type="submit" form="form-nuevo-prod" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-xl shadow-md shadow-indigo-600/35 cursor-pointer mt-4 btn-haptic border border-indigo-400/20 text-xs">
                                            {productoExistenteSKU ? 'Guardar Nueva Serie' : 'Guardar Producto Nuevo'}
                                        </button>
                                    </section>

                                    {/* REABASTECER */}
                                    <section className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-6 rounded-3xl border backdrop-blur-xl space-y-5 shadow-xl flex flex-col justify-between`}>
                                        <div className="space-y-5">
                                            <h2 className="text-sm font-black flex items-center gap-2"><span className="p-2 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">➕</span> Reabastecer Stock</h2>
                                            <form onSubmit={handleRestockProducto} id="form-restock" className="space-y-3.5">
                                                <div>
                                                    <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>1. Seleccionar Producto</label>
                                                    <select value={formRestock.sku} onChange={e => { setFormRestock({...formRestock, sku: e.target.value, serie: ''}); }} className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`} required>
                                                        <option value="">-- Elige Producto --</option>
                                                        {productosUnicosGlobalList.map(item => <option key={item.sku} value={item.sku}>{item.sku} - {item.producto}</option>)}
                                                    </select>
                                                </div>

                                                {productoSeleccionadoRestock && (
                                                    <div className="space-y-3 animate-tab">
                                                        <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex justify-between items-center text-xs font-black shadow-inner">
                                                            <span className="text-emerald-400">Total Almacén:</span>
                                                            <span className="bg-emerald-600 text-white px-2.5 py-0.5 rounded-lg text-[11px]">{productoSeleccionadoRestock.cantidadTotal} unid.</span>
                                                        </div>

                                                        <div>
                                                            <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>2. Seleccionar Serie</label>
                                                            <select value={formRestock.serie} onChange={e => setFormRestock({...formRestock, serie: e.target.value})} className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-amber-600' : 'bg-slate-800/80 border-slate-700 text-amber-300'} font-mono`}>
                                                                <option value="">-- Sin Serie Específica --</option>
                                                                {productoSeleccionadoRestock.seriesHijos.map((hijo, hIdx) => (
                                                                    <option key={hIdx} value={hijo.serie}>{hijo.serie}</option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                    </div>
                                                )}

                                                <div>
                                                    <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Unidades a Sumar</label>
                                                    <input type="number" min="1" placeholder="Ej. 10" value={formRestock.cantidadExtra} onChange={e => setFormRestock({...formRestock, cantidadExtra: e.target.value})} className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`} required />
                                                </div>
                                            </form>
                                        </div>
                                        <button type="submit" form="form-restock" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl shadow-md shadow-emerald-600/35 cursor-pointer mt-4 btn-haptic border border-emerald-400/20 text-xs">Sumar Stock</button>
                                    </section>

                                    {/* DESHABILITAR */}
                                    <section className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-6 rounded-3xl border backdrop-blur-xl space-y-5 shadow-xl flex flex-col justify-between`}>
                                        <div className="space-y-5">
                                            <h2 className="text-sm font-black flex items-center gap-2"><span className="p-2 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20">🚫</span> Deshabilitar Producto</h2>
                                            
                                            <form onSubmit={handleDeshabilitarProducto} id="form-deshabilitar" className="space-y-3.5">
                                                <div>
                                                    <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>1. Seleccionar Producto</label>
                                                    <select value={skuADeshabilitar} onChange={e => { setSkuADeshabilitar(e.target.value); setSerieADeshabilitar('TODAS'); }} className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`} required>
                                                        <option value="">-- Elige Producto --</option>
                                                        {productosUnicosGlobalList.filter(p => p.cantidadDeshabilitada < p.cantidadTotal).map(item => <option key={item.sku} value={item.sku}>{item.sku} - {item.producto}</option>)}
                                                    </select>
                                                </div>

                                                {productoSeleccionadoDeshabilitar && (
                                                    <div className="space-y-3 animate-tab">
                                                        <div>
                                                            <label className={`block text-[10px] font-black uppercase mb-1 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>2. Seleccionar Serie</label>
                                                            <select value={serieADeshabilitar} onChange={e => setSerieADeshabilitar(e.target.value)} className={`w-full border rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-rose-600' : 'bg-slate-800/80 border-slate-700 text-rose-300'} font-mono`}>
                                                                <option value="TODAS">-- TODAS LAS SERIES --</option>
                                                                {productoSeleccionadoDeshabilitar.seriesHijos.map((hijo, hIdx) => (
                                                                    <option key={hIdx} value={hijo.serie}>[{hijo.serie}] ({hijo.cantidadTotal} unid.)</option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                    </div>
                                                )}
                                            </form>
                                        </div>
                                        <button type="submit" form="form-deshabilitar" className="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-3 rounded-xl shadow-md shadow-rose-600/35 cursor-pointer mt-4 btn-haptic border border-rose-400/20 text-xs">Deshabilitar Selección</button>
                                    </section>
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA: DESHABILITADOS */}
                        {tabActiva === 'deshabilitados' && tienePermiso('deshabilitados') && (
                            <section className={`animate-tab ${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-6 md:p-8 rounded-3xl border backdrop-blur-xl space-y-5 shadow-xl`}>
                                <div>
                                    <h2 className="text-lg md:text-xl font-black">🚫 Productos y Series Deshabilitadas</h2>
                                    <p className={`text-xs ${modoClaro ? 'text-slate-500' : 'text-slate-400'}`}>Reactivación o eliminación definitiva de stock deshabilitado.</p>
                                </div>
                                <div className="space-y-3">
                                    {productosDeshabilitados.length === 0 ? (
                                        <p className="text-xs font-bold text-slate-500 py-6 text-center">No hay registros deshabilitados.</p>
                                    ) : (
                                        productosDeshabilitados.map(item => (
                                            <div key={item.key} className={`${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} border p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 transition-all hover:border-slate-400`}>
                                                <div>
                                                    <div className="font-black text-indigo-400 font-mono text-xs">
                                                        {item.sku} - {item.producto}
                                                        {item.serie && <span className="ml-2 font-mono text-amber-400 text-[11px]">[{item.serie}]</span>}
                                                    </div>
                                                    <div className={`text-[11px] ${modoClaro ? 'text-slate-600' : 'text-slate-400'} mt-0.5`}>
                                                        Categoría: <strong>{item.categoria}</strong> • Serie: <strong className="text-amber-400">{item.serie || 'Sin Serie'}</strong> • Deshab: <strong>{item.cantidadTotal} unid.</strong>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => handleReactivarProducto(item)} className="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-black cursor-pointer shadow-md btn-haptic">
                                                        Reactivar
                                                    </button>
                                                    <button onClick={() => handleEliminarDefinitivo(item)} className="px-3 py-2 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-black cursor-pointer hover:bg-rose-600 hover:text-white shadow-md btn-haptic">
                                                        Eliminar
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </section>
                        )}

                        {/* PESTAÑA: PERSONAL (GRID INVERTIDO: FORMULARIO A LA IZQUIERDA / LISTA A LA DERECHA) */}
                        {tabActiva === 'personal' && tienePermiso('personal') && (
                            <section className={`animate-tab ${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-6 md:p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-xl`}>
                                <div>
                                    <h2 className="text-lg md:text-xl font-black flex items-center gap-2.5">
                                        <span className="p-2 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-sm">👥</span> Gestión del Personal
                                    </h2>
                                    <p className={`text-xs ${modoClaro ? 'text-slate-500' : 'text-slate-400'} mt-1`}>Administra el personal registrado y agrega nuevos colaboradores al equipo.</p>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
                                    {/* FORMULARIO AGREGAR COLABORADOR (IZQUIERDA) */}
                                    <div className={`${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} p-6 rounded-2xl border space-y-4 shadow-inner`}>
                                        <h3 className="text-xs font-black text-indigo-400 uppercase tracking-wider">➕ Agregar Colaborador</h3>
                                        <form onSubmit={handleSavePersonal} className="space-y-4">
                                            <div>
                                                <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Nombre Completo</label>
                                                <input type="text" placeholder="Ej. Leandro Zamora" value={formPersonal.nombre} onChange={e => setFormPersonal({...formPersonal, nombre: e.target.value})} className={`w-full border rounded-xl px-4 py-3 text-xs font-semibold outline-none focus:border-indigo-500 ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700/80 text-white'}`} required />
                                            </div>
                                            <div>
                                                <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Cargo</label>
                                                {!creandoCargo ? (
                                                    <div className="flex gap-2">
                                                        <select value={formPersonal.cargo} onChange={e => setFormPersonal({...formPersonal, cargo: e.target.value})} className={`w-full border rounded-xl px-4 py-3 text-xs font-semibold outline-none focus:border-indigo-500 ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700/80 text-white'}`} required>
                                                            <option value="">-- Seleccionar Cargo --</option>
                                                            {cargosList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                        </select>
                                                        <button type="button" onClick={() => setCreandoCargo(true)} className="px-4 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-black cursor-pointer btn-haptic border border-indigo-400/20">Cargos</button>
                                                    </div>
                                                ) : (
                                                    <div className={`p-3.5 rounded-xl ${modoClaro ? 'bg-slate-100 border-slate-300' : 'bg-slate-900 border-slate-800'} border space-y-2.5 shadow-inner`}>
                                                        <div className="flex gap-2">
                                                            <input type="text" placeholder="Escribe cargo..." value={nuevoCargoNombre} onChange={e => setNuevoCargoNombre(e.target.value)} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-800 border-slate-700 text-white'} rounded-lg px-3 py-2 text-xs`} />
                                                            <button type="button" onClick={handleGuardarNuevoCargo} className="px-3 bg-emerald-600 text-white rounded-lg text-xs font-black cursor-pointer">OK</button>
                                                            <button type="button" onClick={() => setCreandoCargo(false)} className="px-3 bg-slate-700 text-slate-300 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                        </div>
                                                        <div className="pt-2 border-t border-slate-300 dark:border-slate-800">
                                                            <p className="text-[9px] font-black uppercase text-slate-400 mb-1">Cargos en BD (clic para eliminar):</p>
                                                            <div className="max-h-28 overflow-y-auto space-y-1">
                                                                {cargosList.map(c => (
                                                                    <div key={c.id} className="flex justify-between items-center bg-slate-950 px-2 py-1 rounded text-[11px]">
                                                                        <span className="text-slate-200">{c.nombre}</span>
                                                                        <button type="button" onClick={() => handleEliminarCargoGlobal(c.id, c.nombre)} className="text-[9px] text-rose-400 font-bold hover:underline">Eliminar</button>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                            <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-black py-3.5 rounded-xl shadow-md shadow-indigo-600/30 cursor-pointer btn-haptic border border-indigo-400/20 text-xs">Guardar Colaborador</button>
                                        </form>
                                    </div>

                                    {/* LISTA DE PERSONAL DETALLADA (DERECHA) */}
                                    <div className={`${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} p-6 rounded-2xl border space-y-4 shadow-inner`}>
                                        <div className="flex justify-between items-center">
                                            <h3 className="text-xs font-black text-indigo-400 uppercase tracking-wider">📋 Personal Registrado ({personalList.length})</h3>
                                        </div>

                                        <div className="space-y-3 max-h-[420px] overflow-y-auto pr-1">
                                            {personalList.length === 0 ? (
                                                <p className="text-xs text-slate-500 font-bold p-6 text-center">No hay personal registrado.</p>
                                            ) : (
                                                personalList.map(pers => (
                                                    <div key={pers.id} className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/80 border-slate-800/80'} border p-3.5 rounded-xl flex items-center justify-between gap-3 shadow-sm hover:border-indigo-500/40 transition-all`}>
                                                        <div className="flex items-center gap-3">
                                                            <Avatar nombre={pers.nombre} />
                                                            <div>
                                                                <span className={`block text-xs font-black ${modoClaro ? 'text-slate-800' : 'text-white'}`}>{pers.nombre}</span>
                                                                <span className="text-[10px] font-bold text-indigo-400">{pers.cargo || 'Sin cargo'}</span>
                                                            </div>
                                                        </div>

                                                        <button 
                                                            onClick={() => handleDeletePersonal(pers.id, pers.nombre)} 
                                                            className="px-3 py-1.5 bg-rose-600/20 text-rose-300 border border-rose-500/30 hover:bg-rose-600 hover:text-white rounded-xl text-xs font-black cursor-pointer transition-all btn-haptic shrink-0"
                                                        >
                                                            Eliminar
                                                        </button>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* HISTORIAL */}
                        {mostrarHistorial && (
                            <section className={`animate-tab ${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} rounded-3xl border backdrop-blur-xl overflow-hidden shadow-xl transition-all`}>
                                <div className="p-5 md:p-6 border-b border-slate-200 dark:border-slate-800/80 space-y-3">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                        <div>
                                            <h2 className="text-lg md:text-xl font-black">📜 Historial</h2>
                                            <p className={`text-xs ${modoClaro ? 'text-slate-500' : 'text-slate-400'}`}>Registro de asignaciones y eventos</p>
                                        </div>
                                        <div className="w-full sm:w-auto">
                                            <input type="text" placeholder="🔍 Buscar SKU, serie, nombre..." value={busquedaInput} onChange={e => setBusquedaInput(e.target.value)} className={`w-full sm:w-60 ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700/80 text-white'} rounded-xl px-3.5 py-2 text-xs outline-none focus:border-indigo-500 shadow-inner`} />
                                        </div>
                                    </div>
                                </div>

                                <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className={`${modoClaro ? 'bg-slate-100 text-slate-600' : 'bg-slate-950/95 text-slate-400'} backdrop-blur-md sticky top-0 text-[11px] font-black uppercase border-b border-slate-200 dark:border-slate-800/80 z-10`}>
                                                <th className="p-3.5">Fecha / Hora</th>
                                                <th className="p-3.5">SKU / Serie</th>
                                                <th className="p-3.5">Categoría</th>
                                                <th className="p-3.5">Producto</th>
                                                <th className="p-3.5">Cantidad</th>
                                                <th className="p-3.5">Asignado A</th>
                                                <th className="p-3.5 text-center">Detalle</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 dark:divide-slate-800/60 text-xs">
                                            {loading ? (
                                                <React.Fragment>
                                                    <SkeletonRow />
                                                    <SkeletonRow />
                                                </React.Fragment>
                                            ) : historialFiltrado.length === 0 ? (
                                                <tr><td colSpan="7" className="p-6 text-center text-slate-500 font-bold">No hay registros de asignaciones.</td></tr>
                                            ) : (
                                                historialFiltrado.map((grupo, index) => {
                                                    const { fechaStr, horaStr } = formatearFechaClean(grupo);
                                                    const estaExpandido = !!lotesExpandidosMap[grupo.loteKey];

                                                    if (grupo.esLote) {
                                                        return (
                                                            <React.Fragment key={grupo.loteKey || index}>
                                                                <tr className={`${modoClaro ? 'bg-indigo-50 hover:bg-indigo-100/60' : 'bg-indigo-950/20 hover:bg-indigo-950/40'} transition-colors border-l-4 border-l-indigo-500`}>
                                                                    <td className="p-3.5 whitespace-nowrap">
                                                                        <div className="flex flex-col gap-0.5">
                                                                            <span className="text-[11px] font-bold text-indigo-400">📅 {fechaStr}</span>
                                                                            <span className="text-[9px] font-mono text-slate-400">⏰ {horaStr}</span>
                                                                        </div>
                                                                    </td>
                                                                    <td className="p-3.5 font-mono font-black text-purple-400">
                                                                        <span className="bg-purple-500/10 px-2 py-0.5 rounded border border-purple-500/30 text-[10px]">ASIGNACIÓN</span>
                                                                    </td>
                                                                    <td className="p-3.5 text-slate-400">Varios</td>
                                                                    <td className="p-3.5 font-bold text-indigo-400">{grupo.prodsCount} Prod.</td>
                                                                    <td className="p-3.5 font-black">
                                                                        <span className="px-2 py-0.5 bg-purple-500/10 text-purple-400 border border-purple-500/30 rounded text-[11px]">{grupo.cantTotal} unid.</span>
                                                                    </td>
                                                                    <td className="p-3.5">
                                                                        <span className="px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded text-[11px] font-bold">👥 {grupo.persCount} Colab.</span>
                                                                    </td>
                                                                    <td className="p-3.5 text-center">
                                                                        <button onClick={() => toggleLoteExpandido(grupo.loteKey)} className="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-[11px] font-black shadow-sm transition-all cursor-pointer btn-haptic border border-indigo-400/20">
                                                                            {estaExpandido ? 'Ocultar' : 'Ver Detalle'}
                                                                        </button>
                                                                    </td>
                                                                </tr>

                                                                {estaExpandido && (
                                                                    <tr>
                                                                        <td colSpan="7" className={`p-3.5 ${modoClaro ? 'bg-slate-100' : 'bg-slate-950/90'} border-b border-indigo-500/30`}>
                                                                            <div className={`p-4 rounded-2xl ${modoClaro ? 'bg-white' : 'bg-slate-900/90'} border border-indigo-500/30 space-y-3 shadow-inner`}>
                                                                                <div className="flex justify-between items-center text-[11px] font-black text-indigo-400 border-b border-slate-200 dark:border-slate-800 pb-2">
                                                                                    <span>Desglose por Producto</span>
                                                                                    <span className="text-slate-400 font-normal">Obs: {grupo.observaciones}</span>
                                                                                </div>
                                                                                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                                                                    {grupo.productosAgrupadosLote.map((prodAgrup, pIdx) => (
                                                                                        <div key={pIdx} className={`p-3 rounded-xl border ${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950 border-slate-800/80'} flex flex-col sm:flex-row justify-between sm:items-center text-[11px] gap-2`}>
                                                                                            <div className="flex items-center gap-2.5">
                                                                                                <span className="font-mono font-black text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/30">{prodAgrup.sku}</span>
                                                                                                <div>
                                                                                                    <div className={`font-bold ${modoClaro ? 'text-slate-800' : 'text-white'}`}>
                                                                                                        {prodAgrup.producto}
                                                                                                        {prodAgrup.serie && <span className="ml-1.5 font-mono text-amber-400">[{prodAgrup.serie}]</span>}
                                                                                                    </div>
                                                                                                </div>
                                                                                            </div>
                                                                                            <div className="flex items-center gap-2 flex-wrap">
                                                                                                <span className="bg-indigo-500/10 text-indigo-300 px-2.5 py-0.5 rounded border border-indigo-500/30 font-black">{prodAgrup.cantidadTotal} unid.</span>
                                                                                                <div className="flex items-center gap-1 flex-wrap">
                                                                                                    {prodAgrup.colaboradores.map((colab, cIdx) => (
